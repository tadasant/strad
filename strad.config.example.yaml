# strad configuration
#
# The core ships with ZERO MCP servers. This file is the ONLY place you attach
# them, and attaching one is a single entry under `servers:`.
#
# Secret VALUES never appear here. `${NAME}` resolves against the environment at
# boot — and those env vars are injected by CI from GCP Secret Manager
# (`strad-<env>-<NAME>`) as App Platform SECRET env vars. The container itself
# holds no cloud credentials.
#
# This file is an EXAMPLE: it shows every shape the schema allows, with fewer
# servers than a real deployment. infra/strad.staging.yaml is the real one — 27
# server slugs across 3 App Platform components.

version: 1

gateway:
  name: strad
  env: staging
  publicUrl: https://staging.strad.tadasant.com

  # Where every ${NAME} below resolves from, and WHEN. One provider per
  # deployment, on purpose: two ways to manage a credential means one of them is
  # out of date and nobody knows which.
  secrets:
    # env (the default) — resolve from the process environment. No vendor, no
    #   cloud account; `npm run dev` and CI both run on this. Secrets reach the
    #   container as deploy-time SECRET env vars and the container holds no cloud
    #   credential. Rotating one does nothing until the deploy runs again.
    #
    # gcp-parameter-store — resolve from /strad/{env}/gateway/static/ AT RUNTIME.
    #   Add or rotate a secret and it reaches production with no deploy. The app
    #   spec then carries exactly one secret: the key the gateway uses to reach
    #   the store (STRAD_PARAMS_RESOLVER_SERVICE_ACCOUNT_KEY_JSON). A key cannot
    #   be kept behind the lock it opens; that is the only exception.
    provider: env

    # Bounds how long a ROTATION can go unnoticed. The snapshot of the namespace
    # is refreshed on the first read after it goes stale. It also bounds how
    # stale the console's and /api/secrets/readiness's store diagnosis may be,
    # capped at 60s there — that answer is a health signal, and this accepts an
    # hour. Both surfaces print how old the reading they served is.
    ttlSeconds: 60

    # Bounds how long an ADDITION can go unnoticed. A miss forces one
    # out-of-band refresh, rate limited so an unknown ${REF} on a hot path
    # cannot list the store once per request.
    negativeTtlSeconds: 10

    # Keep process.env behind the store, so names can be migrated one at a time
    # with no window where a name resolves from neither. Set false once the move
    # is done, to make "the store is the only source" enforceable.
    envFallback: true

auth:
  # Humans. Verified against the Google Workspace `hd` claim — NOT the email
  # suffix, which a personal account can spell however it likes.
  google:
    enabled: true
    hostedDomain: tadasant.com
    roles: [admin]

  # Machines. `strad_<env>_<pubid>_<secret>`; only the SHA-256 is stored.
  # Mint with: npm run token:mint -- --label "my agent" --roles admin
  staticTokens:
    enabled: true
    # Reserved: no code reads it. `env` (a JSON array in STRAD_TOKENS) is the
    # only implementation, and the gateway builds it from `enabled` alone. It is
    # here so a DB-backed store arrives as a new value, not a new key.
    # See HACKS.md #6.
    store: env

  # Temporary: lets a human into /console with ADMIN_BOOTSTRAP_TOKEN while
  # Google OAuth credentials are being provisioned. Requires ALLOW_DEV_AUTH=true.
  # It CANNOT authenticate /mcp. Delete once OAuth lands — see HACKS.md.
  consoleDevBypass:
    enabled: true
    roles: [admin]

# A role names the servers it may reach. `*` means every configured server.
# Both directions must agree: the role must name the server, AND the server must
# list the role under `entitlements`. Neither side can grant access alone — see
# `readonly` below, which names `slack-readonly`, and `slack-readonly`, which
# names `readonly` back.
roles:
  admin:
    servers: ["*"]
  readonly:
    servers: [echo, slack-readonly]

# Deployment groups. `core` is implicit (the public gateway); every bundle below
# becomes an internal-only App Platform component on the private network.
#
# There is exactly ONE here, and that is the whole shape of the current design:
# every supplementary MCP server runs in one container, off one image, and the
# gateway proxies to each on its own path. strad deploys 2 components in total —
# `core` and this.
bundles:
  - name: bundle
    # 2GB because this container holds a real Chromium (the browser servers share
    # ONE, ~940MB RSS for its process tree) alongside every API server, and 1GB is
    # one bad page render from an OOM that takes every server down with it. The
    # binding constraint is CPU, not RAM: 1 shared vCPU serialises Chromium's
    # rendering while the same box answers every Slack call. If the telemetry
    # shows event-loop lag, the next move is a dedicated CPU (apps-d-1vcpu-2gb),
    # not more memory.
    instanceSizeSlug: apps-s-1vcpu-2gb

servers:
  # --- kind: builtin --------------------------------------------------------
  # Compiled into the strad image. This is how private/internal servers ship:
  # tadasant-internal builds its own image with its modules and registers them
  # with entries exactly like this one.
  #
  # `bundle: core` runs it inside the gateway process. Naming another bundle
  # instead puts it in a component running the strad image in bundle mode, which
  # the gateway reaches at ${<bundle>.PRIVATE_URL} — useful for isolating a
  # builtin, and costs a component.
  - slug: echo
    kind: builtin
    module: "./servers/echo.js"
    bundle: core
    entitlements: [admin, readonly]
    options:
      greeting: "hello from the core"

  # --- kind: remote-http ----------------------------------------------------
  # Proxy an MCP server that already exists on the internet. strad holds the
  # credential; the client never sees it. deepwiki needs none, which is what
  # makes it a good canary.
  - slug: deepwiki
    kind: remote-http
    url: https://mcp.deepwiki.com/mcp
    entitlements: [admin]
  #
  # With a credential, it is the same entry plus `headers:`:
  #
  # - slug: granola
  #   kind: remote-http
  #   url: https://mcp.granola.ai/mcp
  #   entitlements: [admin]
  #   headers:
  #     Authorization: "Bearer ${GRANOLA_TOKEN}"

  # --- kind: local-tunnel ---------------------------------------------------
  # An MCP server running on a machine YOU own — a laptop, a desktop — reached
  # over a tunnel that machine dials out to. strad never dials in and holds no
  # inbound route to it; the tunnel is the machine's business.
  #
  # Use it for servers that are machine-bound by nature: an app's own MCP
  # add-on, computer use, browser automation driving a real logged-in profile.
  #
  # - slug: anki
  #   kind: local-tunnel
  #   url: https://<your-tunnel-host>/mcp
  #   entitlements: [admin]
  #
  # The kind exists because such a server is OFFLINE MOST OF THE TIME, and that
  # is not a fault. So, unlike every other kind:
  #
  #   - the handshake is bounded by `connectTimeoutMs` (default 5000), not by
  #     the MCP SDK's 60s, so a closed laptop fails in seconds;
  #   - the failure says the machine is unreachable, rather than reading as a
  #     generic upstream error;
  #   - a machine that is not answering does NOT fail a `?servers=` listing that
  #     also named servers which are up. Instead the slug keeps its place and
  #     serves ONE tool, `troubleshoot_host`, which says which machine is down
  #     and what to run on it. `?servers=anki,slack` with the laptop asleep is a
  #     working Slack plus that one tool; `?servers=anki` alone is that one tool
  #     rather than an error.
  #
  # `recovery:` is what that tool says. All of it is optional — without it the
  # tool falls back to generic guidance and a docs link, and it never GUESSES a
  # command. It is returned to every client entitled to the slug, so it is for
  # commands and machine names, never credentials; nothing in it is
  # secret-resolved.
  #
  # - slug: anki
  #   kind: local-tunnel
  #   url: https://<your-tunnel-host>/mcp
  #   entitlements: [admin]
  #   recovery:
  #     machine: "the MacBook"
  #     commands:
  #       - "launchctl kickstart -k gui/$(id -u)/com.cloudflare.cloudflared"
  #     notes: "Anki itself must be open — the MCP server lives inside the app."
  #
  # It gets no container, no bundle and no `env:` — like remote-http, strad
  # runs nothing for it. `${NAME}` refs in `url`/`headers` resolve in strad's
  # own process, so a tunnel URL that rotates can live in the secret store.
  #
  # - slug: computer-use
  #   kind: local-tunnel
  #   url: "${COMPUTER_USE_TUNNEL_URL}"
  #   entitlements: [admin]
  #   timeoutMs: 300000        # driving a real desktop is slow; the RUN budget
  #   connectTimeoutMs: 5000   # is separate from "is anyone home"

  # --- kind: supplementary-image --------------------------------------------
  # A server published as its own container image. strad deploys it as an
  # internal-only component and proxies to it over the private network.
  #
  # ONE image backs MANY servers: give each entry the SAME `image` and `bundle`
  # but a distinct `path`, and they all run in that one component (a component
  # still runs exactly one image). That is `ghcr.io/tadasant/strad-bundle:latest`
  # — 20 MCP servers in one Node process, one shared Chromium, served at /slack,
  # /gmail, /onepassword, /secrets and so on. Every entry below points at it.
  #
  # `env:` maps a container env var to a `${NAME}` ref, and those values resolve
  # onto THIS bundle only, so a credential is not broadcast to every component. A
  # bare string is used literally (see `GCS_BUCKET`); only `${NAME}` is a secret
  # lookup.
  #
  # A `${NAME}` is resolved from THIS SERVER'S OWN namespace first —
  # /strad/{env}/mcp/{slug}/static/{NAME} — and from the shared
  # /strad/{env}/gateway/static/{NAME} only as a fallback. That is what lets two
  # servers write the same `${NAME}` and be given different values; seed nothing
  # per-server and it resolves exactly as it always has.
  #
  # EVERY server's env: also lands under per-slug names on its bundle —
  # TELEGRAM_RW__TELEGRAM_API_HASH — with no condition attached, so what a
  # server's variables are called is computable from this entry alone. Bare names
  # are never removed. What decides whether a slug can READ its own names is
  # `path:`: the bundle host runs one instance per path, so a slug gets its own
  # only if it is the only one on `path: /<its own slug>`. Two slugs on the SAME
  # path are one instance holding one credential, and the render fails rather than
  # picking a winner. See docs/operate/secrets.md.
  #
  # Two other ways a server gets its values, both shown further down:
  #   - `consoleEnv:` — env that lands on the CORE gateway ONLY (the human /ui),
  #     never on the bundle. The `secrets` server uses it to keep an admin key off
  #     the /mcp container. See the `secrets` entry.
  #   - `params: true` — resolve everything a human has stored under
  #     /strad/{env}/mcp/{slug}/static/* in the secrets system and inject it as this
  #     server's env at deploy time. See the `remote-filesystem-tmp-public` entry.
  #
  # `timeoutMs` overrides the MCP SDK's silent 60s default, which otherwise kills
  # a slow tool call and presents as a mysterious platform failure. Set it
  # generously for anything browser-driven.
  #
  # CAPABILITY (read-only vs read-write) is not a container setting. It is the
  # gateway's `tools:` policy, per SLUG:
  #
  #     tools:
  #       allow: [list_things, get_thing]   # exhaustive: only these may run
  #       deny:  [delete_thing]             # subtracts, and wins over allow
  #
  # strad enforces it on tools/list AND on tools/call — a withheld tool is refused
  # before it reaches the upstream. So two slugs may point at the SAME image, the
  # SAME bundle and the SAME path, and differ only in what they may do. The pair
  # below is the worked example.
  #
  # The trade is worth stating: read-only used to be physics (a container built
  # without the write tools in it) and is now policy (a gateway that declines).
  # For 1Password that is sharp — one container holds one service-account token,
  # and it has to be the read-write one — so a read-only 1Password slug is
  # read-only because strad says so, not because 1Password would refuse. See
  # HACKS.md #22.
  - slug: slack
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /slack
    entitlements: [admin]
    env:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"

  # X is deliberately read-only by default. Add create_bookmark and
  # remove_bookmark to this allow-list only when private bookmark changes are
  # intended. OAuth credentials come from an X Developer Console app.
  #
  # TWO WAYS TO CREDENTIAL THIS SERVER, and the second is the durable one.
  #
  # As written below it runs in STATIC-ACCESS-TOKEN mode: something outside strad
  # mints a short-lived access token and this deployment injects it. Simple, and
  # it goes stale between deploys — a supplementary image's env: is baked at
  # render time.
  #
  # The alternative is REFRESH-TOKEN mode, seeded once in /ui/secrets under
  # /strad/{env}/mcp/x-twitter/static/ and left alone:
  #
  #     params: true
  #     paramsWritable: [X_OAUTH_REFRESH_TOKEN]
  #
  # X's refresh tokens are SINGLE-USE: every refresh mints a new one and kills the
  # previous. `paramsWritable` is what lets the server persist each new value back
  # through core, and re-read the live one at boot instead of the value the last
  # deploy baked — which is what makes "set it once and it keeps working" true
  # across restarts. See docs: /operate/secrets/.
  - slug: x-twitter
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /x-twitter
    entitlements: [admin]
    env:
      X_OAUTH_ACCESS_TOKEN: "${X_OAUTH_ACCESS_TOKEN}"
    tools:
      allow:
        - get_my_account
        - get_user
        - get_home_timeline
        - get_user_tweets
        - get_bookmarks
        - search_recent_tweets
        - get_tweets

  # The read-only twin of the server above: same image, same bundle, same path,
  # same container, same credential. The ONLY difference is the policy the gateway
  # enforces. Declare the credential on BOTH variants: a component's env is the
  # union of its servers' env maps, so this is a no-op at deploy time, and it
  # means `enabled: false` on one variant cannot silently strip the secret from
  # its twin.
  - slug: slack-readonly
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /slack
    entitlements: [admin, readonly]
    env:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
    tools:
      allow:
        - slack_get_channels
        - slack_get_channel
        - slack_get_thread
        - slack_download_file
        # The DM reads. `slack_get_dm` resolves an EXISTING conversation rather
        # than calling conversations.open, so nothing here creates anything.
        # Sending one is `slack_send_dm`, which this tier deliberately withholds.
        - slack_get_dms
        - slack_get_dm
        - slack_find_user

  # THE ONE SERVER WHOSE CREDENTIAL IS ONE PERSON.
  #
  # google-sheets authenticates with an OAuth refresh token, and a refresh token
  # is exactly one Google account — there is no service account and no
  # impersonation. The pair below is ONE account, so both slugs sit on the
  # conventional `/google-sheets` mount and share its credential, and the only
  # difference between them is the tools policy.
  #
  # SEVERAL ACCOUNTS IS THE OTHER SHAPE, and it needs one more thing: give each
  # slug `path: /<its own slug>`. The bundle host serves one instance per path and
  # hands a slug its per-slug variables (GOOGLE_SHEETS_WORK_RO__…) only when the
  # path is the slug's own name — so six google-sheets slugs over three accounts
  # are six entries, six paths, six mounts, one implementation. Two slugs sharing
  # one path are one process holding one token, and renderAppSpec refuses that
  # outright when their values differ. See docs/servers/google-sheets.md.
  #
  # Because the credential is per slug in that shape, a read-only slug can be
  # seeded a refresh token consented only for spreadsheets.readonly — so Google
  # refuses a write even if the gateway did not. That is a guarantee 1Password's
  # read-only slug cannot have (HACKS.md #22).
  - slug: google-sheets-ro
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-sheets
    entitlements: [admin, readonly]
    env:
      GOOGLE_SHEETS_OAUTH_CLIENT_ID: "${GOOGLE_SHEETS_OAUTH_CLIENT_ID}"
      GOOGLE_SHEETS_OAUTH_CLIENT_SECRET: "${GOOGLE_SHEETS_OAUTH_CLIENT_SECRET}"
      GOOGLE_SHEETS_OAUTH_REFRESH_TOKEN: "${GOOGLE_SHEETS_OAUTH_REFRESH_TOKEN}"
    tools:
      allow:
        - get_spreadsheet
        - get_sheet_values
        - batch_get_sheet_values
        - find_in_spreadsheet

  # The write tier: no `tools:` block, because the full eight ARE this tier. Its
  # token needs https://www.googleapis.com/auth/spreadsheets, where the read tier
  # can live on …/spreadsheets.readonly.
  - slug: google-sheets-rw
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-sheets
    entitlements: [admin]
    env:
      GOOGLE_SHEETS_OAUTH_CLIENT_ID: "${GOOGLE_SHEETS_OAUTH_CLIENT_ID}"
      GOOGLE_SHEETS_OAUTH_CLIENT_SECRET: "${GOOGLE_SHEETS_OAUTH_CLIENT_SECRET}"
      GOOGLE_SHEETS_OAUTH_REFRESH_TOKEN: "${GOOGLE_SHEETS_OAUTH_REFRESH_TOKEN}"

  # No credential at all — public endpoints, every tool.
  - slug: google-flights
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-flights
    entitlements: [admin]

  - slug: monarch-money
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /monarch-money
    entitlements: [admin]
    env:
      # A session token, minted out-of-band. The server does not log in from
      # credentials here.
      MONARCH_SESSION_TOKEN: "${MONARCH_SESSION_TOKEN}"

  # `title`/`description` are what a human sees in /console. GCS_BUCKET pins every
  # operation to one bucket — a literal value, not a secret, and it is also what
  # the human /ui/gcs view scopes to.
  - slug: gcs
    kind: supplementary-image
    title: Google Cloud Storage
    description: Browse the object store this server is scoped to.
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /gcs
    entitlements: [admin]
    env:
      GCS_PROJECT_ID: "my-project"
      GCS_BUCKET: "my-public-bucket"
      GCS_SERVICE_ACCOUNT_KEY_JSON: "${GCS_SERVICE_ACCOUNT_KEY_JSON}"

  # The store-agnostic secrets/parameters manager. Parameter Manager indexes every
  # managed variable; Secret Manager backs the ones that are secret. A parameter is
  # addressed by one canonical path, /strad/{env}/mcp/{slug}/{kind}/{VARIABLE}, and
  # is EITHER non-secret (safe to read back) OR secret (write-and-inject-only). The
  # name is `secrets`, not `gcp-secrets`: the store is an implementation detail.
  #
  # THIS ENTRY IS A SECURITY BOUNDARY, and the shape is the whole point. THREE
  # credentials, three roles, deliberately different service accounts:
  #
  #   env:         SECRETS_SERVICE_ACCOUNT_KEY_JSON        -> the BUNDLE   (viewer)
  #   consoleEnv:  SECRETS_ADMIN_SERVICE_ACCOUNT_KEY_JSON  -> CORE only    (admin)
  #   STRAD_PARAMS_RESOLVER_SERVICE_ACCOUNT_KEY_JSON       -> DEPLOY only  (resolver)
  #
  # `env:` lands on the /mcp container: the VIEWER key. It can list parameters, read
  # notes and read NON-SECRET values, and CANNOT read a secret value — its account
  # lacks secretmanager.versions.access, so Google answers 403 to the only call that
  # would return one. A prompt injection that talks a tool into reading a secret
  # still gets a 403.
  #
  # `consoleEnv:` lands on the CORE component alone (a broadcast SECRET would reach
  # the bundle too): the ADMIN key, which can add, rotate, reveal and delete both
  # kinds — driven only by a human on /ui/secrets, behind the console SSO gate.
  #
  # The RESOLVER account (STRAD_PARAMS_*, set in the DEPLOY environment, not here)
  # reads both stores' values at deploy time to inject a `params: true` server's env.
  #
  # NAMESPACE: put these parameters in a project that holds ONLY them, not the one
  # holding strad's own strad-<env>-* secrets. The path prefix is a code-level guard;
  # the GCP project is the real fence.
  - slug: secrets
    kind: supplementary-image
    title: Secrets & parameters
    description: Add, rotate, reveal and delete non-secret and secret parameters. The MCP server can never return a secret value.
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /secrets
    entitlements: [admin]
    env:
      SECRETS_PROJECT_ID: "strad-secrets-staging" # non-secret: a literal, not a ${ref}
      SECRETS_NAMESPACES: "/strad/staging/mcp/"
      SECRETS_CONSOLE_URL: "https://staging.strad.tadasant.com/ui/secrets"
      # Parameter Manager viewer — NO secretmanager.versions.access. This is the lock.
      SECRETS_SERVICE_ACCOUNT_KEY_JSON: "${SECRETS_VIEWER_KEY_JSON}"
      # WRITE-BACK, and what it does and does not grant. A server that declares
      # `paramsWritable:` can POST a rotated credential to core, which performs
      # the write with the ADMIN key below — the container never holds one.
      #
      # IT BOUNDS THE NAMES, NOT THE CALLER. `STRAD_INTERNAL_TOKEN` is one token,
      # on every supplementary component, and nothing binds a caller to the slug
      # it addresses — so the reachable set is the UNION of every enabled
      # server's `paramsWritable:`, and the GET is a value read on the component
      # with the public route. Factor that into how often this token is rotated.
      # What it does bound: the union is opt-in and empty by default, nothing
      # outside it is reachable, and every name on it is a credential that
      # ROTATES, so losing one costs a re-seed. See docs: /operate/secrets/ and
      # limitation #63.
    consoleEnv:
      SECRETS_PROJECT_ID: "strad-secrets-staging" # non-secret: a literal, not a ${ref}
      # A LIST, and the console's may be wider than the container's above. The
      # console offers these as SUGGESTIONS on a free-text field (set
      # SECRETS_NAMESPACES_STRICT: "true" to make them a limit); the gateway namespace holds the
      # deployment's own ${NAME} references, which a human manages and an agent
      # has no business enumerating.
      SECRETS_NAMESPACES: "/strad/staging/mcp/,/strad/staging/gateway/static/"
      # Parameter Manager admin + Secret Manager admin. Core only. Humans only.
      SECRETS_ADMIN_SERVICE_ACCOUNT_KEY_JSON: "${SECRETS_ADMIN_KEY_JSON}"

  # A server that draws its credentials from the secrets system instead of from
  # hand-written `${REF}` secrets. `params: true` opts it in: at deploy time
  # render-spec resolves everything under /strad/{env}/mcp/remote-filesystem-tmp-public/
  # static/* — the non-secret REMOTE_FILESYSTEM_TMP_PUBLIC_GCS_CLIENT_EMAIL from Parameter
  # Manager and the secret REMOTE_FILESYSTEM_TMP_PUBLIC_GCS_PRIVATE_KEY from Secret Manager
  # — and injects them as SECRET env vars onto this bundle. A human sets both once in
  # /ui/secrets; the container holds no cloud credential. The bucket is deployment
  # config, not a credential, so it stays a literal here.
  #
  # SENSITIVE_VIEWER_DOMAIN is the sensitivity half of strad's artifact store:
  # an `is_sensitive: true` upload grants `domain-<this>` READER on the object and
  # returns a storage.cloud.google.com link, which Google gates behind a sign-in.
  # Leave it unset and a sensitive upload is REFUSED rather than stored where
  # nobody can open it. See docs: /servers/artifact-store/.
  #
  # SENSITIVE_VIEWER_ACCOUNT (optional) is the account that link should OPEN AS.
  # storage.cloud.google.com authenticates the reader's DEFAULT Google account,
  # so someone signed in to a personal address plus a work one gets a 403 from
  # the personal one even though the domain grant is correct. Set this to a full
  # address inside SENSITIVE_VIEWER_DOMAIN and links carry `?authuser=<it>`.
  # It is a hint, not a grant — the whole domain can still open the artifact.
  # Only set it if you know the address: pointing readers at an account nobody
  # is signed in to is worse than leaving it unset.
  - slug: remote-filesystem-tmp-public
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /remote-filesystem-tmp-public
    entitlements: [admin]
    params: true
    env:
      REMOTE_FILESYSTEM_TMP_PUBLIC_GCS_BUCKET: "my-screenshots"
      REMOTE_FILESYSTEM_TMP_PUBLIC_SENSITIVE_VIEWER_DOMAIN: "example.com"
      # REMOTE_FILESYSTEM_TMP_PUBLIC_SENSITIVE_VIEWER_ACCOUNT: "dana@example.com"

  # The 1Password CLI (`op`) is baked into the image; the image ships no
  # credential. The server refuses to serve without an elicitation posture, and
  # strad has no elicitation transport wired yet, so it skips them explicitly.
  # See servers/onepassword/README.md.
  - slug: onepassword-rw
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /onepassword
    entitlements: [admin]
    timeoutMs: 120000
    env:
      OP_SERVICE_ACCOUNT_TOKEN: "${OP_SERVICE_ACCOUNT_TOKEN}"
      DANGEROUSLY_SKIP_ELICITATIONS: "true"

  # Browser-driven. It drives a real headless Chromium and logs into a real
  # account, so a tool call can take minutes — hence the raised `timeoutMs`. It
  # does NOT launch its own browser: the bundle host owns ONE Chromium and hands
  # each browser server a context on it (servers/bundle/host/src/browser.ts), so
  # adding another one costs a context, not another 545MB peak.
  - slug: good-eggs
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /good-eggs
    entitlements: [admin]
    timeoutMs: 120000
    env:
      GOODEGGS_EMAIL: "${GOODEGGS_EMAIL}"
      GOODEGGS_PASSWORD: "${GOODEGGS_PASSWORD}"

  # A server that ships as its OWN image is the same entry with a different
  # `image`, and it needs its own bundle, because one component runs one image:
  #
  # - slug: my-server
  #   kind: supplementary-image
  #   image: ghcr.io/tadasant/strad-server-my-server:latest
  #   bundle: bundle-my-server      # declared under bundles:
  #   entitlements: [admin]
  #   env:
  #     MY_SERVER_TOKEN: "${MY_SERVER_TOKEN}"
