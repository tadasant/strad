# strad configuration
#
# The core ships with ZERO MCP servers. This file is the ONLY place you attach
# them, and attaching one is a single entry under `servers:`.
#
# Secret VALUES never appear here. `${NAME}` resolves against the environment at
# boot — and those env vars are injected by CI from GCP Secret Manager
# (`strad-<env>-<NAME>`) as App Platform SECRET env vars. The container itself
# holds no cloud credentials.
#
# This file is an EXAMPLE: it shows every shape the schema allows, with fewer
# servers than a real deployment. infra/strad.staging.yaml is the real one — 36
# server slugs across 3 App Platform components.

version: 1

gateway:
  name: strad
  env: staging
  publicUrl: https://staging.strad.tadasant.com

  # Where every ${NAME} below resolves from, and WHEN. One provider per
  # deployment, on purpose: two ways to manage a credential means one of them is
  # out of date and nobody knows which.
  secrets:
    # env (the default) — resolve from the process environment. No vendor, no
    #   cloud account; `npm run dev` and CI both run on this. Secrets reach the
    #   container as deploy-time SECRET env vars and the container holds no cloud
    #   credential. Rotating one does nothing until the deploy runs again.
    #
    # gcp-parameter-store — resolve from /strad/{env}/gateway/static/ AT RUNTIME.
    #   Add or rotate a secret and it reaches production with no deploy. The app
    #   spec then carries exactly one secret: the key the gateway uses to reach
    #   the store (STRAD_PARAMS_RESOLVER_SERVICE_ACCOUNT_KEY_JSON). A key cannot
    #   be kept behind the lock it opens; that is the only exception.
    provider: env
    # A process reads the store ONCE and holds that reading for ttlSeconds; every
    # namespace it serves is a slice of it. A change that tells the gateway lands
    # at once: a write through strad's own console, a write through the
    # `secrets` MCP server (its write tools call refresh_gateway), and the
    # console's "Re-read the store" button. The two TTLs are only the fallback
    # for a change made any other way — a hand `gcloud` seed, say — and they are
    # long on purpose: every read is billed per parameter and secrets change a
    # few times a month.

    # Bounds how long an UNANNOUNCED rotation can go unnoticed. The snapshot is
    # re-read on the first read after it goes stale. It also bounds how stale
    # the console's and /api/secrets/readiness's store diagnosis may be, capped
    # at 60s there — that answer is a health signal. Both surfaces print how old
    # the reading they served is. Default a day, which is also the max.
    ttlSeconds: 86400

    # Bounds how long an UNANNOUNCED addition can go unnoticed. A miss forces one
    # out-of-band refresh, rate limited so an unknown ${REF} on a hot path
    # cannot list the store once per request. Default an hour, max 86400.
    negativeTtlSeconds: 3600

    # Keep process.env behind the store, so names can be migrated one at a time
    # with no window where a name resolves from neither. Set false once the move
    # is done, to make "the store is the only source" enforceable.
    envFallback: true

    # How often a supplementary component re-reads the parameters its servers
    # listed under `paramsRefresh:`. NOT ttlSeconds: that one bounds a cache in
    # front of a read the gateway was going to do anyway, so a short value costs
    # nothing when nothing asks. This drives a POLL, and a poll's cost is paid
    # whether or not anybody is using the credential — one store read per listed
    # variable per component per interval. Hence the floor of 30.
    #
    # No effect unless some server sets `paramsRefresh:`, which none does by
    # default.
    paramRefreshSeconds: 300

  # Where a server entry a HUMAN added through the console is kept.
  #
  # Off by default, and off means today's behaviour exactly: one document, one
  # source, changed by a deploy. On, core also reads an OVERLAY from
  # /strad/{env}/gateway/config/SERVERS — entries added, entries overridden,
  # entries removed — merges it over this document, and serves the result. The
  # console at /connectors is what writes it, and a change takes effect on the
  # next request with no redeploy and no restart.
  #
  # The file stays authoritative for everything nobody has touched. An absent
  # overlay is byte-for-byte the same roster as no overlay at all, so turning
  # this on changes nothing until somebody presses Save.
  #
  # Needs `provider: gcp-parameter-store` above — the overlay lives in that
  # store. Declaring it under the `env` provider is a config error rather than a
  # silent no-op, because a console whose Save button does not persist is worse
  # than one that is not there. Writing also needs the console's admin
  # credential (SECRETS_ADMIN_SERVICE_ACCOUNT_KEY_JSON) on core; without it the
  # roster page renders read-only and says so.
  #
  # What can be added this way is bounded by what a running process can serve:
  # `remote-http` and `local-tunnel` fully, a `supplementary-image` slug pointed
  # at a mount that is already deployed, and a `builtin` never. See
  # docs/operate/runtime-config.
  configStore:
    enabled: false
    # How often core re-reads the overlay. The process that WROTE a change
    # reloads at once; this is what carries another instance's change to this
    # one. Two store reads per interval per core instance.
    pollSeconds: 60

  # Where a caller's confirmation channel may point. A tool that needs a human's
  # yes (gmail's `send_email`, a 1Password reveal or write) asks at the URL the caller sends in its
  # `X-Elicitation-Url` header, and the bundle fetches it, so the URL must sit
  # under one of these prefixes: an `https` URL whose path ends in `/` (plain
  # `http` only for a loopback host). Empty, the default, accepts none, and
  # every confirmed tool refuses. The slug with the tool also needs
  # `confirmations: true`, and a `timeoutMs` long enough for a human to answer
  # and no longer than the caller's own hop holds a silent response. If an edge
  # in front of the approval URL wants strad's credential (a Cloudflare Access
  # service token), the slug declares it in `confirmationHeaders:`, e.g.
  #   confirmationHeaders:
  #     CF-Access-Client-Id: "${ZIMMER_CF_ACCESS_CLIENT_ID}"
  #     CF-Access-Client-Secret: "${ZIMMER_CF_ACCESS_CLIENT_SECRET}"
  # A slug whose mailbox is the agent's own (no person is being sent as)
  # declares `skipConfirmations: true` instead: its confirmed tools run with
  # nobody asked, and it never receives the header. Not beside
  # `confirmations: true`.
  # See docs/servers/confirmations.
  elicitation:
    allowedUrlPrefixes: [] # e.g. [https://zimmer.tadasant.com/api/v1/elicitations/session/]

auth:
  # Humans. Verified against the Google Workspace `hd` claim — NOT the email
  # suffix, which a personal account can spell however it likes.
  google:
    enabled: true
    hostedDomain: tadasant.com
    roles: [admin]
    # How long a sign-in keeps the console open. A session cookie lives
    # `slidingTtlSeconds`, and the console re-issues it once more than half of
    # that has run, so an active human is not signed out. `absoluteTtlSeconds`
    # is the cap, counted from the Google sign-in, which renewal never moves: a
    # stolen cookie that keeps being used still dies there. Both are read on
    # every request, so changing one applies to sessions already issued —
    # raising the cap extends every live session, a stolen one included.
    # 60 seconds to 30 days each; equal values mean a fixed session. Rotating
    # CONSOLE_SESSION_SECRET is the only way to end sessions early, and it ends
    # all of them.
    session:
      slidingTtlSeconds: 172800 # default, 48 hours
      absoluteTtlSeconds: 604800 # default, 7 days

  # Machines. `strad_<env>_<pubid>_<secret>`; only the SHA-256 is stored.
  # Mint with: npm run token:mint -- --label "my agent" --roles admin
  staticTokens:
    enabled: true
    # Where the records live. Both values read the SAME name and the SAME JSON
    # array, so the flip is a config change with no data to move.
    #
    #   env              STRAD_TOKENS, read once at boot. Mint and revoke are an
    #                    edit to the deployment's secret and a redeploy.
    #   parameter-store  the parameter at /strad/{env}/gateway/static/STRAD_TOKENS,
    #                    read on the request path and written by the console at
    #                    /tokens. Mint and revoke land on a running gateway.
    #                    Requires gateway.secrets.provider: gcp-parameter-store.
    store: env

  # strad's OWN OAuth 2.1 authorization server, in front of /mcp. This is what
  # lets an interactive MCP client — claude.ai's custom-connector dialog — be
  # handed a URL and connect through a Google sign-in, with no token pasted
  # anywhere. It is ADDITIVE: staticTokens above keeps working unchanged, and
  # /mcp accepts either credential.
  #
  # Enabling the flag is not enough. GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET must
  # be set (the SAME OAuth client the console login uses, with
  # <publicUrl>/oauth/callback/google added to its authorized redirect URIs),
  # and there must be key material — STRAD_OAUTH_KEY, else
  # CONSOLE_SESSION_SECRET, else GOOGLE_CLIENT_SECRET. A deployment missing a
  # half says so at boot and serves no authorization-server metadata.
  mcpOAuth:
    enabled: true
    # Optional: defaults to auth.google.hostedDomain above. Verified against the
    # ID token's `hd` claim AND the email suffix, on every authorization and on
    # every refresh. A config that enables the flow and declares neither is a
    # hard error — a flow with no domain to enforce admits whoever arrives.
    hostedDomain: tadasant.com
    # NOT defaulted from auth.google.roles: that grant is the console's, and
    # inheriting it would mean this flag silently widened what /mcp hands out.
    # Empty is fail-closed — the flow completes and every ?servers= gets a 424.
    roles: [admin]
    # Access tokens expire on this cadence; refresh tokens never expire, and are
    # revoked at Google. See docs/auth/overview.md.
    accessTokenTtlSeconds: 3600

  # Temporary: lets a human into /console with ADMIN_BOOTSTRAP_TOKEN while
  # Google OAuth credentials are being provisioned. Requires ALLOW_DEV_AUTH=true.
  # It CANNOT authenticate /mcp. Delete once OAuth lands — see HACKS.md.
  consoleDevBypass:
    enabled: true
    roles: [admin]

  # A standing console credential (the bootstrap token above, or a Google
  # session) mints a single-use login token; an automated actor exchanges it for
  # a 30-minute session that can view the console but not act through it, and
  # never holds the standing one. The routes exist only where gateway.env is
  # dev, local, test or staging, whatever this says. See
  # docs/.../auth/overview.md.
  consoleTokenLogin:
    enabled: true

# A role names the servers it may reach. `*` means every configured server.
# Both directions must agree: the role must name the server, AND the server must
# list the role under `entitlements`. Neither side can grant access alone — see
# `readonly` below, which names `slack-readonly`, and `slack-readonly`, which
# names `readonly` back.
roles:
  admin:
    servers: ["*"]
  readonly:
    servers: [echo, slack-readonly]

# Deployment groups. `core` is implicit (the public gateway); every bundle below
# becomes an internal-only App Platform component on the private network.
#
# There is exactly ONE here, and that is the whole shape of the current design:
# every supplementary MCP server runs in one container, off one image, and the
# gateway proxies to each on its own path. strad deploys 2 components in total —
# `core` and this.
bundles:
  - name: bundle
    # 2GB because this container holds a real Chromium (the browser servers share
    # ONE, ~940MB RSS for its process tree) alongside every API server, and 1GB is
    # one bad page render from an OOM that takes every server down with it. The
    # binding constraint is CPU, not RAM: 1 shared vCPU serialises Chromium's
    # rendering while the same box answers every Slack call. If the telemetry
    # shows event-loop lag, the next move is a dedicated CPU (apps-d-1vcpu-2gb),
    # not more memory.
    #
    # The deploy gate checks this against the plans DigitalOcean actually sells
    # (the "Current Plans" table at
    # https://docs.digitalocean.com/products/app-platform/details/pricing/, plus
    # the legacy `basic-*` / `professional-*` names). A name it does not have —
    # `apps-s-1vcpu-512mb`, say, when the 512 MiB plan is `apps-s-1vcpu-0.5gb` —
    # reds `config:check` on the pull request that writes it, rather than
    # `doctl apps update` weeks later on whichever change first renders the
    # component. The schema itself takes any string, because it is also the boot
    # parse: see src/deploy/instance-size.ts.
    instanceSizeSlug: apps-s-1vcpu-2gb
    # Restart this component when its /healthz fails for about three minutes.
    # Defaults to true for this repo's `strad-bundle` image, whose host answers
    # 503 once its event loop has been saturated for a minute, and to false for
    # any other image, which may have no /healthz to answer. A strad-bundle
    # component is also started with a V8 heap of half the plan's memory. See
    # docs/servers/interface (tadasant/strad#458).
    # liveness: true
    #
    # TAILNET EGRESS, off unless written. The bundle host runs a userspace
    # tailscaled joined as a tagged, pre-authorized, EPHEMERAL node, and the ssh
    # tree reaches a host that resolves into Tailscale's ranges (100.64.0.0/10,
    # fd7a:115c:a1e0::/48, *.ts.net) through it; every other host dials direct.
    # `authKey` names a Tailscale OAuth client secret scoped to auth_keys for
    # exactly these tags. It lands on this component only, as a SECRET. The
    # tailnet policy must already limit the tag to what it needs before the key
    # exists: a tag the policy does not narrow can reach the whole tailnet.
    # `enabled: false` is the rollback. docs/operate/tailnet has the design.
    #
    # tailnet:
    #   authKey: "${STRAD_TAILNET_OAUTH_CLIENT_SECRET}"
    #   tags: [tag:strad]
    #   hostname: strad-prod-bundle # default: strad-<gateway.env>-<bundle>
    #   enabled: true

servers:
  # The roster editor, as an MCP server — the other half of the console at
  # /connectors. Mount it and an AGENT can add, edit, disable and remove a
  # connector in the middle of a session; leave it out and only a human at the
  # console can. It is opt-in on purpose: a tool that edits the server list can
  # point a slug at an endpoint of its own choosing.
  #
  # It offers nothing at all unless gateway.configStore.enabled is set above,
  # and it offers only its three READ tools unless this gateway also holds a
  # credential that can persist a change. To mount the read half deliberately,
  # narrow it here — an allow list is exhaustive and enforced on tools/list and
  # tools/call alike:
  #
  #   tools:
  #     allow: [list_connectors, get_connector, describe_connector_authorization]
  - slug: connectors
    kind: builtin
    module: "./servers/connectors.js"
    bundle: core
    entitlements: [admin]

  # --- kind: builtin --------------------------------------------------------
  # Compiled into the strad image. This is how private/internal servers ship:
  # tadasant-internal builds its own image with its modules and registers them
  # with entries exactly like this one.
  #
  # `bundle: core` runs it inside the gateway process. Naming another bundle
  # instead puts it in a component running the strad image in bundle mode, which
  # the gateway reaches at ${<bundle>.PRIVATE_URL} — useful for isolating a
  # builtin, and costs a component.
  - slug: echo
    kind: builtin
    module: "./servers/echo.js"
    bundle: core
    entitlements: [admin, readonly]
    options:
      greeting: "hello from the core"

  # --- kind: remote-http ----------------------------------------------------
  # Proxy an MCP server that already exists on the internet. strad holds the
  # credential; the client never sees it. deepwiki needs none, which is what
  # makes it a good canary.
  - slug: deepwiki
    kind: remote-http
    url: https://mcp.deepwiki.com/mcp
    entitlements: [admin]
  #
  # With a credential, it is the same entry plus `headers:`:
  #
  # - slug: granola
  #   kind: remote-http
  #   url: https://mcp.granola.ai/mcp
  #   entitlements: [admin]
  #   headers:
  #     Authorization: "Bearer ${GRANOLA_TOKEN}"
  #
  # A `${NAME}` nobody has seeded yet fails the DEPLOY, for every server — which
  # is right for a typo and wrong for a server you are onboarding ahead of its
  # token. `mayBeUnseeded:` waives that for the names you list, and only those:
  # the deploy warns, THIS slug comes up "unconfigured" on /healthz and in the
  # console, every other server ships normally, and it starts serving on its own
  # once a value lands (no redeploy under `gcp-parameter-store`). An entry naming
  # a ${NAME} this server does not reference is a hard error, so a typo cannot
  # hide behind it. See docs: operate/secrets.
  #
  # - slug: apify
  #   kind: remote-http
  #   url: https://mcp.apify.com/mcp
  #   entitlements: [admin]
  #   headers:
  #     Authorization: "Bearer ${APIFY_TOKEN}"
  #   mayBeUnseeded: [APIFY_TOKEN]
  #
  # An upstream whose bearer EXPIRES — OAuth-per-user, short-lived access
  # tokens — takes `oauthRefresh:` instead of an Authorization header. strad
  # holds the refresh token, mints the access token itself (before expiry, and
  # again on a 401), and writes a rotated refresh token back to the store so a
  # restart reads the live one. `refreshToken` and `clientSecret` must each be
  # exactly one ${NAME}: a credential lives in the store, and the write-back
  # needs a name. The first refresh token comes from the slug's console page:
  # Connect discovers the upstream's authorization server, registers a client
  # where it can, and writes every ${NAME} here that it learned. See docs:
  # servers/interface and operate/connectors.
  #
  # - slug: granola
  #   kind: remote-http
  #   url: https://mcp.granola.ai/mcp
  #   entitlements: [admin]
  #   oauthRefresh:
  #     tokenUrl: https://mcp-auth.granola.ai/oauth2/token
  #     clientId: ${GRANOLA_CLIENT_ID}
  #     refreshToken: ${GRANOLA_REFRESH_TOKEN}
  #     resource: https://mcp.granola.ai/mcp
  #   mayBeUnseeded: [GRANOLA_REFRESH_TOKEN]
  #
  # An upstream whose firewall serves strad's cloud egress a 403 on its OAuth
  # metadata (Rippling's does) can have Connect re-read just those two public
  # documents through BrightData. It works around the upstream's bot
  # protection, so opt in per slug. Registration, the exchange and every
  # refresh still go out from strad. The key is BRIGHTDATA_API_KEY in
  # apiKeyFrom's namespace.
  #
  # - slug: rippling
  #   kind: remote-http
  #   url: https://mcp.rippling.com/mcp
  #   entitlements: [admin]
  #   oauthRefresh:
  #     tokenUrl: ${RIPPLING_TOKEN_URL}
  #     clientId: ${RIPPLING_CLIENT_ID}
  #     refreshToken: ${RIPPLING_REFRESH_TOKEN}
  #     resource: ${RIPPLING_RESOURCE}
  #     discoveryProxy: { via: brightdata, apiKeyFrom: strad-fetch }
  #   mayBeUnseeded:
  #     [RIPPLING_TOKEN_URL, RIPPLING_CLIENT_ID, RIPPLING_REFRESH_TOKEN, RIPPLING_RESOURCE]

  # --- kind: local-tunnel ---------------------------------------------------
  # An MCP server running on a machine YOU own — a laptop, a desktop — reached
  # over a tunnel that machine dials out to. strad never dials in and holds no
  # inbound route to it; the tunnel is the machine's business.
  #
  # Use it for servers that are machine-bound by nature: an app's own MCP
  # add-on, computer use, browser automation driving a real logged-in profile.
  #
  # - slug: anki
  #   kind: local-tunnel
  #   url: https://<your-tunnel-host>/
  #   entitlements: [admin]
  #
  # The kind exists because such a server is OFFLINE MOST OF THE TIME, and that
  # is not a fault. So, unlike every other kind:
  #
  #   - the handshake is bounded by `connectTimeoutMs` (default 5000), not by
  #     the MCP SDK's 60s, so a closed laptop fails in seconds;
  #   - the failure says the machine is unreachable, rather than reading as a
  #     generic upstream error;
  #   - a machine that is not answering does NOT fail a `?servers=` listing that
  #     also named servers which are up. Instead the slug keeps its place and
  #     serves ONE tool, `troubleshoot_host`, which says which machine is down
  #     and what to run on it. `?servers=anki,slack` with the laptop asleep is a
  #     working Slack plus that one tool; `?servers=anki` alone is that one tool
  #     rather than an error.
  #
  # THAT LAST EXEMPTION IS ABOUT AN ABSENT MACHINE, NOT A WRONG URL. A machine
  # that answers 404 because the path is wrong is an ordinary upstream error and
  # DOES fail a named listing, neighbours included. So take the path from the
  # server you are tunnelling to: `/mcp` is a common convention, but the Anki
  # add-on above serves at the ROOT of its port (`http_path` defaults to empty),
  # which is why the url ends at the hostname.
  #
  # `recovery:` is what that tool says. All of it is optional — without it the
  # tool falls back to generic guidance and a docs link, and it never GUESSES a
  # command. It is returned to every client entitled to the slug, so it is for
  # commands and machine names, never credentials; nothing in it is
  # secret-resolved.
  #
  # - slug: anki
  #   kind: local-tunnel
  #   url: https://<your-tunnel-host>/
  #   entitlements: [admin]
  #   recovery:
  #     machine: "the MacBook"
  #     commands:
  #       - "launchctl kickstart -k gui/$(id -u)/com.cloudflare.cloudflared"
  #     notes: "Anki itself must be open — the MCP server lives inside the app."
  #
  # It gets no container, no bundle and no `env:` — like remote-http, strad
  # runs nothing for it. `${NAME}` refs in `url`/`headers` resolve in strad's
  # own process, so a tunnel URL that rotates can live in the secret store.
  #
  # - slug: computer-use
  #   kind: local-tunnel
  #   url: "${COMPUTER_USE_TUNNEL_URL}"
  #   entitlements: [admin]
  #   timeoutMs: 300000        # driving a real desktop is slow; the RUN budget
  #   connectTimeoutMs: 5000   # is separate from "is anyone home"
  #
  # `deposit:` lets the machine CREATE secret parameters in strad's store, and
  # nothing else: strad-hostd's custody server captures a credential in the
  # owner's browser and posts it to POST /_strad/deposit/{slug}/{VARIABLE},
  # which writes /strad/{env}/mcp/{slug}/static/{VARIABLE} — secret, create-only,
  # never a read, never a gateway or oauth/ name. The caller's bearer is an HMAC
  # of the key in this entry's own `Authorization: "Bearer ${NAME}"`, which must
  # be exactly that shape. `into:` narrows the slugs; omitted, any — except a
  # `params: true` slug, which only an `into:` that names it may reach, or a
  # `paramsVariables:` entry that names the exact slug and VARIABLE. That one
  # widens by single names and narrows nothing: a listed pair is allowed even
  # when `into:` leaves its slug out, and every other slug keeps its rule. The
  # schema refuses a listed slug that is not `params: true` and a listed name
  # the route would refuse. It never shadows a name the slug already resolves,
  # nor writes a `url:` name or a process-control name (NODE_OPTIONS, *_PROXY,
  # STRAD_*, ...). `gatewayVariables:` is the one exception to "never a gateway
  # name": POST /_strad/deposit/_gateway/{VARIABLE} creates
  # /strad/{env}/gateway/static/{VARIABLE}, create-only, for a listed name that
  # is some bundle's `tailnet.authKey` ${NAME} (enabled or not), read by nothing
  # outside `bundles:`, and not a boot key. The schema refuses any other name.
  # Checked-in config only: a runtime roster write cannot add or change it.
  #
  # - slug: custody-my-mbp
  #   kind: local-tunnel
  #   url: https://hostd.example.com/custody/mcp
  #   entitlements: [admin]
  #   headers:
  #     Authorization: "Bearer ${HOSTD_CUSTODY_KEY}"
  #   deposit:
  #     into: [linear, granola]
  #     paramsVariables:
  #       ssh-example-staging: [SSH_PRIVATE_KEY]
  #     gatewayVariables: [STRAD_TAILNET_OAUTH_CLIENT_SECRET]

  # --- kind: supplementary-image --------------------------------------------
  # A server published as its own container image. strad deploys it as an
  # internal-only component and proxies to it over the private network.
  #
  # ONE image backs MANY servers: give each entry the SAME `image` and `bundle`
  # but a distinct `path`, and they all run in that one component (a component
  # still runs exactly one image). That is `ghcr.io/tadasant/strad-bundle:latest`
  # — 30 MCP servers in one Node process, one shared Chromium, served at /slack,
  # /gmail, /onepassword, /secrets and so on. Every entry below points at it.
  #
  # `env:` maps a container env var to a `${NAME}` ref, and those values resolve
  # onto THIS bundle only, so a credential is not broadcast to every component. A
  # bare string is used literally (see `GCS_BUCKET`); only `${NAME}` is a secret
  # lookup.
  #
  # A `${NAME}` is resolved from THIS SERVER'S OWN namespaces first —
  # /strad/{env}/mcp/{slug}/oauth/{NAME}, then .../static/{NAME} — and from the
  # shared /strad/{env}/gateway/static/{NAME} only as a fallback. That is what lets two
  # servers write the same `${NAME}` and be given different values; seed nothing
  # per-server and it resolves exactly as it always has.
  #
  # EVERY server's env: also lands under per-slug names on its bundle —
  # TELEGRAM_RW__TELEGRAM_API_HASH — with no condition attached, so what a
  # server's variables are called is computable from this entry alone. Bare names
  # are never removed. What decides whether a slug can READ its own names is
  # `path:`: the bundle host runs one instance per path, so a slug gets its own
  # only if it is the only one on `path: /<its own slug>`. Two slugs on the SAME
  # path are one instance holding one credential, and the render fails rather than
  # picking a winner. See docs/operate/secrets.md.
  #
  # Two other ways a server gets its values, both shown further down:
  #   - `consoleEnv:` — env that lands on the CORE gateway ONLY (the human console),
  #     never on the bundle. The `secrets` server uses it to keep an admin key off
  #     the /mcp container. See the `secrets` entry.
  #   - `params: true` — resolve everything stored under
  #     /strad/{env}/mcp/{slug}/static/* and .../oauth/* in the secrets system and
  #     inject it as this server's env at deploy time. See the
  #     `remote-filesystem-tmp-public` entry.
  #
  # `timeoutMs` overrides the MCP SDK's silent 60s default, which otherwise kills
  # a slow tool call and presents as a mysterious platform failure. Set it
  # generously for anything browser-driven.
  #
  # CAPABILITY (read-only vs read-write) is not a container setting. It is the
  # gateway's `tools:` policy, per SLUG:
  #
  #     tools:
  #       allow: [list_things, get_thing]   # exhaustive: only these may run
  #       deny:  [delete_thing]             # subtracts, and wins over allow
  #
  # strad enforces it on tools/list AND on tools/call — a withheld tool is refused
  # before it reaches the upstream. So two slugs may point at the SAME image, the
  # SAME bundle and the SAME path, and differ only in what they may do. The pair
  # below is the worked example.
  #
  # The trade is worth stating: read-only used to be physics (a container built
  # without the write tools in it) and is now policy (a gateway that declines).
  # For 1Password that is sharp — one container holds one service-account token,
  # and it has to be the read-write one — so a read-only 1Password slug is
  # read-only because strad says so, not because 1Password would refuse. See
  # HACKS.md #22.
  - slug: slack
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /slack
    entitlements: [admin]
    env:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"

  # X comes as a read tier and a write tier: `x-twitter` withholds
  # create_bookmark and remove_bookmark, and `x-twitter-rw` below is the twin
  # that adds them. Both write only the account's PRIVATE bookmarks. OAuth
  # credentials come from an X Developer Console app.
  #
  # TWO WAYS TO CREDENTIAL THIS SERVER, and the second is the durable one.
  #
  # As written below it runs in STATIC-ACCESS-TOKEN mode: something outside strad
  # mints a short-lived access token and this deployment injects it. Simple, and
  # it goes stale between deploys — a supplementary image's env: is baked at
  # render time.
  #
  # The alternative is REFRESH-TOKEN mode, seeded once in /ui/secrets under
  # /strad/{env}/mcp/x-twitter/static/ and left alone:
  #
  #     params: true
  #     paramsWritable: [X_OAUTH_REFRESH_TOKEN]
  #
  # X's refresh tokens are SINGLE-USE: every refresh mints a new one and kills the
  # previous. `paramsWritable` is what lets the server persist each new value back
  # through core, and re-read the live one at boot instead of the value the last
  # deploy baked — which is what makes "set it once and it keeps working" true
  # across restarts. See docs: /operate/secrets/.
  #
  # Or CONSENT in the console and keep durability: add an `oauth:` connector whose
  # refreshTokenVariable is X_OAUTH_REFRESH_TOKEN, and keep it under
  # paramsWritable:. The consent writes /strad/{env}/mcp/x-twitter/oauth/, and
  # because the name is on the connector every rotation is written back there too.
  # A token already seeded under static/ keeps rotating there until the first
  # Connect, so adding the connector is safe before anyone consents.
  #
  # THE OTHER HALF, for a credential that does NOT rotate on use but does get
  # rotated by a human: `paramsRefresh:`. A supplementary server's managed
  # parameters are BAKED onto its component by the renderer, so rotating one in
  # the console changes nothing until the next deploy. Listing the name here makes
  # the container re-read it while it runs:
  #
  #     params: true
  #     paramsRefresh: [BRIGHTDATA_API_KEY]
  #
  # Empty by default on every server — nothing refreshes unless a human writes the
  # name. The poll costs one store read per listed variable per component per
  # `gateway.secrets.paramRefreshSeconds` (default 300, floor 30), which is why it
  # is a poll and not a per-request resolve. It requires `params: true`, which is
  # also what makes it disclose nothing: that flag already baked the whole
  # namespace onto this component, so the re-read only adds freshness.
  #
  # WHAT IT CANNOT DO is make an upstream re-read. A server that builds its client
  # per request (strad-fetch) uses the new value on the next call; one that
  # memoises a connection at mount time (telegram's MTProto session) keeps the boot
  # value until it restarts. The bundle host logs which at boot. See limitation #71.
  - slug: x-twitter
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /x-twitter
    entitlements: [admin]
    env:
      X_OAUTH_ACCESS_TOKEN: "${X_OAUTH_ACCESS_TOKEN}"
    tools:
      allow:
        - get_my_account
        - get_user
        - get_home_timeline
        - get_user_tweets
        - get_bookmarks
        - search_recent_tweets
        - get_tweets

  # The read-write twin: same bundle, same path, so ONE mount and ONE X client.
  # No `tools:` policy, so all nine tools, the two private bookmark writes
  # included.
  #
  # In refresh-token mode the twin declares NO credential of its own: no
  # `params:`, no `paramsWritable:`, no `oauth:`. X's refresh token is spent by
  # every refresh, so two copies of it are two holders that kill each other.
  # The config check refuses a twin that lists the variable under its own
  # `paramsWritable:` or names it on its own connector. Put `bookmark.write` in
  # the OWNER's `oauth.scopes` and consent there. See docs:
  # /operate/secrets/#two-slugs-one-rotating-credential.
  #
  # In the static-access-token mode written here there is nothing to rotate, so
  # it repeats the env map like any twin. The component's env is the union, so
  # `enabled: false` on one variant cannot strip the token from the other.
  - slug: x-twitter-rw
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /x-twitter
    entitlements: [admin]
    env:
      X_OAUTH_ACCESS_TOKEN: "${X_OAUTH_ACCESS_TOKEN}"

  # The read-only twin of `slack`, further up: same image, same bundle, same path,
  # same container, same credential. The ONLY difference is the policy the gateway
  # enforces. Declare the credential on BOTH variants: a component's env is the
  # union of its servers' env maps, so this is a no-op at deploy time, and it
  # means `enabled: false` on one variant cannot silently strip the secret from
  # its twin.
  - slug: slack-readonly
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /slack
    entitlements: [admin, readonly]
    env:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
    tools:
      allow:
        - slack_get_channels
        - slack_get_channel
        - slack_get_thread
        - slack_download_file
        # The DM reads. `slack_get_dm` resolves an EXISTING conversation rather
        # than calling conversations.open, so nothing here creates anything.
        # Sending one is `slack_send_dm`, which this tier deliberately withholds.
        - slack_get_dms
        - slack_get_dm
        - slack_find_user
        # The MCP Events feed's state. Reports, calls nothing; no secret value.
        - slack_events_status

  # A SERVER WHOSE CREDENTIAL IS ONE PERSON.
  #
  # google-sheets authenticates with an OAuth refresh token, and a refresh token
  # is exactly one Google account — there is no service account and no
  # impersonation. The pair below is ONE account, so both slugs sit on the
  # conventional `/google-sheets` mount and share its credential, and the only
  # difference between them is the tools policy.
  #
  # SEVERAL ACCOUNTS IS THE OTHER SHAPE, and it needs one more thing: give each
  # slug `path: /<its own slug>`. The bundle host serves one instance per path and
  # hands a slug its per-slug variables (GOOGLE_SHEETS_WORK_RO__…) only when the
  # path is the slug's own name — so six google-sheets slugs over three accounts
  # are six entries, six paths, six mounts, one implementation. Two slugs sharing
  # one path are one process holding one token, and renderAppSpec refuses that
  # outright when their values differ. See docs/servers/google-sheets.md.
  #
  # OR, WITH NO DEPLOY: a STORE-SERVED INSTANCE. `path:
  # /_instance/google-sheets/<its own slug>` plus `params: true` puts nothing on
  # the container. The bundle host asks core for this slug's own
  # /strad/{env}/mcp/{slug}/ namespace and builds the mount from it, so the entry
  # can be created from /connectors and is served on its first request.
  # telegram, google-sheets and grafana only; it needs the gcp-parameter-store
  # provider. See docs/operate/secrets.md, "Store-served instances".
  #
  #   - slug: google-sheets-home
  #     kind: supplementary-image
  #     image: ghcr.io/tadasant/strad-bundle:latest
  #     bundle: bundle
  #     path: /_instance/google-sheets/google-sheets-home
  #     entitlements: [admin]
  #     params: true
  #
  # Because the credential is per slug in that shape, a read-only slug can be
  # seeded a refresh token consented only for spreadsheets.readonly — so Google
  # refuses a write even if the gateway did not. That is a guarantee 1Password's
  # read-only slug cannot have (HACKS.md #22).
  #
  # `oauth:` IS THE CREDENTIAL, and there is no `env:` block on either entry.
  #
  # A refresh token is minted by a HUMAN in a browser, so strad's console runs
  # the consent itself: this slug's page gets a Connect button, and the token goes
  # from the provider's token endpoint into
  # /strad/{env}/mcp/{slug}/oauth/GOOGLE_SHEETS_OAUTH_REFRESH_TOKEN without ever
  # being displayed.
  #
  # THE `oauth` KIND is the namespace for a credential strad MINTED. The client id
  # and secret are seeded by hand under `static/` — the kind for a value a human
  # TYPED — and a server reads `oauth/` first, `static/` second. The renderer
  # injects all three onto the bundle. See docs/operate/secrets.md.
  #
  # DO NOT write them as ${NAME} refs — the config gate refuses it, because
  # render-spec fails the WHOLE spec on one unresolvable ref and the token cannot
  # exist until after this slug has deployed. Injection is what breaks that
  # cycle: an unconnected slug deploys, mounts, and reports itself degraded.
  # See docs/operate/connectors.md.
  - slug: google-sheets-ro
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    # Its OWN path, not the shared /google-sheets: one path is one process
    # holding one token, and these two slugs hold two different accounts' worth
    # of consent. It is also what earns each slug its per-slug variable names.
    path: /google-sheets-ro
    entitlements: [admin, readonly]
    oauth:
      provider: google
      account: someone@example.com
      # The tier is DERIVED from this, not declared: every capability scope
      # ending in `.readonly` is a read-only slug.
      #
      # `drive.readonly` is OPTIONAL and does one thing: an .xlsx or .csv
      # UPLOADED to Drive is invisible to the Sheets API, so the four read tools
      # download it from Drive and parse it instead. It is read-only, so the
      # tier above is unchanged — but it is BROAD, reaching every file in that
      # account's Drive. It is shown on both slugs here because both tiers READ;
      # leave it off a slug that has no Office files to read. Without it, native
      # spreadsheets work exactly as before and an Office file fails with a
      # message naming the scope. No write tool ever uses it. HACKS.md #102.
      scopes:
        - https://www.googleapis.com/auth/spreadsheets.readonly
        - https://www.googleapis.com/auth/drive.readonly
    tools:
      allow:
        - get_spreadsheet
        - get_sheet_values
        - batch_get_sheet_values
        - find_in_spreadsheet

  # The write tier. Its consent is for the wider
  # https://www.googleapis.com/auth/spreadsheets, so Google enforces the split
  # from -ro as well as the gateway. Its `tools:` list is every tool but
  # share_spreadsheet — the one that hands the file to someone else, which only
  # the -rw-external slug below reaches. Drop the list and this slug lists the
  # share too, failing it on Google's side for want of the `drive` scope.
  - slug: google-sheets-rw
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-sheets-rw
    entitlements: [admin]
    oauth:
      provider: google
      account: someone@example.com
      scopes:
        - https://www.googleapis.com/auth/spreadsheets
        # Same as above, and for the same one purpose: READING an Office file
        # out of Drive. Writing one back is not a thing this server does under
        # any scope — the write tools refuse an Office file and say so.
        - https://www.googleapis.com/auth/drive.readonly
    tools:
      allow:
        - get_spreadsheet
        - get_sheet_values
        - batch_get_sheet_values
        - find_in_spreadsheet
        - update_sheet_values
        - append_sheet_rows
        - clear_sheet_values
        - add_sheet
        - create_spreadsheet
        - format_cells
    # FLOW-THROUGH: the target's half of a grant. Uncomment together with the
    # `reaches:` block below; either half alone is a config error.
    # reachableFrom: [my-sheet-app]

  # The external tier: no `tools:` block, because the full eleven ARE this tier,
  # share_spreadsheet included. Sharing a file this app did not create needs the
  # full https://www.googleapis.com/auth/drive scope — `drive.file` reaches only
  # app-created files — and that scope is read and write over the account's whole
  # Drive, so it lives on this slug alone. Its own path and its own consent,
  # like the two above. It needs no drive.readonly beside `drive`, which already
  # covers reading an Office file. docs: servers/google-sheets#sharing-is-its-own-tier.
  - slug: google-sheets-rw-external
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-sheets-rw-external
    entitlements: [admin]
    oauth:
      provider: google
      account: someone@example.com
      scopes:
        - https://www.googleapis.com/auth/spreadsheets
        - https://www.googleapis.com/auth/drive

  # A HOSTED SERVER THAT CALLS ANOTHER SLUG'S TOOLS THROUGH CORE, as itself, with
  # no credential of its own. `tools:` is exhaustive and bounded by the target's
  # own policy; `pin:` fixes arguments to exact values on every call. The server
  # calls `${STRAD_CORE_URL}/_strad/reach/my-sheet-app/mcp` with its component's
  # `STRAD_INTERNAL_TOKEN`. docs: servers/flow-through.
  #
  # - slug: my-sheet-app
  #   kind: supplementary-image
  #   image: ghcr.io/you/your-bundle:latest
  #   bundle: your-bundle
  #   path: /my-sheet-app
  #   entitlements: [admin]
  #   reaches:
  #     - slug: google-sheets-rw
  #       tools: [get_sheet_values, update_sheet_values]
  #       pin:
  #         spreadsheet_id: "your-spreadsheet-id"

  # THE SAME SHAPE FOR gmail, AND THE ONE FIELD THAT IS NOT OPTIONAL HERE.
  #
  # NAME THE THREE VARIABLES THIS SERVER'S OWN TREE READS. They default to the
  # google-sheets set because google-sheets was the first server to consume them,
  # and gmail reads GMAIL_OAUTH_*. Leave them at their defaults on a gmail slug
  # and core seeds and reads one name while the container looks for another: the
  # slug renders, deploys, and is never mounted — nothing in any log says why.
  #
  # gmail is also the one server in the bundle with TWO auth modes. The
  # conventional /gmail mount (see gmail-ro / gmail-rw above, if this deployment
  # has them) is a SERVICE ACCOUNT impersonating a Workspace user, and its three
  # variables sit on the same container under bare names. A per-slug gmail mount
  # therefore reads EVERY per-account name from its own slug prefix or not at
  # all — inheriting the bare service-account trio would serve a work mailbox
  # under a slug named for a personal account, with every call succeeding. The
  # bundle host drops them and says so in the boot log.
  #
  # Before consent this slug mounts, lists all nine tools and reports itself
  # degraded naming GMAIL_OAUTH_REFRESH_TOKEN. That is the state the Connect
  # button on its console page exists to end.
  - slug: gmail-someone-ro
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    # Its OWN path, for the same reason google-sheets' slugs have one.
    path: /gmail-someone-ro
    entitlements: [admin, readonly]
    oauth:
      provider: google
      account: someone@example.com
      # The tier is DERIVED from this: a capability scope ending in `.readonly`
      # is a read-only slug. Google then refuses a write even if the gateway did
      # not — the guarantee a shared credential cannot have.
      scopes:
        - https://www.googleapis.com/auth/gmail.readonly
      clientIdVariable: GMAIL_OAUTH_CLIENT_ID
      clientSecretVariable: GMAIL_OAUTH_CLIENT_SECRET
      refreshTokenVariable: GMAIL_OAUTH_REFRESH_TOKEN
    tools:
      allow:
        - list_email_conversations
        - get_email_conversation
        - search_email_conversations
        - download_email_attachments
        - list_draft_emails
        # A `-rw` slug for the same account consents `gmail.modify` and adds
        # the three draft and label writes, none of which sends:
        #   - change_email_conversation
        #   - upsert_draft_email
        #   - delete_draft_email   (one draft, permanently; HACKS.md #130)
        # `send_email` is the `-rw-external` tier's alone.

  # google-docs IS gmail's shape again: two auth modes on one container (the
  # conventional /google-docs mount impersonates a Workspace user under bare
  # GOOGLE_DOCS_SERVICE_ACCOUNT_* names), so a per-slug mount reads every
  # per-account name from its own prefix or not at all, and the three variables
  # MUST be named. Left at the google-sheets defaults, the slug is discovered by
  # the google-sheets tree instead and serves spreadsheets, not documents.
  #
  # Three tiers over one account are three entries, three paths, three consents.
  # The read tier's scopes are both `.readonly`, so Google refuses a write even
  # if the gateway did not. The -rw and -rw-external tiers both need the full
  # `documents` + `drive` grant — delete and share go through the Drive API on
  # documents the app never created — so what keeps share_document off -rw is
  # its `tools:` list alone, exactly as on the service-account tiers.
  - slug: google-docs-someone-ro
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-docs-someone-ro
    entitlements: [admin, readonly]
    oauth:
      provider: google
      account: someone@example.com
      # `documents.readonly` for get_document and its outline; `drive.readonly`
      # for export_document and list_comments, which are Drive API calls.
      scopes:
        - https://www.googleapis.com/auth/documents.readonly
        - https://www.googleapis.com/auth/drive.readonly
      clientIdVariable: GOOGLE_DOCS_OAUTH_CLIENT_ID
      clientSecretVariable: GOOGLE_DOCS_OAUTH_CLIENT_SECRET
      refreshTokenVariable: GOOGLE_DOCS_OAUTH_REFRESH_TOKEN
    tools:
      allow:
        - get_document
        - get_document_outline
        - export_document
        - list_comments

  # --- oauth: provider generic ------------------------------------------------
  # `google` is an IMPLEMENTATION — strad knows the endpoints, asks for an ID
  # token, and refuses a consent from the wrong account. `generic` is a
  # DECLARATION: name the endpoints and strad runs plain RFC 6749
  # authorization-code-with-PKCE against them.
  #
  # It proves NO identity, so there is no `account:` — nothing in plain OAuth 2.0
  # says whose account a token belongs to, and the console says so above the
  # button rather than implying a check it cannot make.
  #
  # Every field it cannot work without is REQUIRED, including all three variable
  # names: Zod strips an unknown key, so an optional `authorizeUrl:` misspelled
  # once would deploy clean and send a human to the wrong provider.
  #
  # - slug: linear-ro
  #   kind: supplementary-image
  #   image: ghcr.io/tadasant/strad-bundle:latest
  #   bundle: bundle
  #   path: /linear-ro
  #   entitlements: [admin]
  #   oauth:
  #     provider: generic
  #     label: Linear                # what the console calls it; defaults to the host
  #     authorizeUrl: https://linear.app/oauth/authorize
  #     tokenUrl: https://api.linear.app/oauth/token
  #     scopes: [read]
  #     authorizeParams:             # how THIS provider spells "offline access"
  #       access_type: offline
  #     clientAuth: post             # or `basic`, for the providers that require it
  #     credential: refresh_token    # or `access_token`, where that is the durable one
  #     clientIdVariable: LINEAR_OAUTH_CLIENT_ID
  #     clientSecretVariable: LINEAR_OAUTH_CLIENT_SECRET
  #     refreshTokenVariable: LINEAR_OAUTH_TOKEN

  # No credential at all — public endpoints, every tool.
  - slug: google-flights
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-flights
    entitlements: [admin]

  # Monarch's web app authenticates with an HttpOnly session cookie, so the
  # durable credential is MONARCH_COOKIE: the whole `Cookie` request header of a
  # signed-in request to api.monarch.com, copied from DevTools. It outranks
  # MONARCH_SESSION_TOKEN, which is still honoured.
  #
  # As written, the cookie lives in this server's own namespace,
  # /strad/{env}/mcp/monarch-money/static/MONARCH_COOKIE, and both lists below
  # name it. paramsRefresh re-reads it into the running container, so a cookie
  # rotated at /ui/secrets is used without a deploy. paramsWritable lets
  # `set_session_cookie` (verified against Monarch first) and a session Monarch
  # re-issues persist it back. MONARCH_COOKIE_SLUG tells the bundle host which
  # slug's namespace that is. It defaults to `monarch-money-readwrite`, because
  # a read-only and a read-write slug usually share this one path.
  #
  # Optional, best-effort headless re-login on a refused cookie (a CAPTCHA
  # blocks it for some accounts; see limitation #110):
  #   MONARCH_EMAIL, MONARCH_PASSWORD, MONARCH_TOTP_SECRET (the authenticator
  #   seed), MONARCH_DEVICE_UUID (pins one trusted device across deploys).
  - slug: monarch-money
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /monarch-money
    entitlements: [admin]
    params: true
    paramsRefresh: [MONARCH_COOKIE]
    paramsWritable: [MONARCH_COOKIE]
    env:
      MONARCH_COOKIE_SLUG: monarch-money

  # `title`/`description` are what a human sees in /console. GCS_BUCKET pins every
  # operation to one bucket — a literal value, not a secret, and it is also what
  # the human /ui/gcs view scopes to.
  - slug: gcs
    kind: supplementary-image
    title: Google Cloud Storage
    description: Browse the object store this server is scoped to.
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /gcs
    entitlements: [admin]
    env:
      GCS_PROJECT_ID: "my-project"
      GCS_BUCKET: "my-public-bucket"
      GCS_SERVICE_ACCOUNT_KEY_JSON: "${GCS_SERVICE_ACCOUNT_KEY_JSON}"

  # The store-agnostic secrets/parameters manager. Parameter Manager indexes every
  # managed variable; Secret Manager backs the ones that are secret. A parameter is
  # addressed by one canonical path, /strad/{env}/mcp/{slug}/{kind}/{VARIABLE}, and
  # is EITHER non-secret (safe to read back) OR secret (write-and-inject-only). The
  # name is `secrets`, not `gcp-secrets`: the store is an implementation detail.
  #
  # THIS ENTRY IS A SECURITY BOUNDARY, and the shape is the whole point. THREE
  # credentials, three roles, deliberately different service accounts:
  #
  #   env:         SECRETS_SERVICE_ACCOUNT_KEY_JSON        -> the BUNDLE   (viewer)
  #   consoleEnv:  SECRETS_ADMIN_SERVICE_ACCOUNT_KEY_JSON  -> CORE only    (admin)
  #   STRAD_PARAMS_RESOLVER_SERVICE_ACCOUNT_KEY_JSON       -> DEPLOY only  (resolver)
  #
  # `env:` lands on the /mcp container: the VIEWER key. It can list parameters, read
  # notes and read NON-SECRET values, and CANNOT read a secret value — its account
  # lacks secretmanager.versions.access, so Google answers 403 to the only call that
  # would return one. A prompt injection that talks a tool into reading a secret
  # still gets a 403.
  #
  # `consoleEnv:` lands on the CORE component alone (a broadcast SECRET would reach
  # the bundle too): the ADMIN key, which can add, rotate, reveal and delete both
  # kinds — driven only by a human on /ui/secrets, behind the console SSO gate.
  #
  # The RESOLVER account (STRAD_PARAMS_*, set in the DEPLOY environment, not here)
  # reads both stores' values at deploy time to inject a `params: true` server's env.
  #
  # NAMESPACE: put these parameters in a project that holds ONLY them, not the one
  # holding strad's own strad-<env>-* secrets. The path prefix is a code-level guard;
  # the GCP project is the real fence.
  - slug: secrets
    kind: supplementary-image
    title: Secrets & parameters
    description: Add, rotate, reveal and delete non-secret and secret parameters. The MCP server can never return a secret value.
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /secrets
    entitlements: [admin]
    env:
      SECRETS_PROJECT_ID: "strad-secrets-staging" # non-secret: a literal, not a ${ref}
      SECRETS_NAMESPACES: "/strad/staging/mcp/"
      SECRETS_CONSOLE_URL: "https://staging.strad.tadasant.com/ui/secrets"
      # Parameter Manager viewer — NO secretmanager.versions.access. This is the lock.
      SECRETS_SERVICE_ACCOUNT_KEY_JSON: "${SECRETS_VIEWER_KEY_JSON}"
      # The SECOND store's viewer key, for the mcpStores: block below. Its own
      # credential, on its own project — never one identity granted on both, and
      # never the console's admin key. Uncomment together with that block;
      # check-config refuses a viewerKeyVar that is not declared here.
      # ZIMMER_SECRETS_VIEWER_SERVICE_ACCOUNT_KEY_JSON: "${ZIMMER_SECRETS_VIEWER_KEY_JSON}"
      # WRITE-BACK, and what it does and does not grant. A server that declares
      # `paramsWritable:` can POST a rotated credential to core, which performs
      # the write with the ADMIN key below — the container never holds one.
      #
      # IT BOUNDS THE NAMES AND THE CALLER. Each component holds its OWN
      # `STRAD_INTERNAL_TOKEN`, derived by core from its root, and core reads the
      # caller's component off it — so a container reaches the `paramsWritable:`
      # names (and, for the GET alone, the `paramsRefresh:` names) of the
      # servers on its own component, and nothing on any other. The GET is a
      # value read on the component with the public route, so that token is a
      # read credential for those names. What the list bounds: it is opt-in and
      # empty by default, nothing outside it is reachable, and every name on it
      # is a credential that ROTATES, so losing one costs a re-seed. See docs:
      # /operate/secrets/ and limitation #63.
    consoleEnv:
      SECRETS_PROJECT_ID: "strad-secrets-staging" # non-secret: a literal, not a ${ref}
      # A LIST, and the console's may be wider than the container's above. The
      # console offers these as SUGGESTIONS on a free-text field (set
      # SECRETS_NAMESPACES_STRICT: "true" to make them a limit); the gateway namespace holds the
      # deployment's own ${NAME} references, which a human manages and an agent
      # has no business enumerating.
      SECRETS_NAMESPACES: "/strad/staging/mcp/,/strad/staging/gateway/static/"
      # Parameter Manager admin + Secret Manager admin. Core only. Humans only.
      SECRETS_ADMIN_SERVICE_ACCOUNT_KEY_JSON: "${SECRETS_ADMIN_KEY_JSON}"
      # The SECOND store's admin key, for the consoleStores: block below. Its own
      # credential, on its own project — never one identity granted on both.
      # Uncomment together with that block; check-config refuses an adminKeyVar
      # that is not declared here.
      # ZIMMER_SECRETS_ADMIN_SERVICE_ACCOUNT_KEY_JSON: "${ZIMMER_SECRETS_ADMIN_KEY_JSON}"
    # ONE CONSOLE PAGE, MANY STORES. Uncomment to give /ui/secrets a project
    # picker instead of one page per GCP project. It REPLACES the SECRETS_*
    # reading above for the console. `mcpStores:` below is the /mcp half — the
    # two are separate fields because the credential each carries is separate,
    # and the console's namespace list may be wider than the container's.
    # See docs: /operate/secrets/.
    #
    # consoleStores:
    #   - project: strad-secrets-staging
    #     label: strad staging
    #     namespaces: ["/strad/staging/mcp/", "/strad/staging/gateway/static/"]
    #     # A consoleEnv: KEY, not a ${ref}: consoleEnv: is the one scope that
    #     # lands on core and stops. check-config refuses an adminKeyVar that is
    #     # not declared there, one that is ALSO an env: key on any server, one
    #     # whose ${REF} any server's env: carries under ANY key, and two stores
    #     # naming the same one.
    #     #
    #     # Two stores whose DIFFERENT names carry one ${REF} is the same
    #     # identity on both projects, and check-config WARNS rather than
    #     # refusing: one service account on strad-secrets-prod and
    #     # strad-secrets-staging is two projects in one system, and that is a
    #     # judgement a reviewer makes. The mcpStores: block below refuses the
    #     # same shape, because a shared viewer key collapses the capability
    #     # probe and has no correct form.
    #     adminKeyVar: SECRETS_ADMIN_SERVICE_ACCOUNT_KEY_JSON
    #     # Per STORE, not per page. A union list checked against whichever
    #     # project happens to be selected is a bound that does not bind.
    #     namespacesStrict: true
    #   - project: zimmer-secrets-staging
    #     label: zimmer staging
    #     # No two stores may declare OVERLAPPING namespaces: a path both could
    #     # claim is a console write landing in whichever project was declared
    #     # first. Refused here rather than by storeForPath at write time, which
    #     # is where it would otherwise first be noticed. Across two SLUGS the
    #     # same overlap is a warning, not a refusal.
    #     namespaces: ["/zimmer/staging/mcp/static/"]
    #     # ONE ADMIN KEY PER STORE. Never one identity granted on both projects:
    #     # that is a strictly larger blast radius than the two it replaces.
    #     adminKeyVar: ZIMMER_SECRETS_ADMIN_SERVICE_ACCOUNT_KEY_JSON
    #     reveal: true
    #
    # ONE /mcp CONTAINER, MANY STORES. The agent-facing twin of the block above.
    # Absent (as here), the container resolves ONE store out of the
    # SECRETS_PROJECT_ID / SECRETS_NAMESPACES / SECRETS_SERVICE_ACCOUNT_KEY_JSON
    # entries under `env:`. Present, it REPLACES that reading entirely: strad
    # renders a non-secret SECRETS_STORES descriptor onto this bundle and the
    # container reads that — so declaring both is refused by check-config rather
    # than resolved to one of them.
    #
    # WHAT KEEPS PRODUCTION UNABLE TO RETURN A SECRET VALUE when it shares a
    # container with a store that can. Each entry names its OWN viewer key; the
    # server probes projects:testIamPermissions once per store and gates every
    # read, write and delete on the capability of the store the requested PATH
    # resolves to. The tool LIST is the union (an MCP listing is static per
    # container), the enforcement is not. Two entries may not share a viewer
    # credential — by key name OR by ${REF} — nor name one project id, nor
    # declare overlapping namespaces. Each is refused by check-config, because
    # each would make two stores' capabilities indistinguishable.
    #
    # Uncommenting it means DELETING the SECRETS_PROJECT_ID and SECRETS_NAMESPACES
    # lines from `env:` above — the container would ignore them, so leaving them
    # names a store this server does not front, and check-config says so.
    #
    # mcpStores:
    #   - project: strad-secrets-staging
    #     label: strad staging
    #     namespaces: ["/strad/staging/mcp/"]
    #     # An `env:` KEY, not a ${ref}: `env:` is the scope rendered onto this
    #     # server's bundle, which is the component that answers /mcp. Always a
    #     # VIEWER credential — an adminKeyVar cannot be borrowed here, because
    #     # the consoleStores: rules already refuse an admin key (or its ${REF})
    #     # under any server's env:.
    #     viewerKeyVar: SECRETS_SERVICE_ACCOUNT_KEY_JSON
    #   - project: zimmer-secrets-staging
    #     label: zimmer staging
    #     namespaces: ["/zimmer/staging/mcp/static/"]
    #     # ONE VIEWER CREDENTIAL PER STORE. Sharing one is two projects behind
    #     # one identity AND one probed capability answering for both, which is
    #     # the collapse the per-project probe exists to prevent — so a second
    #     # env: key carrying the same ${REF} is refused too. Declare it under
    #     # `env:` above alongside the first.
    #     viewerKeyVar: ZIMMER_SECRETS_VIEWER_SERVICE_ACCOUNT_KEY_JSON

  # A server that draws its credentials from the secrets system instead of from
  # hand-written `${REF}` secrets. `params: true` opts it in: at deploy time
  # render-spec resolves everything under /strad/{env}/mcp/remote-filesystem-tmp-public/
  # static/* — the non-secret REMOTE_FILESYSTEM_TMP_PUBLIC_GCS_CLIENT_EMAIL from Parameter
  # Manager and the secret REMOTE_FILESYSTEM_TMP_PUBLIC_GCS_PRIVATE_KEY from Secret Manager
  # — and injects them as SECRET env vars onto this bundle. A human sets both once in
  # /ui/secrets; the container holds no cloud credential. The bucket is deployment
  # config, not a credential, so it stays a literal here.
  #
  # SENSITIVE_VIEWER_DOMAIN is the sensitivity half of strad's artifact store:
  # an `is_sensitive: true` upload grants `domain-<this>` READER on the object and
  # returns a storage.cloud.google.com link, which Google gates behind a sign-in.
  # Leave it unset and a sensitive upload is REFUSED rather than stored where
  # nobody can open it. See docs: /servers/artifact-store/.
  #
  # SENSITIVE_VIEWER_ACCOUNT (optional) is the account that link should OPEN AS.
  # storage.cloud.google.com authenticates the reader's DEFAULT Google account,
  # so someone signed in to a personal address plus a work one gets a 403 from
  # the personal one even though the domain grant is correct. Set this to a full
  # address inside SENSITIVE_VIEWER_DOMAIN and links carry `?authuser=<it>`.
  # It is a hint, not a grant — the whole domain can still open the artifact.
  # Only set it if you know the address: pointing readers at an account nobody
  # is signed in to is worse than leaving it unset.
  - slug: remote-filesystem-tmp-public
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /remote-filesystem-tmp-public
    entitlements: [admin]
    params: true
    env:
      REMOTE_FILESYSTEM_TMP_PUBLIC_GCS_BUCKET: "my-screenshots"
      REMOTE_FILESYSTEM_TMP_PUBLIC_SENSITIVE_VIEWER_DOMAIN: "example.com"
      # REMOTE_FILESYSTEM_TMP_PUBLIC_SENSITIVE_VIEWER_ACCOUNT: "dana@example.com"

  # The 1Password CLI (`op`) is baked into the image; the image ships no
  # credential. See servers/onepassword/README.md.
  #
  # EVERY REVEAL ASKS A HUMAN. `onepassword_get_item` on an item with a password,
  # token or other sensitive field, and `onepassword_share_item`, ask the session
  # that made the call, through the URL it sends in `X-Elicitation-Url` (held to
  # `gateway.elicitation.allowedUrlPrefixes` above), and reveal nothing unless
  # that human approves. A call with no one to ask, the console's included, is
  # refused. So is every create, unless the slug opts its creates out (below).
  # In the bundle no switch skips the reveal prompt; the host strips
  # DANGEROUSLY_SKIP_ELICITATIONS from the process. docs/servers/confirmations.
  - slug: onepassword-rw
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /onepassword
    entitlements: [admin]
    confirmations: true
    timeoutMs: 240000
    env:
      OP_SERVICE_ACCOUNT_TOKEN: "${OP_SERVICE_ACCOUNT_TOKEN}"
    # Only when an edge in front of the approval URL wants strad's credential.
    # confirmationHeaders:
    #   CF-Access-Client-Id: "${ZIMMER_CF_ACCESS_CLIENT_ID}"
    #   CF-Access-Client-Secret: "${ZIMMER_CF_ACCESS_CLIENT_SECRET}"

  # A SECOND 1PASSWORD TOKEN IS A SECOND MOUNT. One process holds one bare
  # OP_SERVICE_ACCOUNT_TOKEN, so a slug with a token of its own goes on
  # `path: /<its own slug>`, and the bundle host mounts an instance there holding
  # exactly the token named <SLUG>__OP_SERVICE_ACCOUNT_TOKEN, never the bare one.
  # The keys are written ALREADY per-slug: the schema refuses two slugs on one
  # bundle declaring one bare name with different values.
  #
  # <SLUG>__OP_ELICITATION_WRITE: "false" is the provisioning posture, read under
  # this slug's own name only: its creates (login, secure note, API credential)
  # run unasked, and a reveal or a share link still asks. Any other value, or
  # none, asks.
  # - slug: onepassword-provisioning
  #   kind: supplementary-image
  #   image: ghcr.io/tadasant/strad-bundle:latest
  #   bundle: bundle
  #   path: /onepassword-provisioning
  #   entitlements: [admin]
  #   confirmations: true
  #   timeoutMs: 240000
  #   env:
  #     ONEPASSWORD_PROVISIONING__OP_SERVICE_ACCOUNT_TOKEN: "${OP_SERVICE_ACCOUNT_TOKEN_PROVISIONING}"
  #     ONEPASSWORD_PROVISIONING__OP_ELICITATION_WRITE: "false"

  # Browser-driven. It drives a real headless Chromium and logs into a real
  # account, so a tool call can take minutes — hence the raised `timeoutMs`. It
  # does NOT launch its own browser: the bundle host owns ONE Chromium and hands
  # each browser server a context on it (servers/bundle/host/src/browser.ts), so
  # adding another one costs a context, not another 545MB peak.
  - slug: good-eggs
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /good-eggs
    entitlements: [admin]
    timeoutMs: 120000
    env:
      GOODEGGS_EMAIL: "${GOODEGGS_EMAIL}"
      GOODEGGS_PASSWORD: "${GOODEGGS_PASSWORD}"

  # SSH: BREAK-GLASS SHELL ON ONE HOST PER SLUG. Each host is a store-served
  # instance credentialed from its own namespace — seed SSH_HOST, SSH_USERNAME,
  # SSH_PRIVATE_KEY, SSH_HOST_KEY (the pinned host key; there is no trust on
  # first use) and optionally SSH_PORT under /strad/{env}/mcp/<slug>/static/.
  # Commented out because an instance needs `provider: gcp-parameter-store`.
  #
  # ADMIN ONLY. `entitlements:` is the whole boundary on a shell, which is why an
  # SSH slug can only come from this file — the runtime roster refuses to create
  # one. NEVER entitle a host that agent sessions run ON to a role those
  # sessions hold: for strad's own deployment that is `ssh-tadasant-zimmer-prod`,
  # root on the Zimmer production host, and it stays `[admin]`. docs: servers/ssh.
  #
  # - slug: ssh-tadasant-zimmer-prod
  #   kind: supplementary-image
  #   title: Zimmer production host (SSH, root)
  #   description: >-
  #     DANGER - PRODUCTION SSH. Root on the Zimmer production host. Human
  #     break-glass only; never granted to Zimmer sessions, which run on it.
  #   image: ghcr.io/tadasant/strad-bundle:latest
  #   bundle: bundle
  #   path: /_instance/ssh/ssh-tadasant-zimmer-prod
  #   params: true
  #   entitlements: [admin]
  #   # Core gives up on a call after `timeoutMs` (default 120 s) and the SSH
  #   # session is closed with it; this lets a command run to its own
  #   # 15-minute ceiling.
  #   timeoutMs: 960000
  #
  # A read-only tier of a host is the same instance tree under another slug,
  # seeded separately, with the write and execute tools withheld:
  #
  #   tools:
  #     allow: [ssh_connection_info, ssh_check_connection, ssh_list_directory, ssh_download]

  # A server that ships as its OWN image is the same entry with a different
  # `image`, and it needs its own bundle, because one component runs one image:
  #
  # - slug: my-server
  #   kind: supplementary-image
  #   image: ghcr.io/tadasant/strad-server-my-server:latest
  #   bundle: bundle-my-server      # declared under bundles:
  #   entitlements: [admin]
  #   env:
  #     MY_SERVER_TOKEN: "${MY_SERVER_TOKEN}"

# ---------------------------------------------------------------------------
# mcpServers: — the same file every other MCP client reads
# ---------------------------------------------------------------------------
#
# An OPTIONAL second dialect for the SAME server list, in the shape of draft
# SEP-2633's `mcp.json`. Entries here are desugared into `servers:` above before
# the schema sees them — `type: streamable-http` becomes `kind: remote-http`,
# the key becomes the slug, `${env:NAME}` becomes `${NAME}` — so nothing
# downstream knows the dialect exists and `servers:` stays the contract.
#
# SEP-2633 is an OPEN DRAFT, not a merged standard, and there is no published
# JSON schema for it yet — which is why nothing here names a `$schema`. It
# covers exactly one of strad's four kinds. `supplementary-image` and `builtin`
# are deployment topology and an in-process import, and neither is expressible
# in a client config; `type: stdio` looks like the nearest analog to a container
# and is not one, so it is refused rather than guessed at. So is `type: sse`,
# and so is the SEP's `oauth:` object, which is being renegotiated upstream.
#
# `strad:` is the one extension: the gateway-only fields the format has no slot
# for. Without it an entry attaches a server with `entitlements: []` — fail
# closed, and reachable by NOBODY. That is what an `mcp.json` means on a gateway
# (the format assumes the config's reader is its only user), so it is not
# defaulted away; `npm run config:check` warns for every such slug and boot
# emits `strad.mcp_json_unentitled`.
#
# A file that is JUST an mcp.json — `mcpServers` and no `version:` — is also a
# config strad will load: `version: 1` and an empty `auth:` are supplied, which
# are the only two root fields with no default. It boots and serves nothing to
# anyone until roles and entitlements exist.
#
# See docs: servers/interface.
mcpServers:
  # SEP-2633's own worked example, attached to strad. The host is RFC 2606
  # reserved and this entry ships disabled: it is here to be read and to be
  # validated by `npm run config:check`, not to be reached.
  analytics:
    title: Analytics
    description: What the server provides.
    type: streamable-http
    url: https://mcp.analytics.example.com/mcp
    headers:
      X-API-Key: "${env:ANALYTICS_API_KEY}"
    strad:
      entitlements: [admin]
      enabled: false
