# strad configuration
#
# The core ships with ZERO MCP servers. This file is the ONLY place you attach
# them, and attaching one is a single entry under `servers:`.
#
# Secret VALUES never appear here. `${NAME}` resolves against the environment at
# boot — and those env vars are injected by CI from GCP Secret Manager
# (`strad-<env>-<NAME>`) as App Platform SECRET env vars. The container itself
# holds no cloud credentials.
#
# This file is an EXAMPLE: it shows every shape the schema allows, with fewer
# servers than a real deployment. infra/strad.staging.yaml is the real one — 26
# server slugs across 2 App Platform components.

version: 1

gateway:
  name: strad
  env: staging
  publicUrl: https://staging.strad.tadasant.com

auth:
  # Humans. Verified against the Google Workspace `hd` claim — NOT the email
  # suffix, which a personal account can spell however it likes.
  google:
    enabled: true
    hostedDomain: tadasant.com
    roles: [admin]

  # Machines. `strad_<env>_<pubid>_<secret>`; only the SHA-256 is stored.
  # Mint with: npm run token:mint -- --label "my agent" --roles admin
  staticTokens:
    enabled: true
    store: env

  # Temporary: lets a human into /console with ADMIN_BOOTSTRAP_TOKEN while
  # Google OAuth credentials are being provisioned. Requires ALLOW_DEV_AUTH=true.
  # It CANNOT authenticate /mcp. Delete once OAuth lands — see HACKS.md.
  consoleDevBypass:
    enabled: true
    roles: [admin]

# A role names the servers it may reach. `*` means every configured server.
# Both directions must agree: the role must name the server, AND the server must
# list the role under `entitlements`. Neither side can grant access alone — see
# `readonly` below, which names `slack-readonly`, and `slack-readonly`, which
# names `readonly` back.
roles:
  admin:
    servers: ["*"]
  readonly:
    servers: [echo, slack-readonly]

# Deployment groups. `core` is implicit (the public gateway); every bundle below
# becomes an internal-only App Platform component on the private network.
#
# There is exactly ONE here, and that is the whole shape of the current design:
# every supplementary MCP server runs in one container, off one image, and the
# gateway proxies to each on its own path. strad deploys 2 components in total —
# `core` and this.
bundles:
  - name: bundle
    # 2GB because this container holds a real Chromium (the browser servers share
    # ONE, ~940MB RSS for its process tree) alongside every API server, and 1GB is
    # one bad page render from an OOM that takes every server down with it. The
    # binding constraint is CPU, not RAM: 1 shared vCPU serialises Chromium's
    # rendering while the same box answers every Slack call. If the telemetry
    # shows event-loop lag, the next move is a dedicated CPU (apps-d-1vcpu-2gb),
    # not more memory.
    instanceSizeSlug: apps-s-1vcpu-2gb

servers:
  # --- kind: builtin --------------------------------------------------------
  # Compiled into the strad image. This is how private/internal servers ship:
  # tadasant-internal builds its own image with its modules and registers them
  # with entries exactly like this one.
  #
  # `bundle: core` runs it inside the gateway process. Naming another bundle
  # instead puts it in a component running the strad image in bundle mode, which
  # the gateway reaches at ${<bundle>.PRIVATE_URL} — useful for isolating a
  # builtin, and costs a component.
  - slug: echo
    kind: builtin
    module: "./servers/echo.js"
    bundle: core
    entitlements: [admin, readonly]
    options:
      greeting: "hello from the core"

  # --- kind: remote-http ----------------------------------------------------
  # Proxy an MCP server that already exists on the internet. strad holds the
  # credential; the client never sees it. deepwiki needs none, which is what
  # makes it a good canary.
  - slug: deepwiki
    kind: remote-http
    url: https://mcp.deepwiki.com/mcp
    entitlements: [admin]
  #
  # With a credential, it is the same entry plus `headers:`:
  #
  # - slug: granola
  #   kind: remote-http
  #   url: https://mcp.granola.ai/mcp
  #   entitlements: [admin]
  #   headers:
  #     Authorization: "Bearer ${GRANOLA_TOKEN}"

  # --- kind: supplementary-image --------------------------------------------
  # A server published as its own container image. strad deploys it as an
  # internal-only component and proxies to it over the private network.
  #
  # ONE image backs MANY servers: give each entry the SAME `image` and `bundle`
  # but a distinct `path`, and they all run in that one component (a component
  # still runs exactly one image). That is `ghcr.io/tadasant/strad-bundle:latest`
  # — 15 MCP servers in one Node process, one shared Chromium, served at /slack,
  # /gmail, /onepassword, /secrets and so on. Every entry below points at it.
  #
  # `env:` maps a container env var to a `${NAME}` ref, and those values resolve
  # onto THIS bundle only, so a credential is not broadcast to every component. A
  # bare string is used literally (see `GCS_BUCKET`); only `${NAME}` is a secret
  # lookup.
  #
  # Two other ways a server gets its values, both shown further down:
  #   - `consoleEnv:` — env that lands on the CORE gateway ONLY (the human /ui),
  #     never on the bundle. The `secrets` server uses it to keep an admin key off
  #     the /mcp container. See the `secrets` entry.
  #   - `params: true` — resolve everything a human has stored under
  #     /strad/{env}/mcp/{slug}/static/* in the secrets system and inject it as this
  #     server's env at deploy time. See the `remote-fs-screenshots` entry.
  #
  # `timeoutMs` overrides the MCP SDK's silent 60s default, which otherwise kills
  # a slow tool call and presents as a mysterious platform failure. Set it
  # generously for anything browser-driven.
  #
  # CAPABILITY (read-only vs read-write) is not a container setting. It is the
  # gateway's `tools:` policy, per SLUG:
  #
  #     tools:
  #       allow: [list_things, get_thing]   # exhaustive: only these may run
  #       deny:  [delete_thing]             # subtracts, and wins over allow
  #
  # strad enforces it on tools/list AND on tools/call — a withheld tool is refused
  # before it reaches the upstream. So two slugs may point at the SAME image, the
  # SAME bundle and the SAME path, and differ only in what they may do. The pair
  # below is the worked example.
  #
  # The trade is worth stating: read-only used to be physics (a container built
  # without the write tools in it) and is now policy (a gateway that declines).
  # For 1Password that is sharp — one container holds one service-account token,
  # and it has to be the read-write one — so a read-only 1Password slug is
  # read-only because strad says so, not because 1Password would refuse. See
  # HACKS.md #22.
  - slug: slack
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /slack
    entitlements: [admin]
    env:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"

  # The read-only twin of the server above: same image, same bundle, same path,
  # same container, same credential. The ONLY difference is the policy the gateway
  # enforces. Declare the credential on BOTH variants: a component's env is the
  # union of its servers' env maps, so this is a no-op at deploy time, and it
  # means `enabled: false` on one variant cannot silently strip the secret from
  # its twin.
  - slug: slack-readonly
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /slack
    entitlements: [admin, readonly]
    env:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
    tools:
      allow:
        - slack_get_channels
        - slack_get_channel
        - slack_get_thread
        - slack_download_file

  # No credential at all — public endpoints, every tool.
  - slug: google-flights
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-flights
    entitlements: [admin]

  - slug: monarch-money
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /monarch-money
    entitlements: [admin]
    env:
      # A session token, minted out-of-band. The server does not log in from
      # credentials here.
      MONARCH_SESSION_TOKEN: "${MONARCH_SESSION_TOKEN}"

  # `title`/`description` are what a human sees in /console. GCS_BUCKET pins every
  # operation to one bucket — a literal value, not a secret, and it is also what
  # the human /ui/gcs view scopes to.
  - slug: gcs
    kind: supplementary-image
    title: Google Cloud Storage
    description: Browse the object store this server is scoped to.
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /gcs
    entitlements: [admin]
    env:
      GCS_PROJECT_ID: "my-project"
      GCS_BUCKET: "my-public-bucket"
      GCS_SERVICE_ACCOUNT_KEY_JSON: "${GCS_SERVICE_ACCOUNT_KEY_JSON}"

  # The store-agnostic secrets/parameters manager. Parameter Manager indexes every
  # managed variable; Secret Manager backs the ones that are secret. A parameter is
  # addressed by one canonical path, /strad/{env}/mcp/{slug}/{kind}/{VARIABLE}, and
  # is EITHER non-secret (safe to read back) OR secret (write-and-inject-only). The
  # name is `secrets`, not `gcp-secrets`: the store is an implementation detail.
  #
  # THIS ENTRY IS A SECURITY BOUNDARY, and the shape is the whole point. THREE
  # credentials, three roles, deliberately different service accounts:
  #
  #   env:         SECRETS_SERVICE_ACCOUNT_KEY_JSON        -> the BUNDLE   (viewer)
  #   consoleEnv:  SECRETS_ADMIN_SERVICE_ACCOUNT_KEY_JSON  -> CORE only    (admin)
  #   STRAD_PARAMS_RESOLVER_SERVICE_ACCOUNT_KEY_JSON       -> DEPLOY only  (resolver)
  #
  # `env:` lands on the /mcp container: the VIEWER key. It can list parameters, read
  # notes and read NON-SECRET values, and CANNOT read a secret value — its account
  # lacks secretmanager.versions.access, so Google answers 403 to the only call that
  # would return one. A prompt injection that talks a tool into reading a secret
  # still gets a 403.
  #
  # `consoleEnv:` lands on the CORE component alone (a broadcast SECRET would reach
  # the bundle too): the ADMIN key, which can add, rotate, reveal and delete both
  # kinds — driven only by a human on /ui/secrets, behind the console SSO gate.
  #
  # The RESOLVER account (STRAD_PARAMS_*, set in the DEPLOY environment, not here)
  # reads both stores' values at deploy time to inject a `params: true` server's env.
  #
  # NAMESPACE: put these parameters in a project that holds ONLY them, not the one
  # holding strad's own strad-<env>-* secrets. The path prefix is a code-level guard;
  # the GCP project is the real fence.
  - slug: secrets
    kind: supplementary-image
    title: Secrets & parameters
    description: Add, rotate, reveal and delete non-secret and secret parameters. The MCP server can never return a secret value.
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /secrets
    entitlements: [admin]
    env:
      SECRETS_PROJECT_ID: "${SECRETS_PROJECT_ID}"
      SECRETS_NAMESPACES: "/strad/staging/mcp/"
      SECRETS_CONSOLE_URL: "https://staging.strad.tadasant.com/ui/secrets"
      # Parameter Manager viewer — NO secretmanager.versions.access. This is the lock.
      SECRETS_SERVICE_ACCOUNT_KEY_JSON: "${SECRETS_VIEWER_KEY_JSON}"
    consoleEnv:
      SECRETS_PROJECT_ID: "${SECRETS_PROJECT_ID}"
      SECRETS_NAMESPACES: "/strad/staging/mcp/"
      # Parameter Manager admin + Secret Manager admin. Core only. Humans only.
      SECRETS_ADMIN_SERVICE_ACCOUNT_KEY_JSON: "${SECRETS_ADMIN_KEY_JSON}"

  # A server that draws its credentials from the secrets system instead of from
  # hand-written `${REF}` secrets. `params: true` opts it in: at deploy time
  # render-spec resolves everything under /strad/{env}/mcp/remote-fs-screenshots/
  # static/* — the non-secret REMOTE_FS_SCREENSHOTS_GCS_CLIENT_EMAIL from Parameter
  # Manager and the secret REMOTE_FS_SCREENSHOTS_GCS_PRIVATE_KEY from Secret Manager
  # — and injects them as SECRET env vars onto this bundle. A human sets both once in
  # /ui/secrets; the container holds no cloud credential. The bucket is deployment
  # config, not a credential, so it stays a literal here.
  - slug: remote-fs-screenshots
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /remote-fs-screenshots
    entitlements: [admin]
    params: true
    env:
      REMOTE_FS_SCREENSHOTS_GCS_BUCKET: "my-screenshots"

  # The 1Password CLI (`op`) is baked into the image; the image ships no
  # credential. The server refuses to serve without an elicitation posture, and
  # strad has no elicitation transport wired yet, so it skips them explicitly.
  # See servers/onepassword/README.md.
  - slug: onepassword-rw
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /onepassword
    entitlements: [admin]
    timeoutMs: 120000
    env:
      OP_SERVICE_ACCOUNT_TOKEN: "${OP_SERVICE_ACCOUNT_TOKEN}"
      DANGEROUSLY_SKIP_ELICITATIONS: "true"

  # Browser-driven. It drives a real headless Chromium and logs into a real
  # account, so a tool call can take minutes — hence the raised `timeoutMs`. It
  # does NOT launch its own browser: the bundle host owns ONE Chromium and hands
  # each browser server a context on it (servers/bundle/host/src/browser.ts), so
  # adding another one costs a context, not another 545MB peak.
  - slug: good-eggs
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /good-eggs
    entitlements: [admin]
    timeoutMs: 120000
    env:
      GOODEGGS_EMAIL: "${GOODEGGS_EMAIL}"
      GOODEGGS_PASSWORD: "${GOODEGGS_PASSWORD}"

  # A server that ships as its OWN image is the same entry with a different
  # `image`, and it needs its own bundle, because one component runs one image:
  #
  # - slug: my-server
  #   kind: supplementary-image
  #   image: ghcr.io/tadasant/strad-server-my-server:latest
  #   bundle: bundle-my-server      # declared under bundles:
  #   entitlements: [admin]
  #   env:
  #     MY_SERVER_TOKEN: "${MY_SERVER_TOKEN}"
