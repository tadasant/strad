# The config the local dev environment boots against.
#
# strad.config.yaml is the config baked into the stock image, and it has ZERO
# servers — which is correct for a shipped artifact and useless to look at. This
# one is the opposite: the smallest config that gives you something to POINT AN
# MCP CLIENT AT and a console you can actually enter.
#
# It is used by `npm run dev:agent` and by the `.agent-containers/` stack. It is
# NOT deployed anywhere: infra/strad.staging.yaml is the real one.
#
# Nothing here resolves a `${NAME}`, so it needs no secrets and boots offline.

version: 1

gateway:
  name: strad
  env: dev

auth:
  staticTokens:
    enabled: true
    store: env

  # Enter /console with ADMIN_BOOTSTRAP_TOKEN instead of Google OAuth. This is
  # the flag that turns the local console from a 401 wall into a screen, and it
  # is the reason this file exists separately from strad.config.yaml — the stock
  # config leaves it off, and a dev environment nobody can log into is not one.
  #
  # ALLOW_DEV_AUTH=true and ADMIN_BOOTSTRAP_TOKEN must also be set; the dev boot
  # paths set both. It cannot authenticate /mcp under any circumstances.
  consoleDevBypass:
    enabled: true
    roles: [admin]

  # Single-use console login tokens, so an agent looking at the local console
  # with Playwright can be handed a token that dies in minutes rather than the
  # bootstrap token: POST /console/tokens with `Authorization: Bearer
  # $ADMIN_BOOTSTRAP_TOKEN`, then POST the token to /console/token-login. The
  # session is view-only: it cannot reveal, write or delete a stored value, or
  # call a tool. Live only where gateway.env is dev, local, test or staging.
  consoleTokenLogin:
    enabled: true

roles:
  admin:
    servers: ["*"]

bundles: []

servers:
  # The echo builtin, in-process. It needs no credential, no network and no
  # container, so `tools/list` on a fresh clone returns a real tool rather than
  # an empty array — which is the difference between "the gateway is up" and
  # "the gateway is up and routing".
  - slug: echo
    kind: builtin
    module: "./servers/echo.js"
    bundle: core
    entitlements: [admin]
    options:
      greeting: "hello from your dev strad"

  # A local-tunnel pointed at 127.0.0.1 — no tunnel, because on a dev box the
  # tunnel is the part that adds nothing. What this exercises is the half that
  # is actually interesting: a slug whose upstream is USUALLY NOT THERE.
  #
  # Port 3141 is the Anki MCP add-on's own default and it serves at the ROOT of
  # that port (`http_path` defaults to the empty string), so starting Anki is
  # all it takes to make this route somewhere real. With Anki closed — the
  # normal case — the connection is refused at once and strad says the machine
  # is unreachable in its own words: `?servers=anki` returns one tool,
  # `anki__troubleshoot_host`, rather than an error, and `?servers=anki,echo`
  # serves that tool plus echo's. Both are the point, and BOTH need the path
  # below to stay empty: a wrong path answers 404, which is an ordinary
  # upstream error rather than an unreachable machine, so it fails
  # `?servers=anki,echo` outright instead of degrading to that one tool.
  - slug: anki
    kind: local-tunnel
    url: http://127.0.0.1:3141/
    entitlements: [admin]
