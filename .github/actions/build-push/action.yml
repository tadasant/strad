name: Build and push an image
description: >-
  docker/build-push-action, retried when the registry refuses the push. Wraps
  every step in this repo that builds an image, pushing or not.

# WHY THIS EXISTS
#
# ghcr answers a blob HEAD with `403 Forbidden` from time to time, in the middle
# of an otherwise healthy push, on credentials that worked seconds earlier. It
# turned `main` red on 2026-08-11 (run 31475413673): the whole bundle built, the
# layers exported, `[auth] tadasant/strad-bundle:pull,push` succeeded, and then
# nine seconds into `pushing layers`:
#
#   ERROR: failed to push ghcr.io/tadasant/strad-bundle:latest: unexpected
#   status from HEAD request to https://ghcr.io/v2/tadasant/strad-bundle/blobs/
#   sha256:0e5f8475…: 403 Forbidden
#
# The same commit, re-run unchanged, pushed fine. `docker/build-push-action` has
# no retry of its own and buildkit does not retry a 403, so a single refused
# blob reddens a release that has nothing wrong with it — and the recovery is a
# human noticing the alert and clicking re-run.
#
# So: run the same build up to three times, and let the third decide the job.
# Every attempt is the identical `docker/build-push-action` call.
#
# WHAT THIS COSTS. The retry cannot tell a refused blob from a broken
# `Dockerfile` — `docker/build-push-action` reports both as a failed step and
# nothing else — so what a retry costs depends on which one it got:
#
#   - The push failed. Every layer is in the runner's buildkit cache, so the
#     retry re-pushes rather than rebuilds and costs seconds.
#   - The BUILD failed. buildkit does not cache a failed layer, so that layer
#     and everything after it run again on every attempt. A `Dockerfile` that is
#     genuinely broken is therefore built three times, and for the bundle —
#     twenty dependency trees — that is minutes, not seconds, before it is red.
#
# See HACKS.md #51: this also hides a persistent ghcr permission change behind
# three identical 403s, so read the attempt warnings before believing "flake".
#
# A build-only run — `push: false`, or ANY run triggered by a pull request — has
# no registry to refuse it, so there is no flake to absorb and the retry would
# only rebuild a broken `Dockerfile` twice more. The step after the first attempt
# ends the run instead.
#
# WHY THE PULL-REQUEST CASE IS DECIDED HERE, ONCE. Until this existed, nothing on
# the PR path loaded this action at all: every call site sat in a release
# workflow or in `deploy-staging.yml`, and a pull request reaches neither. So the
# first execution of a change to this file was also its first production run, and
# on 2026-08-11 that cost eight simultaneously red release workflows and three
# follow-up merges to settle (HACKS.md #53, #73). `ci.yml` builds both of its
# images through this action, on every pull request. That only works if a
# pull-request run cannot push, and the way to guarantee it is one derivation in
# one file rather than a condition repeated across ten call sites: the mode step
# below folds the event name in, so a `push: true` call site reached from a pull
# request builds and publishes nothing. It is not a condition a call site can
# forget.
#
# It is not the ONLY thing standing between a pull request and ghcr, and must not
# become it: no workflow reachable from either PR event logs in to a registry or
# asks for `packages: write`, which is what
# `test/workflow-pr-build-coverage.test.ts` holds still. This is the second lock,
# on the door the credential is not behind.
#
# The inputs below are the ones the call sites use, and a `with:` key that is not
# among them is dropped with a runner warning rather than an error. Adding a
# `docker/build-push-action` input to a call site means declaring it here first.
#
# NO FIELD IN THIS FILE MAY CONTAIN THE EXPRESSION DELIMITER AS PROSE. The runner
# template-parses the whole manifest when it LOADS it, `description:` included.
# Outside `runs:`, the only field with a `steps` context is `outputs.*.value` —
# that one is deferred until the steps have run, which is why `digest` below
# works. Everywhere else an expression is evaluated against the scope that exists
# BEFORE any step runs, so an example written into a description is evaluated,
# fails as `Unrecognized named-value: 'steps'`, and
# takes the entire action down with it. The job gets as far as checkout, login
# and setup-buildx, then the step whose `uses:` is this action fails instantly —
# in every workflow that calls it, before any build runs.
# It reddened all eight release workflows on 2026-08-11 (HACKS.md #53). There is
# no backslash escape either. Name an expression in prose, as the fields below do.

inputs:
  builder:
    description: >-
      The buildx builder to run on: pass this job's own
      `docker/setup-buildx-action` output — steps.<id>.outputs.name — as an
      expression. Not optional in practice: an empty value falls back to the
      box-wide `~/.docker/buildx/current`, which a concurrent job on this
      self-hosted runner rewrites and then deletes out from under an in-flight
      build (HACKS.md #53). The guard step below refuses to build without it.
    required: true
  context:
    description: Build context, as docker/build-push-action takes it.
    required: false
    default: "."
  file:
    description: Dockerfile path, relative to the workspace. Defaults to `<context>/Dockerfile`.
    required: false
    default: ""
  tags:
    description: Newline-separated list of tags to push.
    required: true
  build-args:
    description: Newline-separated `KEY=value` build arguments.
    required: false
    default: ""
  cache-from:
    description: buildx `--cache-from`. Empty reads no cache.
    required: false
    default: ""
  cache-to:
    description: buildx `--cache-to`. Empty writes no cache — which is how a branch build avoids poisoning the release cache.
    required: false
    default: ""
  push:
    description: >-
      Whether this call INTENDS to push. `true` or `false`, spelled exactly;
      anything else is an error rather than a falsy value, because a typo that
      read as `false` would be a release that silently published nothing. It is
      an intent, not the last word — a run triggered by a pull request never
      pushes whatever this says. See the mode step below.
    required: false
    default: "true"
  load:
    description: >-
      Load the built image into the local docker daemon, so a later step can
      `docker run` it. Off for a release, which has no use for it and pays the
      export.
    required: false
    default: "false"
  labels:
    description: >-
      Newline-separated `KEY=value` image labels. `ci.yml` labels what it builds
      so its sweep step can find what a killed job left behind.
    required: false
    default: ""

outputs:
  digest:
    description: The digest of the pushed image, from whichever attempt pushed it.
    # Last attempt that ran wins: a failed attempt leaves this empty, and a
    # skipped one leaves it empty too, so the first non-empty value walking
    # backwards is the attempt that succeeded.
    value: ${{ steps.attempt-3.outputs.digest || steps.attempt-2.outputs.digest || steps.attempt-1.outputs.digest }}

runs:
  using: composite
  steps:
    # `required: true` on a composite action's input is documentation — the
    # runner does not enforce it, and an omitted `builder:` would interpolate to
    # the empty string, which `docker/build-push-action` reads as "no
    # `--builder`" and silently resolves against the shared pointer. That is the
    # exact bug this input exists to close, so refuse rather than build.
    #
    # The message below names the expression it wants WITHOUT writing it, for the
    # reason given at `inputs:` above — the rule is file-wide, not specific to a
    # `run:` block. actionlint validates a local action's INTERFACE and reads
    # neither its `run:` blocks nor its prose, so nothing in a PR build would say
    # so; see #51 for what that costs. `test/workflow-buildx-builder.test.ts` is
    # what actually enforces it.
    - name: Refuse to build on a builder this job does not own
      shell: bash
      env:
        BUILDER: ${{ inputs.builder }}
      run: |
        if [ -z "${BUILDER:-}" ]; then
          echo "::error::build-push was called with no 'builder:'. Pass this job's own docker/setup-buildx-action output — steps.<id>.outputs.name — as an expression. See HACKS.md #53."
          exit 1
        fi
        echo "building on ${BUILDER}"

    # THE one place that decides whether anything leaves this runner.
    #
    # A pull request may build; it may not publish. Every call site's `push:`
    # is an intent, and this step is where the intent meets the event — so a
    # release workflow given a `pull_request` trigger, or a new call site that
    # forgets to say `push: false`, cannot publish an image from an unreviewed
    # branch by omission. There is no second copy of this rule to keep in sync.
    #
    # An unrecognised intent is an ERROR, not a falsy value: `push: no` read as
    # "do not push" would be a release that goes green having published nothing,
    # and the next deploy would find no image. Fail on the spelling instead.
    #
    # `test/workflow-pr-build-coverage.test.ts` RUNS this script over each case
    # rather than reading it, for the reason the builder guard's test gives: an
    # inverted comparison still contains every string a grep would look for.
    - name: Decide whether this run publishes
      id: mode
      shell: bash
      env:
        WANT_PUSH: ${{ inputs.push }}
        LOAD: ${{ inputs.load }}
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        case "${WANT_PUSH:-}" in
          true | false) ;;
          *) echo "::error::build-push got push='${WANT_PUSH:-}'; spell it exactly true or false."; exit 1 ;;
        esac
        case "${LOAD:-}" in
          true | false) ;;
          *) echo "::error::build-push got load='${LOAD:-}'; spell it exactly true or false."; exit 1 ;;
        esac
        push="$WANT_PUSH"
        # Both spellings. `pull_request_target` is the sharper one: it runs
        # against the BASE ref with the full write token, so a workflow that
        # grew one would be the single event where an unreviewed branch could
        # reach ghcr with a real credential.
        case "${EVENT:-}" in
          pull_request | pull_request_target)
            push=false
            if [ "$WANT_PUSH" = "true" ]; then
              echo "::notice::${EVENT}: building without pushing. A pull-request run never publishes an image."
            fi
            ;;
        esac
        echo "event=${EVENT:-<none>} push=${push} load=${LOAD}"
        echo "push=${push}" >> "$GITHUB_OUTPUT"
        echo "load=${LOAD}" >> "$GITHUB_OUTPUT"

    - name: Build and push
      id: attempt-1
      uses: docker/build-push-action@v6
      continue-on-error: true
      with:
        builder: ${{ inputs.builder }}
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: ${{ steps.mode.outputs.push }}
        load: ${{ steps.mode.outputs.load }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        build-args: ${{ inputs.build-args }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}

    # The retry absorbs a refused blob, and a build-only run has no blob to
    # refuse: nothing left this runner, so a failure here is the `Dockerfile`, the
    # build context or the wiring, every time. Rebuilding it twice more would only
    # spend a pull request's wall clock reaching the same red — and a bundle build
    # is twenty dependency trees.
    #
    # Failing here is what stops that: a composite action's steps stop at the
    # first one that exits non-zero, so the two attempts below are unreachable on
    # a build-only run rather than gated. Delete this step and they become
    # reachable again — slower, still red, never green.
    - name: A build-only run has no refused push to retry
      if: steps.attempt-1.outcome == 'failure' && steps.mode.outputs.push != 'true'
      shell: bash
      run: |
        echo "::error::the build failed and this run publishes nothing, so there is no refused blob to retry. Read the build log above: this is the build, not the registry."
        exit 1

    - name: Wait, then try again
      if: steps.attempt-1.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::build/push attempt 1 failed. Retrying in 15s — see HACKS.md #51."
        sleep 15

    - name: Build and push (attempt 2)
      id: attempt-2
      if: steps.attempt-1.outcome == 'failure'
      uses: docker/build-push-action@v6
      continue-on-error: true
      with:
        builder: ${{ inputs.builder }}
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: ${{ steps.mode.outputs.push }}
        load: ${{ steps.mode.outputs.load }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        build-args: ${{ inputs.build-args }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}

    - name: Wait, then try once more
      if: steps.attempt-2.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::build/push attempt 2 failed. Retrying in 45s — the next attempt decides the job."
        sleep 45

    # No `continue-on-error` here on purpose: this attempt is the one that makes
    # the run red. If a third identical build cannot push, it is not a flake.
    - name: Build and push (attempt 3)
      id: attempt-3
      if: steps.attempt-2.outcome == 'failure'
      uses: docker/build-push-action@v6
      with:
        builder: ${{ inputs.builder }}
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: ${{ steps.mode.outputs.push }}
        load: ${{ steps.mode.outputs.load }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        build-args: ${{ inputs.build-args }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
