name: Deploy staging

# Render the App Platform spec from infra/strad.staging.yaml, inject secrets
# pulled from GCP Secret Manager, and push it to the strad-staging app.
#
# Secrets flow: GCP Secret Manager (strad-staging-*) -> this job's env -> SECRET
# env vars on the app spec -> encrypted at rest by DigitalOcean. The running
# container holds NO GCP credential; by the time it boots, its secrets are just
# environment variables.

#
# Deploying a BRANCH: dispatch this workflow on the branch with `build: true`.
# It builds the core AND bundle images from that ref, pushes them under
# branch-scoped tags ONLY, and deploys the branch's own config against them.
# To put staging back on `main`, dispatch this workflow on `main` with
# `build: false` (the default) — it renders main's config against the
# `sha-<commit>` image built for that same commit. There is nothing to clean up.

on:
  # `build` is deliberately NOT declared here. Leaving it off the workflow_call
  # surface is what makes "the release path cannot build a branch" structural
  # rather than a convention: release-image.yml has no input to pass. Do not
  # "tidy" the two input blocks into agreement.
  workflow_call:
    inputs:
      version:
        description: >-
          Image tag to deploy (e.g. 0.1.3). Omit to use the sha-<commit> image
          built for this ref. A mutable tag (latest) is refused.
        type: string
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Image tag to deploy (e.g. 0.1.3). Omit to use the sha-<commit> image
          built for this ref. A mutable tag (latest) is refused.
        type: string
        required: false
      build:
        description: >-
          Build core+bundle images from THIS ref and deploy them under
          branch-scoped tags. Never moves :latest, never notifies prod.
        type: boolean
        required: false
        default: false
      seed:
        description: >-
          Copy this deployment's boot keys from the deploy environment into
          /strad/staging/gateway/static/ before rendering. The one-time
          migration step for the provider flip; off on every ordinary deploy.
        type: boolean
        required: false
        default: false
      seed_rotate:
        description: >-
          With seed, overwrite names the store already holds instead of
          skipping them.
        type: boolean
        required: false
        default: false
      seed_set:
        description: >-
          With seed, an extra NAME=VALUE the environment does not carry.
          NON-SECRET canaries only — it is echoed in this run's log.
        type: string
        required: false
      seed_delete:
        description: >-
          With seed, a name to REMOVE from the gateway namespace. Comma-separated.
        type: string
        required: false
      # `seed_names` / `seed_except`, NOT `seed_only` / `seed_exclude`, and the
      # first half of that is forced: `seed_only` already exists below and means
      # "seed and stop". Two inputs a letter apart meaning "which names" and
      # "which steps" is a dispatch form nobody reads correctly under pressure,
      # and this one is dispatched during a cutover. The SCRIPT flags stay
      # `--only` / `--exclude`; only the dispatch labels differ, and the step
      # below is where the two vocabularies meet.
      seed_names:
        description: >-
          With seed, seed ONLY these names (comma-separated) instead of every
          name the config derives. A name the config does not seed is an error.
        type: string
        required: false
      seed_except:
        description: >-
          With seed, seed every derived name EXCEPT these (comma-separated).
          Mutually exclusive with seed_names.
        type: string
        required: false
      seed_only:
        description: >-
          Seed and stop, without rendering or deploying. Use when the store must
          change under a RUNNING gateway — a redeploy would restart the process
          and destroy the thing being observed.
        type: boolean
        required: false
        default: false

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Build the dispatched ref into branch-scoped images.
  #
  # The safety properties of a branch deploy are STRUCTURAL, not a matter of the
  # caller passing the right input:
  #   - The tag is `branch-<slug>-<sha>`, so it CANNOT collide with `latest`,
  #     and the step below asserts that before anything is pushed.
  #   - This workflow contains no repository_dispatch step at all, so a branch
  #     build cannot notify tadasant-internal. Only release-image.yml can, and
  #     that step is gated to `main` (see that file).
  # `workflow_call` cannot reach this job: `inputs.build` is undefined for the
  # release path, so an automatic release never builds anything here.
  build:
    if: inputs.build
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      core_image: ${{ steps.tags.outputs.core_image }}
      bundle_image: ${{ steps.tags.outputs.bundle_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute branch-scoped tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A ref name may contain "/", uppercase, and other characters a Docker
          # tag may not. Squash to [a-z0-9._-] and truncate: a tag is capped at
          # 128 chars, and the sha below is what makes it unique anyway.
          SLUG=$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]/-/g' | cut -c1-60)
          SHORT=$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)
          TAG="branch-${SLUG}-${SHORT}"
          CORE="ghcr.io/tadasant/strad:${TAG}"
          BUNDLE="ghcr.io/tadasant/strad-bundle:${TAG}"
          # Assert the thing that actually gets pushed, not the ingredients.
          # The `branch-` prefix is what makes a collision with `latest`
          # impossible; this refuses to push if that ever stops being true.
          for ref in "$CORE" "$BUNDLE"; do
            case "$ref" in
              *:latest) echo "::error::refusing to push '$ref'"; exit 1 ;;
            esac
          done
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "core_image=${CORE}" >> "$GITHUB_OUTPUT"
          echo "bundle_image=${BUNDLE}" >> "$GITHUB_OUTPUT"
          echo "Branch images: strad:${TAG} and strad-bundle:${TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the core image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.core_image }}
          cache-from: type=gha
          # Read the release path's cache, never write it: a branch build must
          # not be able to poison what `main` builds from.
          cache-to: ""

      - name: Build and push the bundle image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: servers/bundle/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.bundle_image }}
          cache-from: type=gha,scope=bundle
          cache-to: ""

  deploy:
    needs: build
    # `needs` on a skipped job would skip this one too, so opt back in: deploy
    # runs whether or not we built, and only aborts if a requested build failed.
    # `!cancelled()` rather than `always()` — `always()` would keep replacing the
    # staging spec after a human hit Cancel, which is the one moment they most
    # want it to stop.
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    runs-on: self-hosted
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          # The image tag is resolved by walking back through history to the
          # newest commit that published one, so a shallow checkout would have
          # nothing to walk. 50 is far more than the walk ever needs — it only
          # skips docs-only commits — and still cheap.
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Preflight — are we configured to deploy?
        # Zimmer's "safe no-op without the secret" idiom. When this runs as part
        # of an automatic release (workflow_call) and the deploy prerequisites
        # aren't in place yet — no DO token, or GCP Secret Manager not seeded via
        # secrets-sync.yml — we SKIP the deploy and stay green rather than fail
        # the release. A manual workflow_dispatch, by contrast, fails loudly:
        # you asked for a deploy, so a missing prerequisite is an error.
        id: pre
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          GCP_KEY: ${{ secrets.GCP_SA_KEY }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "$DO_TOKEN" ] && missing="$missing DIGITALOCEAN_ACCESS_TOKEN"
          [ -z "$GCP_KEY" ]  && missing="$missing GCP_SA_KEY"
          if [ -n "$missing" ]; then
            if [ "$MANUAL" = "true" ]; then
              echo "::error::missing required secret(s):$missing"
              exit 1
            fi
            echo "::warning::skipping staging deploy — missing:$missing"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to GCP
        if: steps.pre.outputs.go == 'true'
        # Prefer keyless Workload Identity Federation; fall back to the SA key.
        # Whichever is present, the runtime container never sees either — this
        # job reads the secrets and bakes their VALUES into the spec.
        id: gcpauth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        # The self-hosted runner has no gcloud on PATH; install it. Without this
        # the secret read silently loads zero secrets (the gcloud call is in a
        # process substitution, so its failure doesn't surface) and the deploy
        # then dies at render time with a confusing "STRAD_TOKENS required".
        if: steps.pre.outputs.go == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Read staging secrets from GCP Secret Manager
        if: steps.pre.outputs.go == 'true'
        id: secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          # List first, on its own line, so a gcloud failure fails the step
          # instead of hiding inside a process substitution.
          LIST=$(gcloud secrets list --project "$GCP_PROJECT_ID" \
            --filter="name:strad-staging-" --format="value(name)")
          mapfile -t NAMES < <(printf '%s\n' "$LIST" | grep -v '^$' || true)
          if [ "${#NAMES[@]}" -eq 0 ]; then
            # Not yet seeded via secrets-sync.yml. On a manual deploy that's an
            # error; on an automatic release, skip the rest and stay green.
            if [ "$MANUAL" = "true" ]; then
              echo "::error::no strad-staging-* secrets found. Run secrets-sync.yml first."
              exit 1
            fi
            echo "::warning::no strad-staging-* secrets found; skipping deploy. Run secrets-sync.yml."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for full in "${NAMES[@]}"; do
            key="${full#strad-staging-}"
            val=$(gcloud secrets versions access latest --project "$GCP_PROJECT_ID" --secret "$full")
            # Register EVERY LINE, not just the whole value. The log scrubber
            # matches within a single line, so a multi-line secret (a PEM private
            # key) gets only its first line masked and prints its body — the part
            # that IS the key — in clear. That is a real leak in a public repo.
            # Short lines are skipped: masking "{" would redact half the log.
            while IFS= read -r line; do
              [ "${#line}" -ge 8 ] && echo "::add-mask::$line"
            done <<< "$val"
            echo "::add-mask::$val"
            printf '%s<<STRAD_EOF\n%s\nSTRAD_EOF\n' "$key" "$val" >> "$GITHUB_ENV"
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Loaded ${#NAMES[@]} secret(s) from Secret Manager."

      - name: Resolve an immutable core image tag
        # Only when nothing else already names the image: a branch build has its
        # own tag, and an explicit `version` is a deliberate pin (a rollback).
        #
        # This step exists because the default used to be `:latest`, and a
        # mutable tag is a deploy whose contents the spec does not determine.
        # Dispatching this workflow on main at 96015c6 shipped `:latest` and
        # booted code from before PR #26 — it rejected the current
        # infra/strad.staging.yaml with a rule that commit had deleted three
        # weeks earlier, and took staging down. `sha-<commit>` names one commit,
        # so the image and the config it is handed cannot drift apart.
        if: ${{ !inputs.seed_only && steps.pre.outputs.go == 'true' && steps.secrets.outputs.ready == 'true' && !inputs.build && !inputs.version }}
        id: coretag
        env:
          # A durable token, because this reads a PRIVATE package. The job's
          # GITHUB_TOKEN can write this repo's packages but the deploy already
          # depends on GHCR_PULL_TOKEN for the pull, so use the same one.
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # --first-parent: on main that is the merge history, so the walk skips
          # a PR's internal commits, none of which ever published an image.
          # The script walks back only past DOCS-ONLY commits; a code commit
          # with no image is a hard stop, because deploying the previous
          # commit's image against this commit's config is the very skew this
          # step exists to prevent.
          git log --first-parent --format=%H -n 50 \
            | node --experimental-transform-types scripts/resolve-image-tag.ts \
                --repository "$REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Seed the gateway namespace from the deploy environment
        # THE MIGRATION STEP, and it is opt-in for a reason. Under the `env`
        # provider these values are baked into the app spec on every deploy;
        # under the store provider the gateway reads them at runtime and the spec
        # carries only the resolver key. Something has to move them across once,
        # and CI is the only place that holds them — the console is SSO-gated and
        # per-value, and the `secrets` MCP server is fenced out of this namespace
        # on purpose.
        #
        # OFF unless dispatched with `seed: true`. Seeding on every deploy would
        # make the store a mirror of the deploy environment rather than the source
        # of truth replacing it, which is the inversion the whole flip exists to
        # undo. It also skips names the store already holds unless
        # `seed_rotate: true`, so a re-run cannot quietly revert a rotation
        # somebody made in the console.
        #
        # It reads back everything it writes through `:render` — the same path
        # the gateway uses — and compares by digest. Names and counts only; no
        # value is printed.
        # `seed_only` implies `seed`. Gating this on `inputs.seed` alone made a
        # `seed_only: true` dispatch with `seed` left false run NOTHING and
        # report green — every other step is gated on `!seed_only`, so the job
        # skipped its way to success. An input named "seed and stop" must not be
        # able to mean "stop".
        if: ${{ (inputs.seed || inputs.seed_only) && steps.pre.outputs.go == 'true' && steps.secrets.outputs.ready == 'true' }}
        env:
          # The ADMIN key, not the resolver's: the resolver cannot write, which
          # is exactly why the gateway is allowed to hold it.
          STRAD_STORE_ADMIN_KEY_JSON: ${{ env.SECRETS_ADMIN_KEY_JSON }}
          SEED_ROTATE: ${{ inputs.seed_rotate }}
          SEED_SET: ${{ inputs.seed_set }}
          SEED_DELETE: ${{ inputs.seed_delete }}
          SEED_NAMES: ${{ inputs.seed_names }}
          SEED_EXCEPT: ${{ inputs.seed_except }}
        run: |
          set -euo pipefail
          ARGS=(--config infra/strad.staging.yaml --commit)
          [ "$SEED_ROTATE" = "true" ] && ARGS+=(--rotate)
          [ -n "$SEED_SET" ] && ARGS+=(--set "$SEED_SET")
          if [ -n "$SEED_DELETE" ]; then
            IFS=',' read -ra NAMES <<< "$SEED_DELETE"
            for n in "${NAMES[@]}"; do ARGS+=(--delete "$n"); done
          fi
          # The scope. Both are passed through as REPEATED flags rather than one
          # comma-joined value, because the script takes names one per flag and a
          # comma inside a single --only would become part of a name and then
          # fail as an unknown one. The script refuses the two together, so this
          # does not have to.
          #
          # Whitespace is stripped FIRST, and newlines become commas. A dispatch
          # text box invites `A, B` and accepts a pasted multi-line list, and
          # `read` stops at the first newline — so without this, `seed_except`
          # given either shape would silently seed a name the operator asked to
          # hold back. `resolveSeedScope` trims too; this is the same rule at the
          # boundary that produces the mangling, so neither layer is load-bearing
          # alone.
          scope_flags() { # $1 = flag, $2 = raw input
            local cleaned
            cleaned="$(printf '%s' "$2" | tr '\n' ',' | tr -d '[:space:]')"
            [ -z "$cleaned" ] && return 0
            IFS=',' read -ra NAMES <<< "$cleaned"
            for n in "${NAMES[@]}"; do
              [ -n "$n" ] && ARGS+=("$1" "$n")
            done
            return 0
          }
          scope_flags --only "$SEED_NAMES"
          scope_flags --exclude "$SEED_EXCEPT"
          node --experimental-transform-types scripts/seed-store.ts "${ARGS[@]}"

      - name: Report what the parameter store holds
        # The roster: every name this deployment would read from
        # `/strad/staging/gateway/static/`, which of them are seeded, and — with
        # --resolve — which of the seeded ones the resolver credential can
        # actually render. That last part is the one nothing else answers:
        # presence is not resolvability (`:render` needs
        # parametermanager.parameterVersions.render, which parameterViewer does
        # not carry), and a namespace can be complete and still resolve to
        # nothing.
        #
        # REPORT MODE, and NON-FATAL, and that is now a deliberate choice rather
        # than a stage of the migration. Staging is store-backed, so `--mode
        # require` is the defensible end state — but `require` counts the 22
        # supplementary `env:` names too, and those are still resolved from the
        # deploy environment on purpose (see scripts/seed-store.ts). Requiring
        # them today would fail every deploy over a decision nobody has taken.
        # `render-spec`'s own preflight already fails closed on the names that
        # MUST be in the store, so nothing load-bearing rests on this step's
        # exit code; it exists to make the roster visible on every deploy rather
        # than only when someone remembers to run it — the migration's blind spot
        # was never the check, it was not having looked. Flip to `--mode require`
        # and drop continue-on-error when the supplementary names move too.
        #
        # It prints names, counts and states. No value, in any mode.
        if: steps.pre.outputs.go == 'true' && steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          # `|| rc=$?` rather than a bare call followed by `rc=$?`. A `run:` step
          # is `bash -e`, and `set -uo pipefail` does not clear `-e`, so a bare
          # non-zero call kills the shell before the next line — every branch
          # below would be unreachable and the step would just fail. A command on
          # the left of `||` is exempt from `-e`, which is what makes `rc`
          # observable at all.
          rc=0
          node --experimental-transform-types scripts/check-store.ts \
            --config infra/strad.staging.yaml --mode report --resolve || rc=$?
          # Exit 3 is "I could not consult the store", and `--mode report` does
          # not soften it — by design, since "the namespace is incomplete" and "I
          # could not find out" call for opposite responses. Staging is
          # store-backed, so exit 3 means the resolver credential this deployment
          # depends on has stopped working: a finding, not a stage of migration.
          if [ "$rc" -eq 3 ]; then
            echo "::error::the store roster could not be read at all. Staging resolves its \${NAME} refs from the store, so this is the resolver credential failing, not an unseeded namespace; see docs/operate/secrets.md."
          fi
          exit "$rc"

      - name: Render the App Platform spec
        # Emits /tmp/spec.json with secret VALUES inlined as SECRET env vars.
        # It is written to a file, never echoed — a rendered spec is not log-safe.
        if: ${{ !inputs.seed_only && steps.pre.outputs.go == 'true' && steps.secrets.outputs.ready == 'true' }}
        env:
          # A branch build wins over `version`: if we just built this ref, that
          # is unambiguously the code the dispatcher asked to see on staging.
          # Then an explicit `version` (the release path, and a rollback pin).
          # Then the `sha-<commit>` resolved above. There is deliberately no
          # `latest` fallback left: render-spec refuses a mutable core tag, so a
          # gap here fails the deploy instead of shipping an unknown image.
          CORE_IMAGE: ${{ needs.build.outputs.core_image || (inputs.version && format('ghcr.io/tadasant/strad:{0}', inputs.version)) || steps.coretag.outputs.image }}
          # Empty on the release path, which leaves the config's own
          # `image:` lines (…/strad-bundle:latest) untouched.
          BUNDLE_IMAGE: ${{ needs.build.outputs.bundle_image || '' }}
          BUILT: ${{ inputs.build && 'true' || 'false' }}
          # Staging runs the console dev bypass until Google OAuth creds land.
          # The container runs NODE_ENV=production, so the bypass also demands
          # ALLOW_DEV_AUTH_IN_PRODUCTION — a deliberate second key that a copy of
          # this spec to real prod would not silently carry the *intent* of.
          # ADMIN_BOOTSTRAP_TOKEN is still required to actually use it. HACKS.md.
          ALLOW_DEV_AUTH: "true"
          ALLOW_DEV_AUTH_IN_PRODUCTION: "true"
        run: |
          set -euo pipefail
          # --domain is NOT optional in practice. An App Platform update is a
          # full replace, so a spec without `domains` DETACHES the custom domain
          # and its certificate. render-spec now also defaults this from
          # gateway.publicUrl, but pass it explicitly so the deploy says out loud
          # which hostname it is claiming.
          # A branch deploy that lost its images would fall back to `:latest`
          # for BOTH components and look like a success while running main's
          # code end to end. Refuse instead.
          if [ "$BUILT" = "true" ]; then
            case "${CORE_IMAGE}|${BUNDLE_IMAGE}" in
              *:branch-*\|*:branch-*) ;;
              *) echo "::error::build was requested but produced no branch images (core='${CORE_IMAGE}' bundle='${BUNDLE_IMAGE}')"; exit 1 ;;
            esac
          fi
          BUNDLE_ARG=()
          if [ -n "$BUNDLE_IMAGE" ]; then
            BUNDLE_ARG=(--bundle-image "$BUNDLE_IMAGE")
          fi
          echo "Deploying core=${CORE_IMAGE} bundle=${BUNDLE_IMAGE:-<from config>}"
          node --experimental-transform-types scripts/render-spec.ts \
            --config infra/strad.staging.yaml \
            --image "$CORE_IMAGE" \
            ${BUNDLE_ARG[@]+"${BUNDLE_ARG[@]}"} \
            --app strad-staging \
            --region nyc \
            --domain staging.strad.tadasant.com > /tmp/spec.json
          echo "Rendered spec ($(wc -c < /tmp/spec.json) bytes)."

      - name: Attach the GHCR pull credential
        # App Platform pulls the (private) ghcr image on every restart/scale, so
        # it needs a DURABLE token, not the job's ephemeral GITHUB_TOKEN. This
        # injects registry_credentials into every component's image block.
        #
        # If App Platform later 403s pulling the image, the PAT is FINE-GRAINED
        # (package-scoped) and strad's package is not in its scope — a one-line
        # fix on the token. See HACKS.md.
        if: ${{ !inputs.seed_only && steps.pre.outputs.go == 'true' && steps.secrets.outputs.ready == 'true' }}
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "::error::GHCR_PULL_TOKEN is not set; App Platform cannot pull a private ghcr image."
            exit 1
          fi
          node scripts/attach-registry-creds.mjs /tmp/spec.json "tadasant:${GHCR_PULL_TOKEN}"

      - name: Install doctl
        # Binary only. Given a token this action runs `doctl auth init`, which
        # writes it in cleartext to $HOME/.config/doctl/config.yaml. The action
        # ships no `post:` step, so nothing scopes that file to the job — and on
        # `self-hosted` every runner process on the box shares /home/runner.
        # `no_auth` skips the write; each doctl step below supplies the token
        # through its own env.
        if: ${{ !inputs.seed_only && steps.pre.outputs.go == 'true' && steps.secrets.outputs.ready == 'true' }}
        uses: digitalocean/action-doctl@v2
        with:
          no_auth: "true"

      - name: Deploy (create or update strad-staging)
        if: ${{ !inputs.seed_only && steps.pre.outputs.go == 'true' && steps.secrets.outputs.ready == 'true' }}
        env:
          # doctl reads both of these natively — see the smoke-test step below.
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DIGITALOCEAN_CONTEXT: default
        run: |
          set -euo pipefail
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | awk '$2=="strad-staging"{print $1}')
          if [ -z "$APP_ID" ]; then
            echo "Creating strad-staging..."
            doctl apps create --spec /tmp/spec.json --wait --format ID,DefaultIngress
          else
            echo "Updating strad-staging ($APP_ID)..."
            doctl apps update "$APP_ID" --spec /tmp/spec.json --wait --format ID,DefaultIngress
          fi

      - name: Smoke-test the live endpoint
        if: ${{ !inputs.seed_only && steps.pre.outputs.go == 'true' && steps.secrets.outputs.ready == 'true' }}
        env:
          # Every doctl step carries its own token rather than reading the
          # config file `doctl auth init` would have left in a shared $HOME.
          # The prod workflow hit that: a deploy ran doctl fine, then this step
          # failed 45s later with "access token is required".
          #
          # `DIGITALOCEAN_CONTEXT` is the other half. doctl only reads the token
          # from the environment on the `default` context; on any other it takes
          # the token from that context's entry in the config file and ignores
          # the environment entirely. A concurrent `doctl auth init --context`
          # writes a top-level `context:` key into the shared file, which would
          # silently send another job's token. Pinning the context keeps the
          # token above authoritative.
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DIGITALOCEAN_CONTEXT: default
        run: |
          set -euo pipefail
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | awk '$2=="strad-staging"{print $1}')
          HOST=$(doctl apps get "$APP_ID" --format DefaultIngress --no-header)
          echo "Live at: $HOST"
          for i in $(seq 1 30); do
            if curl -fsS "$HOST/healthz" >/dev/null 2>&1; then break; fi
            sleep 4
          done
          curl -fsS "$HOST/healthz"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$HOST/mcp")
          [ "$code" = "401" ] || { echo "::error::/mcp not gated (got $code)"; exit 1; }

          # Does every component we DEPLOY actually serve something?
          #
          # This is the check that was missing. `/healthz` used to answer 200
          # with all 27 slugs listed while three of them served no tools at all:
          # the bundle was running an image that predated the `/secrets` mount,
          # core POSTed to `/secrets`, Express answered 404, and the gateway
          # turned that into `200 {"tools":[]}`. A green deploy, a healthy app,
          # and a secrets server that could not place a secret — discoverable
          # only by holding a token and polling `tools/list`.
          #
          # WHAT IT GATES ON, and what it deliberately does not. `toolSurfaces`
          # is core's own observation (gateway/reachability.ts). This asserts on
          # `unreachable` for the kinds WE ship — a `supplementary-image` or a
          # bundle-hosted `builtin` that cannot be listed is this deploy's fault.
          # It does NOT gate on:
          #   - `remote-http`. deepwiki lives on the public internet and having a
          #     bad afternoon is not a reason to fail strad's deploy. Annotated.
          #   - `empty`. A server that ANSWERS with no tools is a credential
          #     story, and the capability report below is deliberately non-gating
          #     for exactly that reason. Annotated too, never fatal.
          #
          # It converges after a deploy — core comes up before the bundles do —
          # so poll rather than read once, and treat a failed poll as "not yet"
          # rather than letting `set -e` kill the step without a message.
          bad='pending'
          for _ in $(seq 1 30); do
            if body=$(curl -fsS "$HOST/healthz" 2>/dev/null); then
              if printf '%s' "$body" | jq -e '.toolSurfaces' >/dev/null 2>&1; then
                bad=$(printf '%s' "$body" | jq -c '[.toolSurfaces.servers[]
                  | select(.kind != "remote-http" and .state == "unreachable")
                  | .slug]')
                [ "$bad" = "[]" ] && break
              else
                bad='no-toolsurfaces'
              fi
            fi
            sleep 6
          done

          if [ "$bad" = 'no-toolsurfaces' ] || [ "$bad" = 'pending' ]; then
            echo "::warning::/healthz never reported toolSurfaces, so this deploy is"
            echo "unverified: the image may predate the tool-surface monitor, or the"
            echo "host was unreachable for the whole poll. Not failing on it."
          elif [ "$bad" != "[]" ]; then
            echo "::error::these slugs are mounted but serve NO tools: $bad"
            echo "A slug serving nothing answers tools/list with [] and looks like a"
            echo "server that simply has no tools. Usual cause: the component is"
            echo "running an image that does not mount the path the slug routes to"
            echo "— re-run release-bundle-image.yml and redeploy."
            printf '%s' "$body" | jq '.toolSurfaces' || true
            exit 1
          else
            others=$(printf '%s' "$body" | jq -c '[.toolSurfaces.servers[]
              | select(.state != "ok") | {slug, state, kind}]')
            [ "$others" = "[]" ] || echo "::warning::not gating on these: $others"
            echo "OK: staging healthy, /mcp gated, every deployed slug serving tools."
          fi

      - name: Report what the secrets credentials can do
        # The secrets surfaces are PROBE-DERIVED: the MCP server lists
        # get_secret_value and the write tools only if its credential holds the
        # permissions, and the console offers reveal on the same basis. Good
        # property, one bad consequence — a grant that did not land looks exactly
        # like a deliberate narrowing. Nothing errors; the surface is just
        # smaller. So the deploy asks, and prints the answer.
        #
        # NON-FATAL by design — `continue-on-error`, not a swallowed exit code. A
        # narrow credential is a legitimate posture (it is prod's), so this
        # reports and never gates. But it still EXITS non-zero when a probe does
        # not complete, so the step goes yellow and says which key: swallowing
        # the status would also hide a genuinely broken script, and it would let
        # the second probe's success mask the first probe's failure.
        #
        # It runs the same probe the containers run, against the same keys, and
        # prints booleans only — the keys are read from the env and never echoed,
        # and testIamPermissions returns no secret material.
        if: ${{ !inputs.seed_only && steps.pre.outputs.go == 'true' && steps.secrets.outputs.ready == 'true' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          rc=0
          probe() {
            node --experimental-transform-types scripts/probe-capabilities.ts \
              --project "$1" --key-env "$2" --label "$3" || {
              echo "::warning::capability probe for $3 did not complete (see above)"
              rc=1
            }
          }
          # The viewer key is the /mcp tool surface; the admin key is the
          # console's reveal. Both, because they answer different questions.
          probe strad-secrets-staging SECRETS_VIEWER_KEY_JSON "staging MCP server (viewer key)"
          probe strad-secrets-staging SECRETS_ADMIN_KEY_JSON  "staging console (admin key)"
          # The SECOND store, and this pair is the load-bearing one. The whole
          # claim of the zimmer-secrets slug is that its /mcp credential is a
          # VIEWER — no parameterVersions.render, so no reachable secret VALUE —
          # and that claim lives in IAM on a project nothing in this repo can see.
          # `readSecretValues: false` on the viewer line is what confirms it; if
          # that ever reads true, the slug is listing get_secret_value against
          # Zimmer's store.
          probe zimmer-secrets-staging ZIMMER_SECRETS_VIEWER_KEY_JSON "zimmer-secrets MCP server (viewer key)"
          probe zimmer-secrets-staging ZIMMER_SECRETS_ADMIN_KEY_JSON  "zimmer-secrets console (admin key)"
          exit "$rc"

      - name: Dump the failing container's logs
        # A failed deploy reports a `godo` progress struct and the sentence
        # "container exited with a non-zero exit code" — which component died,
        # and nothing about why. The why is in the container's own log, and
        # nobody reading the run has it. This fetches it.
        #
        # It sits LAST on purpose. `failure()` is job-scoped, so from here it
        # covers the smoke test too — a deploy that "succeeded" into a wedged
        # container is exactly the case where these logs matter most.
        #
        # Masks registered while reading Secret Manager persist for the whole
        # job, so literal secret values stay redacted. A boot error that prints a
        # DERIVED value (a parsed URL, a decoded field) matches no mask and would
        # print in clear — the reason the rendered spec is never echoed. Nothing
        # here has done that so far; if it ever does, redact at the source rather
        # than deleting this step.
        if: failure() && steps.pre.outputs.go == 'true' && steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set +e
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | awk '$2=="strad-staging"{print $1}')
          [ -z "$APP_ID" ] && { echo "no strad-staging app; nothing to dump."; exit 0; }
          # Sort on the creation timestamp rather than trusting list order:
          # doctl does not contract newest-first, and silently dumping a
          # months-old deployment is worse evidence than none.
          DEPLOY_ID=$(doctl apps list-deployments "$APP_ID" --format ID,Created --no-header \
            | sort -k2 -r | head -1 | awk '{print $1}')
          echo "app=$APP_ID deployment=${DEPLOY_ID:-<none>}"
          [ -z "$DEPLOY_ID" ] && { echo "no deployments found."; exit 0; }
          # Derived from the rendered spec, not hardcoded: the component list is
          # a property of the config, and the one most likely to have just been
          # added is the one whose logs are wanted. A hardcoded pair would dump
          # the two components that are fine and skip the new one that died.
          COMPS=$(jq -r '.services[].name' /tmp/spec.json 2>/dev/null | tr '\n' ' ')
          [ -z "$COMPS" ] && COMPS="core bundle"
          echo "components: $COMPS"
          for comp in $COMPS; do
            for kind in run deploy; do
              echo "::group::${comp} (${kind})"
              doctl apps logs "$APP_ID" "$comp" --deployment "$DEPLOY_ID" --type "$kind" --tail 60 2>&1
              echo "::endgroup::"
            done
          done
