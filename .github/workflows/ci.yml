name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      # BOOTSTRAP ONLY — remove before/after merge. This PR targets
      # feat/strad-core-platform (PR #2), so its `pull_request` CI reads the base
      # branch's ci.yml, which only fires for PRs to main. A `push` event runs
      # THIS branch's ci.yml, giving the PR's strad-core changes (appspec.ts,
      # render-spec.ts, test/appspec.test.ts, config) a real typecheck/lint/test/
      # build run before merge. (servers/** is out of the core toolchain and is
      # validated by release-goodeggs-image.yml instead.) See HACKS #9.
      - feat/good-eggs-supplementary
      # BOOTSTRAP ONLY — remove before/after merge. onepassword stacks on the
      # good-eggs branch (its supplementary infra isn't on main yet), so this PR
      # targets feat/good-eggs-supplementary and its `pull_request` CI won't fire
      # for a non-main base either. A `push` runs the core lint/test/build for the
      # PR's only core-visible change, test/onepassword.appspec.test.ts.
      # (servers/onepassword/** is validated by release-onepassword-image.yml.)
      - feat/onepassword-supplementary
      # BOOTSTRAP ONLY — remove before/after merge. Same reason as above: the
      # fetchpet + pointsyeah PR is STACKED on feat/good-eggs-supplementary (main
      # does not yet carry the good-eggs browser foundation), so a PR to that base
      # never fires `pull_request` CI. A push runs THIS branch's ci.yml over the
      # core changes (infra config, test/appspec.browser-servers.test.ts). The two
      # servers themselves are validated by their release-*-image.yml builds.
      - feat/browser-servers-fetchpet-pointsyeah
      # BOOTSTRAP ONLY — remove before/after merge. Same reason: the MCP-App PR is
      # STACKED on feat/good-eggs-supplementary (main does not yet carry good-eggs),
      # so a PR to that base never fires `pull_request` CI — GitHub reads the base
      # branch's ci.yml for the filter. A push runs THIS branch's ci.yml, which
      # also carries the new `good_eggs` job below. See HACKS #17.
      - feat/good-eggs-mcp-app-ui

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check

  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test

  # servers/** is out of the core TS program (see eslint.config.js) and its image
  # is only built on push, so a PR could otherwise break the good-eggs server
  # without CI noticing. Build it (typechecks shared + remote) and run its
  # browser-free MCP-App gating tests here. The browser download is skipped: the
  # image ships Chromium in its base layer, and these tests never launch it.
  good_eggs:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: servers/good-eggs
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Build (typecheck shared + remote)
        working-directory: servers/good-eggs
        run: npm run build
      - name: Test (MCP-App gating)
        working-directory: servers/good-eggs
        run: npm test

  verify_lockfile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Ensure package-lock.json is up to date
        run: |
          npm install --package-lock-only
          git diff --exit-code package-lock.json

  # The image is the deliverable, so a PR that cannot produce one is a failing
  # PR — not something we find out about at release time.
  build_image:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: strad:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the image and assert the auth gate
        # strad is on the open internet with no network perimeter, so "does /mcp
        # reject an anonymous caller" is not a nice-to-have test — it is THE test.
        # Assert it against the real built artifact, not a unit-test stub.
        run: |
          set -euo pipefail
          docker run -d --name strad-ci -p 8080:8080 \
            -e STRAD_TOKENS='[]' \
            strad:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "--- /healthz"
          curl -fsS http://127.0.0.1:8080/healthz

          echo "--- /mcp with no token must be 401"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/mcp)
          if [ "$code" != "401" ]; then
            echo "::error::/mcp returned $code for an unauthenticated request; expected 401"
            docker logs strad-ci
            exit 1
          fi
          echo "OK: unauthenticated /mcp is 401"

      - name: Tear down
        if: always()
        run: docker rm -f strad-ci 2>/dev/null || true
