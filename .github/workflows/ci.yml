name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

# Nothing here reads the workflow token, and nothing here may push to a
# registry — but "grants nothing" is only as good as the repository SETTING that
# decides the default, and that setting lives in GitHub rather than in this repo.
# Flipping it to read/write would hand `packages: write` to every pull-request
# run without a line here changing. Declared, so the guarantee is in the file.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check

      # Nothing else in a PR build READS a workflow, and a malformed `action.yml`
      # or a typo'd `uses:` on the release path would otherwise merge green and
      # first show up as a startup_failure, where the fix is another merge.
      # actionlint parses every workflow AND every local action they reference.
      #
      # This is the static half. The `build_image` and `bundle_image` jobs below
      # are the other one: they build through `.github/actions/build-push`, so
      # the release path's shared action is EXECUTED on every pull request rather
      # than only read. actionlint validates an action's interface and evaluates
      # neither its prose nor its shell, which is exactly the gap that reddened
      # all eight release workflows at once (HACKS.md #53, #73).
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$tmp" actionlint
          "$tmp/actionlint" -color

  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test

  # Every config this repo ships, through the same gate the internal repo runs
  # against strad.prod.yaml. It needs no secrets — check-config substitutes a
  # dummy for every ${NAME} — so it is a plain PR job, and a typo'd key
  # (`consoleEnvs:` for `consoleEnv:`, which Zod silently strips) fails here
  # instead of deploying a console with no admin credential.
  config:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Globbed, not listed: a fourth config added to the repo must not be
      # silently unchecked. `infra/` holds configs and nothing else.
      - name: Check configs
        run: |
          set -e
          for cfg in strad.config*.yaml infra/*.yaml; do
            npm run --silent config:check -- --config "$cfg"
          done

  # Every server tree the bundle image bakes gets a leg here. `servers/**` is out
  # of the core TS program (see eslint.config.js) and the bundle image only cuts on
  # a push to main, so without these a PR can break a server tree and merge green:
  # a type error surfaces first as a failed release build, and a behavioural
  # regression surfaces first in production.
  #
  # The tree list is not maintained by hand. `test/ci-server-trees.test.ts` compares
  # it against the trees `servers/bundle/Dockerfile` bakes and fails until a new one
  # is named here — which is how a tree cannot land untested. x-twitter did: it
  # shipped four functional suites that ran nowhere for months, because adding a
  # tree meant remembering to hand-write another job.
  #
  # Why each leg is shaped the way it is:
  #
  #   good-eggs   build + test. The build typechecks shared + remote; the tests are
  #               browser-free: the MCP-App gating, the basket read, what a cart
  #               result may claim, the favorites read, the login wait, and that a
  #               failed login is retried on the next tool call rather than cached
  #               for the life of the container.
  #
  #   fetchpet    test, which builds first. fetchpet drives a login form nobody in
  #               this repo controls, and when Fetch redesigned it the server timed
  #               out on a stale selector every boot in both environments — listing
  #               four tools and failing every call. Its tests pin the selectors
  #               against the form Fetch actually serves and prove a failed login is
  #               retried rather than cached, both over a fake browser.
  #
  #   secrets     test. The one server whose TESTS are the security review: they
  #               assert that no tool can return a SECRET value, and that the viewer
  #               credential cannot reach one.
  #
  #   remote-filesystem
  #               test. strad's artifact store, whose whole product is the LINK it
  #               hands a human. Its tests pin the two things that decide one:
  #               `is_sensitive` picks the kind of link, and GCS's 7-day V4 ceiling
  #               is what forces V2 for the 14-day default.
  #
  #   telegram    test. It reads a real person's private messages with a credential
  #               that IS their account, so its tests are the ones that must run on
  #               every PR: the tool surface (the read-only tier does not build
  #               send_message), the mapping and paging below it, and the
  #               no-credentials path — the state this server ships in, where it
  #               must still mount and list rather than take the bundle down.
  #
  #   bill-spend  test. It EDITS FINANCIAL RECORDS with a token that is unscoped
  #               ADMIN on a BILL company, so two of its suites are the reason it
  #               runs on every PR: the write is reported as successful only after
  #               a read-back (BILL's update endpoint can answer 200 SUCCESS and
  #               discard the change), and the tool surface is asserted to contain
  #               nothing that issues a card or moves a budget — that surface is
  #               the only boundary the credential has.
  #
  #   x-twitter   test. Timeline, search, lookups and private bookmarks. The
  #               functional suites read no credentials — only `test:e2e`, which is
  #               not run here, resolves X API keys — so they need nothing CI cannot
  #               give them.
  #
  #   bundle-api  build + test. Six pure-API servers. Three are verbatim vendor
  #               copies with no tests here yet: a test written INSIDE a vendored
  #               copy is a merge conflict on every re-vendor and belongs upstream,
  #               and nobody has given them the tree-root treatment pointsyeah and
  #               onepassword have. The other three are FORKED, and their tests are the
  #               only thing defending the delta: a fork has no upstream to argue with it
  #               and no sync script to notice its loss, so a careless re-vendor
  #               silently reverts the fix.
  #                 fork/slack — two deltas, and both fail as a SUCCESS rather than
  #                   an error, which is why only a test catches a re-vendor
  #                   dropping them. `~text~` is strikethrough, so a message using
  #                   `~` for "approximately" posts successfully with paragraphs
  #                   struck out; the tests fail if the descriptions go or the
  #                   server starts rewriting a caller's text. And
  #                   `slack_download_file` returns a signed URL rather than the
  #                   `file://` path upstream writes into its own container — a
  #                   path the caller cannot open, reported as a completed
  #                   download. Those tests pin the URL, the single use, and the
  #                   per-slug signing key.
  #                 fork/google-flights — three fixes that each returned a confident
  #                   wrong answer: cabin class and passenger counts encoded at
  #                   protobuf field numbers Google skips as unknown, the two
  #                   baggage entries read in the wrong order, and a date grid that
  #                   returned a trailing price history instead of future
  #                   departures. The tests assert the encoded `tfs` bytes and the
  #                   parsed values, because none of the three ever raised an error.
  #                 fork/monarch-money — get_accounts(includeHoldings) reported an
  #                   empty portfolio for every account: the query asked for a field
  #                   Monarch's schema does not have, and a bare `.catch(() => [])`
  #                   turned every 400 into `[]`. The tests assert the QUERY TEXT,
  #                   since a wrong shape is invisible to a mocked client, and that
  #                   every fetch failure surfaces as an error rather than as `[]`.
  #               The build also typechecks the three vendored trees plus remote/,
  #               which otherwise surfaces first as a failed bundle image build.
  #
  #   pointsyeah  test, and no separate build leg: `npm test` is `npm run build &&
  #               vitest run`, so the same tsc over both workspaces still runs
  #               first, in the ordering (shared -> remote) the image's Dockerfile
  #               depends on, and a type error still fails the PR rather than the
  #               bundle-image build. The shared/ half is a verbatim vendor copy of
  #               pulsemcp/mcp-servers (HACKS.md #15 and #19), so a test written
  #               INSIDE it becomes a merge conflict on every re-vendor and belongs
  #               upstream — HACKS.md #45 says the same about the fetchpet
  #               divergence. That argument is about WHERE the file lives, not
  #               about whether the code is testable, so the suite is in
  #               `servers/pointsyeah/test/` at the TREE root and imports the
  #               vendored sources from outside them: a re-vendor overwrites
  #               `shared/` and never touches `test/`. It covers the PointsYeah
  #               client's request-building and response-shaping over a stubbed
  #               `fetch` and the injected Playwright surface, so it opens no
  #               socket, launches no browser, and needs no PointsYeah credential.
  #
  #   onepassword test, and no separate build leg: `npm test` is `npm run build &&
  #               vitest run`, so the build still happens — it is the same tsc over
  #               every workspace, in the ordering the image's Dockerfile uses
  #               (elicitation -> shared -> remote, where shared/ resolves the
  #               unpublished @pulsemcp/mcp-elicitation through a workspace `*`),
  #               and a type error — 1Password's `shared/src/tools/sanitize.ts` is
  #               credential redaction — still fails the PR. The suite lives in
  #               `servers/onepassword/test/`, at the TREE root rather than inside
  #               the vendored `shared/`, which is what keeps the re-vendor
  #               argument above from applying to it: a re-vendor overwrites
  #               `shared/` and never touches `test/`. It covers the op client's
  #               request-building and response-shaping with `child_process.spawn`
  #               faked, so it spawns nothing, reaches no network, and needs no
  #               1Password credential.
  #
  #   pulse-subregistry
  #               test. Also strad-owned, forked from the unpublished PulseMCP
  #               reference implementation. The bundle smoke test only proves the
  #               tool list; this suite pins defaults, query construction,
  #               truncation and error handling.
  #
  #   grafana     test. The proxy in front of the pinned mcp-grafana Go binary. Its
  #               suite runs against a fake MCP child rather than the real
  #               executable — which CI cannot run here and a unit test should not
  #               need to — and pins the seam: that the child is spawned with
  #               `-disable-write` and `-disable-proxied` (a read-only mount
  #               becoming read-write is silent otherwise), that it receives an
  #               allowlisted environment rather than the bundle's twenty other
  #               credentials, that tools and results are forwarded verbatim, and
  #               that a child which dies is replaced on the next call. The
  #               binary's own tool count is asserted by `bundle_image`, against
  #               the real thing.
  #
  #   strad-fetch test. strad's fork of @pulsemcp/pulse-fetch. The bundle smoke
  #               test only proves the tool list; this suite pins the two
  #               behavioural deltas the fork exists for — that `speed` demotes
  #               native rather than skipping it, and that a rejected credential
  #               does not abort the strategies after it — plus the cache bounds
  #               that a shared container needs and a stdio subprocess did not.
  #               It also owns the URL guard in front of the native strategy,
  #               which is the one thing here that fails OPEN when it regresses:
  #               a range dropped from the denylist, or a resolved address that
  #               stops being checked, is a scrape of the container's own
  #               loopback returned as tool output, and nothing else in this
  #               repo would say so.
  #
  #   bundle/host test. THE host: the process every bundle container runs. It
  #               mounts every tree in the image — 22 mounts, which staging's 32
  #               supplementary-image slugs resolve to, since a capability
  #               variant is another slug on the same mount. Its `tree:` carries
  #               a slash because it is a tree one level deeper than the rest —
  #               `servers/bundle` is what the Dockerfile copies, and the npm tree
  #               with the lockfile is `servers/bundle/host`. Its suite covers the
  #               per-slug env discovery, the two `degraded` verdicts, the
  #               presence route and the per-tree SDK cache, over its TypeScript
  #               sources with no `/app/trees` to mount. `bundle_image` asserts
  #               the mount SET against a booted container and exercises no
  #               branch, so it does not substitute: drop the bucket-before-
  #               viewer-domain precedence in `remoteFilesystemDegraded` and three
  #               tests go red here and nowhere else.
  #
  # One baked tree is deliberately not a leg here, and the comparison test names it
  # with the job that does cover it: `images/bundle-google` is a supplementary
  # image in its own right, gated by `bundle-google-ci.yml`, which installs it,
  # runs its suite, builds the image and smoke-tests all four mounts of the booted
  # container.
  #
  # `servers/bundle` is not a leg either, and needs no exemption: it owns no
  # lockfile, so it is not a tree — its host is, and has the leg above.
  servers:
    # Without this, GitHub names each leg after EVERY matrix dimension —
    # `servers (good-eggs, true, true, true)` — so the check name changes the day
    # a tree gains a build step. The tree is the identity; the booleans are how.
    name: servers (${{ matrix.tree }})
    runs-on: self-hosted
    strategy:
      # NOT optional. The default cancels every sibling leg on the first failure,
      # which turns "good-eggs is broken" into "twelve other trees have no
      # result".
      fail-fast: false
      # No `max-parallel` on purpose: every leg runs concurrently on the one
      # self-hosted box, and a cap would only make PRs slower.
      matrix:
        include:
          # skip-browser sets PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD on the install. The
          # three trees that depend on Playwright get their Chromium from the
          # image's base layer, and nothing in CI launches one.
          - tree: good-eggs
            build: true
            test: true
            skip-browser: true
          - tree: fetchpet
            build: false
            test: true
            skip-browser: true
          - tree: pointsyeah
            build: false
            test: true
            skip-browser: true
          - tree: secrets
            build: false
            test: true
            skip-browser: false
          - tree: remote-filesystem
            build: false
            test: true
            skip-browser: false
          - tree: telegram
            build: false
            test: true
            skip-browser: false
          - tree: bill-spend
            build: false
            test: true
            skip-browser: false
          - tree: x-twitter
            build: false
            test: true
            skip-browser: false
          - tree: bundle-api
            build: true
            test: true
            skip-browser: false
          - tree: onepassword
            build: false
            test: true
            skip-browser: false
          - tree: pulse-subregistry
            build: false
            test: true
            skip-browser: false
          - tree: strad-fetch
            build: false
            test: true
            skip-browser: false
          - tree: grafana
            build: false
            test: true
            skip-browser: false
          # Playwright is a dependency here too — the host owns the ONE Chromium
          # the three browser trees share — and nothing in this suite launches
          # one. `npm test` is `npm run build && vitest run`, so tsc over `src/`
          # runs first and a type error there still fails the PR without a
          # separate build step. The suite itself sits outside that tsconfig, so
          # vitest transpiles it without typechecking it.
          - tree: bundle/host
            build: false
            test: true
            skip-browser: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: servers/${{ matrix.tree }}
        run: npm ci
        env:
          # Empty rather than "0" when the leg does not want it: Playwright reads
          # this as a plain truthy check, and "0" is truthy.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ${{ matrix.skip-browser && '1' || '' }}
      - name: Build
        if: matrix.build
        working-directory: servers/${{ matrix.tree }}
        run: npm run build
      - name: Test
        if: matrix.test
        working-directory: servers/${{ matrix.tree }}
        run: npm test

  # strad-hostd: the daemon that runs on a machine a person owns and serves the
  # shell and browser MCP servers behind a consent dialog. It is NOT a leg of the
  # `servers` matrix above — that matrix is the set of trees the bundle image
  # bakes (test/ci-server-trees.test.ts holds it to that), and this code never
  # runs in a strad container.
  #
  # It hands out a shell on a personal laptop, so its tests are the security
  # review: nothing runs without a grant, an unanswered dialog is a denial, each
  # server's key opens only that server, the status page answers only to loopback
  # with a token, and ending a grant kills the process group it started.
  #
  # The browser suite drives a REAL Chromium, found the way the owner's Chrome is
  # (DevToolsActivePort in its user-data directory). With CI set, a missing
  # browser FAILS the suite rather than skipping it — a skipped suite proves
  # nothing here. Lint and format for this tree run in the `lint` job, from the
  # repo root.
  hostd:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: hostd
        run: npm ci
      - name: Install Chromium
        run: npx --yes playwright@1.63.0 install chromium
      - name: Build and test
        working-directory: hostd
        run: npm test
      - name: Install script (no LaunchAgent, no tunnel)
        working-directory: hostd
        run: |
          set -euo pipefail
          export STRAD_HOSTD_HOME="$RUNNER_TEMP/hostd-state"
          ./install/install.sh --machine "CI" --suffix ci --no-agent
          node "$STRAD_HOSTD_HOME/app/build/cli.js" keys | awk '{ if (length($2) < 32) exit 1 }'
          ./install/uninstall.sh --purge

  # THE bundle: twenty-two MCP servers, fourteen dependency trees, one Chromium and the
  # `op` CLI in one container. It is now the only supplementary component strad
  # deploys, so a PR that cannot build it — or that builds one where a server
  # silently lost half its tools — is a failing PR.
  #
  # The smoke test is the honest half. It lists tools from every mount of the
  # RUNNING container and asserts the full-capability counts (slack 13, tailscale
  # 15, monarch 23, gmail 8, docs 11, calendar 7, 1Password 9, secrets 4, …).
  # Those are the numbers the gateway's read-only allow-lists are carved out of, so
  # if an upstream grows a tool, this is where we find out — not in production. For
  # secrets the count is a security assertion: a FIFTH tool on a server whose
  # entire contract is "no tool returns a SECRET value" is exactly what CI should catch.
  #
  # It is also where the configs meet the tools. A `tools: allow` entry naming a
  # tool the upstream no longer offers narrows that slug's surface by one, fail-
  # closed and silent; the gateway only says so once it is deployed. This job has
  # the one thing that can answer it early — the real names, from the real image —
  # so it dumps them and checks every config in the repo against them.
  bundle_image:
    runs-on: self-hosted
    # One runner box means one docker daemon, and every concurrent job shares it.
    # A fixed name collides loudly; a fixed TAG is worse, because a concurrent job
    # rebuilding it between our build and our run is a wrong-artifact green with no
    # error anywhere. Per-run identifiers make both impossible, and let the
    # `if: always()` teardown name only this job's container.
    #
    # The one thing they cost is the fixed names' accidental garbage collection:
    # a leaked `bundle-ci` was reaped by the next run that wanted that name, and
    # nothing else wants `bundle-ci-<run>`. Hence the sweep step, and the
    # `strad-ci` label everything below carries so the sweep can find it.
    env:
      BUNDLE_IMAGE: strad-bundle:ci-${{ github.run_id }}-${{ github.run_attempt }}
      BUNDLE_CONTAINER: bundle-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # The fail-closed container gets its own per-run NAME rather than
      # "$BUNDLE_CONTAINER-closed", so the `if: always()` teardown can name a
      # bare variable — `test/ci-workflow.isolation.test.ts` insists on that, and
      # it is right to: a teardown target built by string concatenation is one
      # edit away from reaping a concurrent job's container.
      BUNDLE_CLOSED_CONTAINER: bundle-ci-closed-${{ github.run_id }}-${{ github.run_attempt }}
      # Not a secret: it is this job's throwaway stand-in for the token the
      # deploy bakes onto every supplementary component. The mounts are gated on
      # it (servers/bundle/host/src/internal-auth.ts), so a container booted
      # without one fails closed and smokes nothing — which is exactly what the
      # "refuses to serve" step below boots a second container to prove.
      STRAD_INTERNAL_TOKEN: ci-internal-token
    steps:
      - uses: actions/checkout@v4
      # The builder is a shared resource too, and the sharpest one: every job on
      # this box runs as the same user, so `docker buildx create --use` writes
      # ONE `~/.docker/buildx/current`, and a `docker buildx build` with no
      # `--builder` resolves whichever job created a builder most recently. This
      # job's build then runs inside a CONCURRENT job's buildkit, and dies with
      # `graceful_stop` the moment that job's teardown removes it. It killed a
      # 791MB layer pull on `main` on 2026-08-11 (HACKS.md #53).
      #
      # So: `use: false` never writes the shared pointer, and every build below
      # names `steps.buildx.outputs.name` so it never reads it.
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          use: false
      # For the allow-list check below: it parses configs with the gateway's own
      # schema, so it needs the repo's dependency tree. Nothing else here does.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Sweep what earlier runs leaked
        run: |
          docker container prune -f --filter label=strad-ci --filter until=24h || true
          docker image prune -af --filter label=strad-ci --filter until=24h || true

      # Through the release path's own wrapper, with `push: false`. The build
      # itself would work either way; going through `.github/actions/build-push`
      # is the point. Every OTHER call site of that action is a release workflow
      # that runs on `main` only, so until this step existed nothing on the PR
      # path loaded it — a malformed manifest, a bad input, or buildx wiring that
      # does not hold together merged green and first ran in production. On
      # 2026-08-11 that was eight release workflows red on one commit and three
      # follow-up merges to settle. See HACKS.md #73.
      #
      # `push: false` here is not what keeps the image off ghcr: the action
      # refuses to push from a pull-request run whatever a call site asks for,
      # and this workflow logs in to no registry to push with. The two of those
      # are the guarantee; this line is the third.
      - name: Build the bundle image
        uses: ./.github/actions/build-push
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: servers/bundle/Dockerfile
          push: "false"
          load: "true"
          tags: ${{ env.BUNDLE_IMAGE }}
          labels: strad-ci=1
          cache-from: type=gha,scope=bundle
          cache-to: type=gha,mode=max,scope=bundle

      - name: Boot it and smoke every mount
        run: |
          set -euo pipefail
          # Credential-free on purpose: listing tools never calls an upstream API.
          # DANGEROUSLY_SKIP_ELICITATIONS is what lets 1Password mount at all, and
          # the two GCS-ish servers need their (distinct!) buckets named.
          # secrets refuses to mount without a project and a namespace — an
          # unscoped secrets server would see every parameter in the project — so CI
          # names both. Still credential-free: listing tools calls no API.
          echo "image=$BUNDLE_IMAGE container=$BUNDLE_CONTAINER"
          docker run -d --name "$BUNDLE_CONTAINER" --label strad-ci=1 \
            -e DANGEROUSLY_SKIP_ELICITATIONS=true \
            -e STRAD_INTERNAL_TOKEN="$STRAD_INTERNAL_TOKEN" \
            -e GCS_PROJECT_ID=ci -e GCS_BUCKET=ci-bucket \
            -e REMOTE_FILESYSTEM_TMP_PUBLIC_GCS_BUCKET=ci-rfs-bucket \
            -e REMOTE_FILESYSTEM_TMP_PUBLIC_SENSITIVE_VIEWER_DOMAIN=ci.example \
            -e SECRETS_PROJECT_ID=ci -e SECRETS_NAMESPACES=/strad/staging/mcp/ \
            "$BUNDLE_IMAGE"
          for i in $(seq 1 60); do
            if docker exec "$BUNDLE_CONTAINER" node -e "fetch('http://127.0.0.1:8080/healthz').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))" 2>/dev/null; then break; fi
            sleep 2
          done
          docker exec "$BUNDLE_CONTAINER" node /app/scripts/smoke.mjs

      # BOTH DIRECTIONS OF THE GATE, against the real image.
      #
      # The failure this guards is OPEN, and a green smoke above proves only the
      # served half: a middleware wired to the wrong env name, or a comparator
      # that returns true for everything, looks exactly like a fix. So assert the
      # refusals too, and assert that `/healthz` is still reachable WITHOUT a
      # token — App Platform's prober holds none, and gating it would take the
      # component out of service.
      - name: A mount refuses a request that presents no token, or the wrong one
        run: |
          set -euo pipefail
          probe() {
            docker exec "$BUNDLE_CONTAINER" node -e '
              const [url, auth, want] = process.argv.slice(1); // `node -e` puts the first user arg at argv[1], not argv[2]
              const headers = { "content-type": "application/json", accept: "application/json, text/event-stream" };
              if (auth) headers.authorization = auth;
              fetch(url, {
                method: "POST",
                headers,
                body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "initialize", params: { protocolVersion: "2025-06-18", capabilities: {}, clientInfo: { name: "gate-probe", version: "1" } } }),
              }).then(async (r) => {
                const body = (await r.text()).slice(0, 160);
                if (r.status !== Number(want)) throw new Error(`expected ${want}, got ${r.status}: ${body}`);
                console.log(`  ${want} as expected${auth ? "" : " (no Authorization header)"}: ${body}`);
              }).catch((e) => { console.error(String(e.message ?? e)); process.exit(1); });
            ' "$@"
          }
          echo "no token:"
          probe http://127.0.0.1:8080/gmail "" 401
          echo "wrong token:"
          probe http://127.0.0.1:8080/gmail "Bearer not-the-token" 401
          # The right token with no scheme: every door reads the header by one
          # rule (`bearerToken`), and this is the built image's half of it.
          echo "right token, no Bearer scheme:"
          probe http://127.0.0.1:8080/gmail "$STRAD_INTERNAL_TOKEN" 401
          echo "right token:"
          probe http://127.0.0.1:8080/gmail "Bearer $STRAD_INTERNAL_TOKEN" 200
          echo "healthz stays open:"
          docker exec "$BUNDLE_CONTAINER" node -e '
            fetch("http://127.0.0.1:8080/healthz").then((r) => {
              if (r.status !== 200) { console.error(`healthz answered ${r.status} with no token`); process.exit(1); }
              console.log("  200 with no Authorization header");
            });
          '

      # FAIL CLOSED, in a container rather than a unit test.
      #
      # A host that cannot tell core from anything else in the VPC must serve
      # nothing — `router.ts` has said so for the strad image since it was
      # written. The unit test asserts the decision; this asserts the process
      # built from it. Its own container, because STRAD_INTERNAL_TOKEN is
      # `process.env` and the one above has it.
      #
      # `--json` on the smoke rather than the asserting invocation: with no token
      # every mount records an error, which is the point, and the asserting form
      # would just print 22 identical failures.
      - name: With no STRAD_INTERNAL_TOKEN the host refuses to serve any mount
        run: |
          set -euo pipefail
          docker run -d --name "$BUNDLE_CLOSED_CONTAINER" --label strad-ci=1 \
            -e DANGEROUSLY_SKIP_ELICITATIONS=true \
            -e GCS_PROJECT_ID=ci -e GCS_BUCKET=ci-bucket \
            -e REMOTE_FILESYSTEM_TMP_PUBLIC_GCS_BUCKET=ci-rfs-bucket \
            -e REMOTE_FILESYSTEM_TMP_PUBLIC_SENSITIVE_VIEWER_DOMAIN=ci.example \
            -e SECRETS_PROJECT_ID=ci -e SECRETS_NAMESPACES=/strad/staging/mcp/ \
            "$BUNDLE_IMAGE"
          for i in $(seq 1 60); do
            if docker exec "$BUNDLE_CLOSED_CONTAINER" node -e "fetch('http://127.0.0.1:8080/healthz').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))" 2>/dev/null; then break; fi
            sleep 2
          done
          docker exec "$BUNDLE_CLOSED_CONTAINER" node /app/scripts/smoke.mjs --json > bundle-tools-closed.json
          node -e '
            const dump = JSON.parse(require("fs").readFileSync("bundle-tools-closed.json", "utf8"));
            const entries = Object.entries(dump.mounts);
            if (entries.length === 0) throw new Error("no mounts in the dump — /healthz did not list any");
            const served = entries.filter(([, m]) => m.tools);
            if (served.length) throw new Error(`FAILED OPEN: ${served.length} mount(s) served with no internal token: ${served.map(([p]) => p).join(", ")}`);
            const wrong = entries.filter(([, m]) => !/HTTP 503/.test(m.error ?? ""));
            if (wrong.length) throw new Error(`expected 503 from every mount, got: ${wrong.map(([p, m]) => `${p}: ${m.error}`).join("; ")}`);
            console.log(`${entries.length}/${entries.length} mounts refused with 503 and none served`);
          '
          docker rm -f "$BUNDLE_CLOSED_CONTAINER" >/dev/null

      # The join the two jobs never made. `--json` dumps every mount's real tool
      # NAMES; check-tool-policy matches each config's `tools:` entries against
      # them and fails on one that matches nothing. Globbed like the config job,
      # for the same reason: a config added to the repo must not be silently
      # unchecked.
      #
      # A slug it cannot enumerate — remote-http, another image, a mount whose
      # surface here is a credential-free floor — is SKIPPED and named, never
      # failed. The step prints what it covered and what it did not.
      - name: Every `tools:` entry names a tool the mount really serves
        run: |
          set -euo pipefail
          docker exec "$BUNDLE_CONTAINER" node /app/scripts/smoke.mjs --json > bundle-tools.json
          npm run --silent policy:check -- \
            --tools bundle-tools.json \
            --image ghcr.io/tadasant/strad-bundle:latest \
            $(for cfg in strad.config*.yaml infra/*.yaml; do printf -- '--config %s ' "$cfg"; done)

      # THE DESCRIPTOR SEAM, END TO END, IN A REAL CONTAINER.
      #
      # `renderAppSpec` composes SECRETS_STORES from `mcpStores:` and the secrets
      # tree — a different npm project, in a different image layer — reads it
      # back. Nothing in either type system sees both ends, so a renamed field is
      # a green PR and a mount that declines to start. The container above boots
      # the SINGLE-store reading; this one boots the multi-store one and asserts
      # the mount is there with both stores on it.
      #
      # Its own container, because a store list is `process.env` and the first
      # container already has a project id in its. Credential-free like the
      # first: no key is set for either store, so both come up degraded and list
      # their tools, which is exactly what this step reads.
      - name: The multi-store descriptor really mounts
        run: |
          set -euo pipefail
          MULTI="$BUNDLE_CONTAINER-multi"
          docker run -d --name "$MULTI" --label strad-ci=1             -e DANGEROUSLY_SKIP_ELICITATIONS=true             -e STRAD_INTERNAL_TOKEN="$STRAD_INTERNAL_TOKEN"             -e GCS_PROJECT_ID=ci -e GCS_BUCKET=ci-bucket             -e REMOTE_FILESYSTEM_TMP_PUBLIC_GCS_BUCKET=ci-rfs-bucket             -e REMOTE_FILESYSTEM_TMP_PUBLIC_SENSITIVE_VIEWER_DOMAIN=ci.example             -e SECRETS_STORES='[{"project":"ci-staging","namespaces":["/strad/staging/mcp/"],"viewerKeyVar":"SECRETS_SERVICE_ACCOUNT_KEY_JSON"},{"project":"ci-prod","namespaces":["/strad/prod/mcp/"],"viewerKeyVar":"CI_PROD_VIEWER_KEY_JSON"}]'             "$BUNDLE_IMAGE"
          for i in $(seq 1 60); do
            if docker exec "$MULTI" node -e "fetch('http://127.0.0.1:8080/healthz').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))" 2>/dev/null; then break; fi
            sleep 2
          done
          docker exec "$MULTI" node /app/scripts/smoke.mjs --json > bundle-tools-multi.json
          # The mount exists (a `loadConfig` throw would have skipped it), and it
          # names both stores rather than one. `node -e` over the dump rather than
          # grep, so a partial match cannot pass for a whole one.
          node -e '
            const dump = JSON.parse(require("fs").readFileSync("bundle-tools-multi.json", "utf8"));
            const secrets = dump.mounts["/secrets"];
            if (!secrets) throw new Error("the secrets mount is absent under SECRETS_STORES — the descriptor did not load");
            if (secrets.error) throw new Error(`the secrets mount would not list: ${secrets.error}`);
            const tools = secrets.tools ?? [];
            for (const want of ["list_managed_namespaces", "list_parameters", "get_parameter", "open_secrets_manager"]) {
              if (!tools.includes(want)) throw new Error(`the secrets mount is missing ${want}: ${tools.join(", ")}`);
            }
            // Credential-free, so every store fails closed: the read-only four
            // and nothing else, on a container fronting TWO stores.
            if (tools.length !== 4) throw new Error(`expected the read-only 4 with no credential on either store, got ${tools.length}: ${tools.join(", ")}`);
            console.log(`secrets mounts under SECRETS_STORES with the read-only four: ${tools.join(", ")}`);
          '
          docker rm -f "$MULTI" >/dev/null

      - name: The `op` CLI is really in the image
        run: docker exec "$BUNDLE_CONTAINER" op --version

      # Names only this run's container and image, so it cannot reap a concurrent
      # job's. Deleting the image matters too: per-run tags would otherwise pile up
      # one per CI run on a runner box that never goes away. buildx's cache is not
      # the daemon's image store, so nothing rebuilds slower for this.
      - name: Tear down
        if: always()
        run: |
          docker rm -f "$BUNDLE_CONTAINER" 2>/dev/null || true
          docker rm -f "$BUNDLE_CLOSED_CONTAINER" 2>/dev/null || true
          docker rmi -f "$BUNDLE_IMAGE" 2>/dev/null || true

  verify_lockfile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Ensure package-lock.json is up to date
        run: |
          npm install --package-lock-only
          git diff --exit-code package-lock.json

  # The dev environment is the one thing in this repo whose users are all
  # newcomers and agents — the two populations least able to debug it. So it is
  # asserted end to end rather than reviewed: build the workspace image, install
  # into it, start the gateway, and demand that it serves.
  #
  # A stale Dockerfile.dev fails nothing else. `npm run dev:agent` is exercised
  # by nothing else. Both are how a session gets its first look at strad, and a
  # broken one reads as "strad is broken".
  dev_env:
    runs-on: self-hosted
    env:
      # Per-run, for the reason spelled out on `bundle_image`: one runner box
      # means one docker daemon, and a fixed compose project would have two
      # concurrent jobs sharing a container, a volume and a build.
      AC_PROJECT: strad-dev-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: .agent-containers/docker-compose.dev.yml
      # The credential mounts, redirected away from the runner's real HOME. A
      # bind mount whose source does not exist is created by the daemon as root,
      # and this box's HOME belongs to a human.
      AC_CLAUDE_DIR: /tmp/ac-ci-claude-${{ github.run_id }}-${{ github.run_attempt }}
      AC_GH_DIR: /tmp/ac-ci-gh-${{ github.run_id }}-${{ github.run_attempt }}
      # Name the builder instead of resolving the ambient one. `default` is the
      # daemon's own builder: it always exists, it loads what it builds, and no
      # concurrent job's teardown can remove it mid-build. That is the same
      # hazard `bundle_image` spells out, answered with one variable rather than
      # a job-scoped buildkit — a dev image needs no cache export.
      BUILDX_BUILDER: default
    # Every compose call below spells `--project-name`, and the directory setup
    # spells `install -d`, rather than the `-p` short form of either.
    # `test/ci-workflow.isolation.test.ts` scans this file for `-p <arg>` and
    # demands every hit be an unbound host port — which is the right guard, and
    # cannot tell `docker run -p` from `mkdir -p`. Long forms keep it strict.
    steps:
      - uses: actions/checkout@v4

      # No sweep step here, unlike `bundle_image` and `build_image`. Those two
      # name their artifacts and label them `strad-ci`, so their sweep is scoped
      # to what they created. This job's containers are compose's, and compose
      # labels them by PROJECT — which is per-run, so there is no stable filter
      # that means "mine and not a concurrent job's". An unscoped
      # `docker container prune` would be the only box-wide destructive step in
      # this file, and it would be reaping other jobs' containers to tidy up
      # after ours. The `if: always()` teardown is the cleanup; a run killed
      # before it reaches that leaks a container under a per-run project name
      # nothing else wants.

      # The cheap gate, first: interpolation, indentation, an unknown key. It
      # needs no daemon, so it fails in seconds rather than after a build.
      - name: The compose file parses
        run: docker compose -f "$COMPOSE_FILE" config > /dev/null

      # `npm run dev:agent` is the path most sessions will actually take, and it
      # shares no code with the container path below. Node only — that is the
      # whole point of it.
      #
      # BEFORE the container, and that ordering is load bearing. The compose
      # stack mounts a named volume at /app/node_modules inside a bind-mounted
      # checkout, so if the directory does not already exist the DAEMON creates
      # it, as root — and then this step's `npm ci` is an EACCES on a workspace
      # the runner owns. Installing first means the mount point is already there
      # and already the runner's. It also makes the volume assertion below say
      # more: the host tree is populated, so a non-empty tree inside the
      # container is the volume rather than the bind mount showing through.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: The no-Docker path boots
        run: |
          set -euo pipefail
          npm ci
          # A pinned port would be a shared resource on a shared box; with PORT
          # unset the script asks the kernel for a free one, so let it, and read
          # the port and pid back out of what it prints.
          out=$(npm run --silent dev:agent -- --background)
          echo "$out"
          # --background only returns 0 once /healthz answered, so reaching here
          # is already the assertion. The rest is for the log, and for the kill.
          port=$(printf '%s' "$out" | grep -o 'localhost:[0-9]*' | head -n 1 | cut -d: -f2)
          pid=$(printf '%s' "$out" | grep -o 'pid [0-9]*' | head -n 1 | cut -d' ' -f2)
          curl -fsS "http://127.0.0.1:${port}/healthz"
          echo
          # By pid, never by pattern: `pkill -f node` on a box that runs every
          # job of every PR is a way to fail somebody else's build. The script
          # launches the dev command through `sh -c "exec …"` precisely so this
          # pid is the node process — through `npm run` it would be npm's, and
          # killing that leaves the --watch supervisor holding the port.
          kill "$pid" 2> /dev/null || true

      - name: Build and start the workspace
        run: |
          set -euo pipefail
          install -d "$AC_CLAUDE_DIR" "$AC_GH_DIR"
          # APP_PORT=0 asks the daemon for a free host port, which is what lets
          # this run beside anything else on the box. Read back below.
          APP_PORT=0 docker compose --project-name "$AC_PROJECT" -f "$COMPOSE_FILE" up -d --build

      - name: Install, start the gateway, and demand it serves
        run: |
          set -euo pipefail
          dc() { docker compose --project-name "$AC_PROJECT" -f "$COMPOSE_FILE" "$@"; }

          dc exec -T app .agent-containers/setup.sh

          # The node_modules volume, not the bind mount: the container must have
          # its own tree. A count of zero means the volume was shadowed and the
          # container is running the host's install, which on a different libc
          # is a bug that surfaces nowhere near here.
          count=$(dc exec -T app sh -c 'ls node_modules | wc -l' | tr -d '[:space:]')
          echo "node_modules entries: ${count}"
          case "$count" in
            "" | 0 | *[!0-9]*)
              echo "::error::node_modules is empty inside the container; the named volume is not doing its job"
              exit 1
              ;;
          esac

          # The socket's absence is a security property of this image, not an
          # oversight — see .agent-containers/README.md. Assert it, so adding it
          # back has to be deliberate.
          if dc exec -T app sh -c 'test -S /var/run/docker.sock'; then
            echo "::error::/var/run/docker.sock is mounted into the dev container; that is root-equivalent host access and strad's dev stack does not take it"
            exit 1
          fi

          dc exec -T app .agent-containers/run.sh

          mapping=$(dc port app 8080 2>/dev/null | head -n 1 || true)
          port=${mapping##*:}
          case "$port" in
            "" | *[!0-9]*)
              echo "::error::could not read the host port for the app service; \`docker compose port\` said: ${mapping:-<no output>}"
              dc logs app || true
              exit 1
              ;;
          esac
          base="http://127.0.0.1:${port}"
          echo "compose port -> ${mapping}; base ${base}"

          for i in $(seq 1 60); do
            if curl -fsS "$base/healthz" > /dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "--- /healthz"
          health=$(curl -fsS "$base/healthz" || true)
          echo "$health"
          # Not merely 200: the dev config exists to mount `echo`, so a healthy
          # gateway with an empty server list is the failure this catches.
          #
          # PRESENCE, not exclusivity. This used to match the whole array
          # (`"servers":["echo"]`), which quietly asserted that echo was the
          # ONLY server the dev config mounts — so adding a second entry failed
          # a job whose message says the config "did not take", while the very
          # output it printed showed echo mounted and serving. Slice the array
          # out and look inside it.
          servers=${health#*'"servers":['}
          servers=${servers%%]*}
          case "$servers" in
            *'"echo"'*) echo "OK: echo is mounted (servers: [$servers])" ;;
            *)
              echo "::error::/healthz did not report the echo server; the dev config did not take"
              dc exec -T app tail -50 /app/.logs/app.log || true
              exit 1
              ;;
          esac

          # Re-running run.sh is a no-op, not an EADDRINUSE crash. Agents re-run
          # things.
          echo "--- run.sh is idempotent"
          # Captured in a variable rather than a file: a fixed path under /tmp is
          # a shared resource on this box exactly like a fixed port is, and a
          # concurrent job writing it between the tee and the grep is a green
          # that proves nothing.
          rerun=$(dc exec -T app .agent-containers/run.sh)
          echo "$rerun"
          printf '%s' "$rerun" | grep -q "already serving"

      - name: Tear down
        if: always()
        run: |
          # The container runs as root against a bind-mounted checkout, so its
          # log directory belongs to root on the host. Remove it from INSIDE, or
          # the next run's `actions/checkout` cannot clean the workspace.
          docker compose --project-name "$AC_PROJECT" -f "$COMPOSE_FILE" exec -T app rm -rf /app/.logs 2>/dev/null || true
          docker compose --project-name "$AC_PROJECT" -f "$COMPOSE_FILE" down -v --remove-orphans 2>/dev/null || true
          # `down -v` drops the volume; the mount POINT it was attached to stays
          # in the checkout. It is the runner's own directory when the step above
          # this job's install created it, and root's when something went wrong
          # before that — an empty root-owned directory a runner-owned parent can
          # still rmdir. Either way it must not be left for the next checkout.
          rmdir node_modules 2>/dev/null || true
          rm -rf "$AC_CLAUDE_DIR" "$AC_GH_DIR" || true

  # The docs site is the canonical prose for how strad works, and the premise is
  # that it stays true commit-by-commit. Keeping it from silently rotting means
  # building it here: a broken link, bad frontmatter, or a page missing from the
  # sidebar fails the PR rather than the deploy. Node-only — docs/ has its own
  # dependency tree and never touches the gateway's.
  docs_site:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        run: npm ci
        working-directory: docs
      - name: Build docs site
        run: npm run build
        working-directory: docs

  # The image is the deliverable, so a PR that cannot produce one is a failing
  # PR — not something we find out about at release time.
  build_image:
    runs-on: self-hosted
    # Per-run, for the reason spelled out on `bundle_image`. This job carries the
    # sharpest version of it: a concurrent job rebuilding a shared `strad:ci`
    # between our build and our run would move the 401 assertion below onto
    # someone else's image, and it would pass.
    env:
      STRAD_IMAGE: strad:ci-${{ github.run_id }}-${{ github.run_attempt }}
      STRAD_CONTAINER: strad-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      # Job-scoped, for the reason spelled out on `bundle_image`: the box-wide
      # `~/.docker/buildx/current` is a shared name like any other.
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          use: false

      - name: Sweep what earlier runs leaked
        run: |
          docker container prune -f --filter label=strad-ci --filter until=24h || true
          docker image prune -af --filter label=strad-ci --filter until=24h || true

      # Through `.github/actions/build-push`, for the reason spelled out on
      # `bundle_image`: this and that step are the only two executions the
      # release path's shared action gets on a pull request.
      - name: Build image
        uses: ./.github/actions/build-push
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          push: "false"
          load: "true"
          tags: ${{ env.STRAD_IMAGE }}
          labels: strad-ci=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the image and assert the auth gate
        # strad is on the open internet with no network perimeter, so "does /mcp
        # reject an anonymous caller" is not a nice-to-have test — it is THE test.
        # Assert it against the real built artifact, not a unit-test stub.
        run: |
          set -euo pipefail
          echo "image=$STRAD_IMAGE container=$STRAD_CONTAINER"
          # `127.0.0.1::8080`, not `-p 8080:8080`: a fixed host port is a shared
          # resource on a shared box, and the second concurrent job simply fails to
          # start. The empty middle field asks the daemon for a free one. Bare `-P`
          # would also do that, but on EVERY interface — which puts a booted
          # gateway on the runner box's public address for the life of the job, and
          # makes `docker port` answer with an v4 and a v6 line whose ports are
          # only conventionally the same one. Loopback keeps it to a single answer.
          docker run -d --name "$STRAD_CONTAINER" --label strad-ci=1 \
            -p 127.0.0.1::8080 \
            -e STRAD_TOKENS='[]' \
            "$STRAD_IMAGE"

          # Only the daemon knows which port it picked, so read it back. This is
          # the one step that can fail quietly: an empty or unparsed answer makes
          # every URL below malformed, and curl reports that as a refused
          # connection — which reads as "the gateway is broken" rather than "we
          # asked the wrong port". So assert it here, and print what docker said.
          mapping=$(docker port "$STRAD_CONTAINER" 8080/tcp 2>/dev/null | head -n 1 || true)
          port=${mapping##*:}
          case "$port" in
            "" | *[!0-9]*)
              echo "::error::could not read the host port for $STRAD_CONTAINER 8080/tcp; \`docker port\` said: ${mapping:-<no output>}"
              docker logs "$STRAD_CONTAINER" || true
              exit 1
              ;;
          esac
          echo "docker port -> ${mapping}; host port ${port}"
          base="http://127.0.0.1:${port}"

          for i in $(seq 1 30); do
            if curl -fsS "$base/healthz" >/dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "--- /healthz"
          curl -fsS "$base/healthz"

          echo "--- /mcp with no token must be 401"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/mcp")
          if [ "$code" != "401" ]; then
            echo "::error::/mcp returned $code for an unauthenticated request; expected 401"
            docker logs "$STRAD_CONTAINER"
            exit 1
          fi
          echo "OK: unauthenticated /mcp is 401"

      # This run's container and image only, for the reason on `bundle_image`.
      - name: Tear down
        if: always()
        run: |
          docker rm -f "$STRAD_CONTAINER" 2>/dev/null || true
          docker rmi -f "$STRAD_IMAGE" 2>/dev/null || true
