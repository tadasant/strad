name: Release bundle image

# Build THE strad bundle image — all thirty-four MCP servers in one container — and
# push it to ghcr.
#
# The build itself is `release-supplementary-image.yml`, which every
# supplementary image release shares. This file is the half that is genuinely
# per-image: which commits cut one, which tree holds the Dockerfile, and which
# package it lands in. Three of the five inputs below exist for this caller —
# `file:`, `cache-scope:` and `refuse-off-main:` — and each DEFAULTS to the value
# that is wrong for the bundle, silently. The release path has no pre-merge
# execution, so `test/workflow-release-callers.test.ts` asserts all three on this
# caller by name rather than letting the first run be a real release.
#
# `name:` above is load-bearing beyond this file: `reheal-bundle-image.yml`
# selects its `workflow_run` trigger by workflow NAME, and `src/deploy/imageTag.ts`
# holds a deploy's wait open on the promise that it fires. Renaming it disables
# the self-heal silently. `test/image-tag.bundle.test.ts` pins the pair.
#
# It does not deploy. The next `deploy-staging.yml` run resolves the newest
# `sha-<commit>` bundle an ancestor published, and — because this build is slower
# than the core release that calls that deploy — waits for this one to land
# (`--wait-for-image`). See "which image a deploy ships" in
# docs/operate/operations.md.
#
# BUILD CONTEXT IS THE REPO ROOT. This image is assembled from twenty-five projects
# that live in different directories (servers/bundle-api, images/bundle-google,
# servers/onepassword, servers/remote-filesystem, servers/pulse-subregistry,
# servers/strad-fetch, servers/grafana,
# servers/{good-eggs,fetchpet,pointsyeah,x-twitter,telegram,whatsapp,bill-spend,aws-device-farm,liveoak,ssh},
# servers/{airtable,flightaware,digitalocean,hetzner,image-tools,nutrition-facts}),
# each built in its own stage with its own lockfile. So `paths:` below has to watch all of them: a
# change to any one of those servers changes this image.
#
# The per-server images (release-bundle-api-image.yml, release-goodeggs-image.yml,
# …) are deliberately NOT deleted. Production still runs them — its config lives
# in tadasant-internal and still points at ghcr.io/tadasant/strad-server-*:latest —
# and it is re-pointed at this bundle in a follow-up. Deleting them now would mean
# the next `main` push silently changes what production pulls. See HACKS.md #23.

on:
  push:
    branches:
      - main
    paths:
      # ONE ENTRY PER TREE THE DOCKERFILE BUILDS. `servers/secrets/**` was
      # missing, and the way that fails is the worst available: a change to the
      # secrets MCP client lands on `main`, cuts no image, and the bundle keeps
      # serving the old code — so the fix is merged, believed shipped, and not
      # running. That is how a secret-value encoding fix would have reached
      # `main` while `/mcp` carried on writing unencoded values.
      # Cross-check against `COPY --from=build-*` in servers/bundle/Dockerfile.
      # This list is READ by `src/deploy/imageTag.ts` — it is the answer to
      # "which commits owe a bundle image", so an entry removed here walks a
      # deploy back onto an older bundle rather than failing anything.
      - "servers/bundle/**"
      - "servers/bundle-api/**"
      - "servers/onepassword/**"
      - "servers/secrets/**"
      - "servers/remote-filesystem/**"
      - "servers/good-eggs/**"
      - "servers/fetchpet/**"
      - "servers/pointsyeah/**"
      - "servers/x-twitter/**"
      - "servers/pulse-subregistry/**"
      - "servers/strad-fetch/**"
      - "servers/grafana/**"
      - "servers/telegram/**"
      - "servers/whatsapp/**"
      - "servers/messenger/**"
      - "servers/bill-spend/**"
      - "servers/aws-device-farm/**"
      - "servers/liveoak/**"
      - "servers/ssh/**"
      - "servers/airtable/**"
      - "servers/flightaware/**"
      - "servers/digitalocean/**"
      - "servers/hetzner/**"
      - "servers/image-tools/**"
      - "servers/nutrition-facts/**"
      - "images/bundle-google/**"
      - ".github/workflows/release-bundle-image.yml"
      # A change to the shared body has to be exercised by a real release, or
      # its first execution is on whatever unrelated commit next touches one of
      # the trees above. See test/workflow-release-callers.test.ts.
      - ".github/workflows/release-supplementary-image.yml"
  workflow_dispatch:

concurrency:
  group: release-bundle-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # No `secrets: inherit`: the shared body needs only GITHUB_TOKEN, which a
    # called workflow is handed automatically. Inheriting would put every
    # credential this repo holds in reach of a build that wants none of them.
    uses: ./.github/workflows/release-supplementary-image.yml
    permissions:
      contents: read
      packages: write
    with:
      # The repo root, because the Dockerfile COPYs from twenty-five trees.
      context: .
      file: servers/bundle/Dockerfile
      image: ghcr.io/tadasant/strad-bundle
      # Its own gha cache scope. This build is large enough to evict every
      # one-tree image out of the shared default scope.
      cache-scope: bundle
      # This pushes `strad-bundle:latest`, which live staging tracks. A branch
      # bundle belongs on a branch-scoped tag: dispatch deploy-staging.yml on
      # the branch with `build: true`, which builds and deploys the bundle
      # together — pushing a branch bundle to `:latest` on its own breaks the
      # running staging, whose spec still routes the old paths.
      refuse-off-main: true
