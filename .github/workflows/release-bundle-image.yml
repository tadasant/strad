name: Release bundle image

# Build THE strad bundle image — all eighteen MCP servers in one container — and
# push it to ghcr.
#
# It does not deploy. The next `deploy-staging.yml` run resolves the newest
# `sha-<commit>` bundle an ancestor published, and — because this build is slower
# than the core release that calls that deploy — waits for this one to land
# (`--wait-for-image`). See "which image a deploy ships" in
# docs/operate/operations.md.
#
# BUILD CONTEXT IS THE REPO ROOT. This image is assembled from eleven projects that
# live in different directories (servers/bundle-api, images/bundle-google,
# servers/onepassword, servers/remote-filesystem, servers/pulse-subregistry,
# servers/{good-eggs,fetchpet,pointsyeah,x-twitter,telegram}),
# each built in its
# own stage with its own lockfile. So `paths:` below has to watch all of them: a
# change to any one of those servers changes this image.
#
# The per-server images (release-bundle-api-image.yml, release-goodeggs-image.yml,
# …) are deliberately NOT deleted. Production still runs them — its config lives
# in tadasant-internal and still points at ghcr.io/tadasant/strad-server-*:latest —
# and it is re-pointed at this bundle in a follow-up. Deleting them now would mean
# the next `main` push silently changes what production pulls. See HACKS.md #23.

on:
  push:
    branches:
      - main
    paths:
      # ONE ENTRY PER TREE THE DOCKERFILE BUILDS. `servers/secrets/**` was
      # missing, and the way that fails is the worst available: a change to the
      # secrets MCP client lands on `main`, cuts no image, and the bundle keeps
      # serving the old code — so the fix is merged, believed shipped, and not
      # running. That is how a secret-value encoding fix would have reached
      # `main` while `/mcp` carried on writing unencoded values.
      # Cross-check against `COPY --from=build-*` in servers/bundle/Dockerfile.
      - "servers/bundle/**"
      - "servers/bundle-api/**"
      - "servers/onepassword/**"
      - "servers/secrets/**"
      - "servers/remote-filesystem/**"
      - "servers/good-eggs/**"
      - "servers/fetchpet/**"
      - "servers/pointsyeah/**"
      - "servers/x-twitter/**"
      - "servers/pulse-subregistry/**"
      - "servers/telegram/**"
      - "images/bundle-google/**"
      - ".github/workflows/release-bundle-image.yml"
  workflow_dispatch:

concurrency:
  group: release-bundle-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Refuse to release from anything but main
        # This pushes `strad-bundle:latest`, which live staging tracks. A branch
        # bundle belongs on a branch-scoped tag: dispatch deploy-staging.yml on
        # the branch with `build: true`, which builds and deploys the bundle
        # together — pushing a branch bundle to `:latest` on its own breaks the
        # running staging, whose spec still routes the old paths.
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release-bundle-image only runs on main (got ${GITHUB_REF}). Use deploy-staging.yml with build:true to test a branch."
          exit 1

      - uses: actions/checkout@v4

      # This job's ghcr credential goes somewhere no concurrent job can rewrite
      # or log out of. Before the login AND before buildx, which keeps its
      # builder metadata in the same directory. HACKS.md #57.
      - uses: ./.github/actions/docker-config

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Job-scoped: on this self-hosted box every job runs as the same user, so
      # `docker buildx create --use` writes ONE `~/.docker/buildx/current` and a
      # build with no `--builder` resolves whichever job created a builder most
      # recently — then dies when that job removes it. HACKS.md #53.
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          use: false

      - name: Build and push
        uses: ./.github/actions/build-push
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: servers/bundle/Dockerfile
          tags: |
            ghcr.io/tadasant/strad-bundle:latest
            ghcr.io/tadasant/strad-bundle:sha-${{ github.sha }}
          cache-from: type=gha,scope=bundle
          cache-to: type=gha,mode=max,scope=bundle
