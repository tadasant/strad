name: bundle-google CI

# The bundle-google supplementary image is a deliverable in its own right, so a
# PR that cannot build and boot it is a failing PR. Scoped to its own directory
# so it only runs when that image actually changes.

on:
  pull_request:
    branches: [main]
    paths:
      - "images/bundle-google/**"
      - ".github/workflows/bundle-google-ci.yml"
  push:
    branches: [main]
    paths:
      - "images/bundle-google/**"
      - ".github/workflows/bundle-google-ci.yml"

# Declared for the reason `ci.yml` gives: this workflow is reachable from a pull
# request, and an undeclared token is whatever the repository default happens to
# be rather than what this file asked for.
permissions:
  contents: read

concurrency:
  group: bundle-google-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE CODE IN THIS IMAGE THAT STRAD WROTE, which is the code whose bugs would be
  # silent. Three suites, and none is in a vendored tree:
  #
  #   - `vendor/google-sheets-shared/test/` — a server strad authored rather
  #     than vendored. Its A1 arithmetic decides which cell a write lands in,
  #     and a credential-free smoke test never addresses a cell. Plus the tier
  #     lists a read-only slug's `tools: allow:` is copied from in another
  #     repository.
  #   - `vendor/google-drive-shared/test/` — the other one. What each Drive
  #     request sends, including the multipart upload a create is.
  #   - `test/` — `src/gmail.ts` and `src/docs.ts`, strad's per-account layers
  #     over the gmail and google-docs trees. They decide which account a mount
  #     reads, and getting that wrong is a mount that serves the wrong account
  #     while looking healthy. A smoke test counts tools and would never see it.
  unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: images/bundle-google
        run: npm ci
      - name: Test (build + the google-sheets, gmail and google-docs suites)
        working-directory: images/bundle-google
        run: npm test

  build_and_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The concurrency group above is per-REF, so two PRs run this job at the same
    # time. On a hosted runner each gets its own VM; on a shared runner they get
    # one box and one docker daemon, and the per-run identifiers below are kept
    # so this job stays correct there too. A fixed container name collides
    # loudly there; a fixed image TAG does not, and that is the failure worth
    # naming: a concurrent job rebuilding `strad-server-bundle-google:ci` between
    # this job's build and its `docker run` leaves the smoke test asserting three
    # mounts of an image this PR never built, green. Per-run identifiers make both
    # impossible, and let the `if: always()` teardown name only this job's
    # container instead of whichever one currently holds the shared name.
    #
    # Their one cost is the fixed names' accidental garbage collection: a leaked
    # `bundle-google-ci` was reaped by the next run that wanted that name, and
    # nothing will ever want `bundle-google-ci-<run>`. Hence the sweep step, and
    # the `strad-ci` label everything below carries so the sweep can find it.
    #
    # The class has a third failure this job does not have: two jobs competing
    # for one fixed `-p 8080:8080`. Nothing here publishes a host port, because
    # everything it asserts runs inside the container.
    env:
      BUNDLE_GOOGLE_IMAGE: strad-server-bundle-google:ci-${{ github.run_id }}-${{ github.run_attempt }}
      BUNDLE_GOOGLE_CONTAINER: bundle-google-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      # The builder is a shared name too. On a shared runner every job runs as the
      # same user, so `docker buildx create --use` writes ONE
      # `~/.docker/buildx/current`, and a build with no `--builder` resolves
      # whichever job created a builder most recently — then dies with
      # `graceful_stop` when that job's teardown removes it. `use: false` never
      # writes the pointer; the explicit `builder:` below never reads it.
      # HACKS.md #53.
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          use: false

      # Per-run names never collide, so nothing else will ever clean one up. A day
      # is far longer than any run here, so nothing below can reach a concurrent
      # job's container — only what a run from yesterday left behind.
      #
      # `docker container prune` reaps STOPPED containers only, and the leak this
      # step exists for — a teardown that never ran because the runner was killed
      # mid-job — leaves one RUNNING. That container also holds a reference to its
      # image, so the image prune cannot reclaim that either. So the running ones
      # are swept first, by hand: `docker ps` has no `until` filter, hence the
      # explicit age check.
      - name: Sweep what earlier runs leaked
        run: |
          cutoff=$(( $(date +%s) - 86400 ))
          for id in $(docker ps -q --filter label=strad-ci || true); do
            created=$(docker inspect -f '{{.Created}}' "$id" 2>/dev/null) || continue
            started=$(date -d "$created" +%s 2>/dev/null) || continue
            if [ "$started" -lt "$cutoff" ]; then
              echo "sweeping leaked container $id (started $created)"
              docker rm -f "$id" || true
            fi
          done
          docker container prune -f --filter label=strad-ci --filter until=24h || true
          docker image prune -af --filter label=strad-ci --filter until=24h || true

      # Through the release path's own `.github/actions/build-push`, with
      # `push: false`. Every image build in this repo goes through that wrapper,
      # pushing or not, so the one action the release path cannot afford to have
      # broken is exercised by everything that builds — see the note on
      # `ci.yml`'s `bundle_image`. This workflow logs in to no registry, and the
      # wrapper refuses to push from a `pull_request` run regardless.
      - name: Build image
        uses: ./.github/actions/build-push
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: images/bundle-google
          push: "false"
          load: "true"
          tags: ${{ env.BUNDLE_GOOGLE_IMAGE }}
          labels: strad-ci=1
          cache-from: type=gha,scope=bundle-google
          cache-to: type=gha,mode=max,scope=bundle-google

      - name: Boot the image and smoke-test all four servers
        # Credential-free contract: with NO Google secrets set, every server must
        # still boot, handshake over Streamable HTTP, and enumerate its tools.
        # Everything runs INSIDE the container (node is there; curl is not, and no
        # host port publishing is needed): the health probe uses node's fetch and
        # the baked-in smoke test connects a real MCP client to all four paths.
        run: |
          set -euo pipefail
          echo "image=$BUNDLE_GOOGLE_IMAGE container=$BUNDLE_GOOGLE_CONTAINER"
          docker run -d --name "$BUNDLE_GOOGLE_CONTAINER" --label strad-ci=1 "$BUNDLE_GOOGLE_IMAGE"

          probe='fetch("http://127.0.0.1:8080/healthz").then(r=>{if(!r.ok)process.exit(1);return r.text()}).then(t=>{console.log(t)}).catch(()=>process.exit(1))'
          for _ in $(seq 1 30); do
            if docker exec "$BUNDLE_GOOGLE_CONTAINER" node -e "$probe"; then break; fi
            sleep 1
          done

          echo "--- smoke: list tools on /gmail, /google-calendar, /google-docs, /google-sheets"
          docker exec "$BUNDLE_GOOGLE_CONTAINER" node scripts/smoke.mjs

      # Names only this run's container and image, so it cannot reap a concurrent
      # job's. Deleting the image matters too: per-run tags would otherwise pile up
      # one per CI run on any runner box that outlives the job. buildx's cache is
      # not the daemon's image store, so nothing rebuilds slower for this.
      - name: Tear down
        if: always()
        run: |
          docker rm -f "$BUNDLE_GOOGLE_CONTAINER" 2>/dev/null || true
          docker rmi -f "$BUNDLE_GOOGLE_IMAGE" 2>/dev/null || true
