name: Release bundle-api image

# Build the bundle-api supplementary MCP server image — six pure-API MCP servers in one image — and push it to ghcr.
#
# The build itself is `release-supplementary-image.yml`, which every
# supplementary image release shares. This file is the half that is genuinely
# per-server: which tree cuts an image, and which package it lands in.

on:
  push:
    branches:
      - main
    paths:
      - "servers/bundle-api/**"
      - ".github/workflows/release-bundle-api-image.yml"
      # A change to the shared body has to be exercised by a real release, or
      # its first execution is on whatever unrelated commit next touches this
      # tree. See test/workflow-release-callers.test.ts.
      - ".github/workflows/release-supplementary-image.yml"
  workflow_dispatch:

concurrency:
  group: release-bundle-api-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # No `secrets: inherit`: the shared body needs only GITHUB_TOKEN, which a
    # called workflow is handed automatically. Inheriting would put every
    # credential this repo holds in reach of a build that wants none of them.
    uses: ./.github/workflows/release-supplementary-image.yml
    permissions:
      contents: read
      packages: write
    with:
      context: servers/bundle-api
      image: ghcr.io/tadasant/strad-bundle-api
