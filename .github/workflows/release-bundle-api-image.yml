name: Release bundle-api image

# Build the bundle-api supplementary MCP server image and push it to ghcr, from
# servers/bundle-api. This is SEPARATE from the strad core image
# (release-image.yml): bundle-api is a `supplementary-image` bundle — its own
# container, published to its own package, run as an internal-only App Platform
# component. It bundles six pure-API MCP servers in one image.
#
# Pushing needs no PAT: the built-in GITHUB_TOKEN can write packages owned by
# this repo. PULLING (by App Platform) is the durable-credential half — the
# package must be visible to the GHCR_PULL_TOKEN used in deploy-staging.yml, or
# made public. See HACKS.md.

on:
  push:
    branches:
      - main
    paths:
      - "servers/bundle-api/**"
      - ".github/workflows/release-bundle-api-image.yml"
  workflow_dispatch:

concurrency:
  group: release-bundle-api-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: servers/bundle-api
          push: true
          tags: |
            ghcr.io/tadasant/strad-bundle-api:latest
            ghcr.io/tadasant/strad-bundle-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
