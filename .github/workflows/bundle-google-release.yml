name: Release bundle-google image

# Build the bundle-google supplementary image and push it to ghcr. Deploying it
# (as an internal component behind strad) happens downstream, in tadasant-internal
# with real Google credentials — this workflow only publishes the credential-free
# image.
#
# Versioning mirrors release-image.yml (zimmer's scheme): the committed
# images/bundle-google/VERSION is the MANUAL floor; the effective patch is
# BASE_PATCH + commits since that file last changed.
#
# Pushing needs no PAT: the built-in GITHUB_TOKEN can write packages owned by
# this repo (permissions: packages: write).

on:
  push:
    branches: [main]
    paths:
      - "images/bundle-google/**"
      - ".github/workflows/bundle-google-release.yml"
  workflow_dispatch:

concurrency:
  group: release-bundle-google
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to count commits since VERSION changed

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          BASE=$(tr -d '[:space:]' < images/bundle-google/VERSION)
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          BASE_PATCH=$(echo "$BASE" | cut -d. -f3)
          VERSION_SHA=$(git log -1 --format=%H -- images/bundle-google/VERSION)
          OFFSET=$(git rev-list --count "${VERSION_SHA}..HEAD")
          PATCH=$((BASE_PATCH + OFFSET))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved image version: ${VERSION} (floor ${BASE}, +${OFFSET} commits)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Job-scoped: on this self-hosted box every job runs as the same user, so
      # `docker buildx create --use` writes ONE `~/.docker/buildx/current` and a
      # build with no `--builder` resolves whichever job created a builder most
      # recently — then dies when that job removes it. HACKS.md #53.
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          use: false

      - name: Build and push
        uses: ./.github/actions/build-push
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: images/bundle-google
          build-args: |
            BUNDLE_GOOGLE_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/tadasant/strad-server-bundle-google:${{ steps.version.outputs.version }}
            ghcr.io/tadasant/strad-server-bundle-google:latest
            ghcr.io/tadasant/strad-server-bundle-google:sha-${{ github.sha }}
          cache-from: type=gha,scope=bundle-google
          cache-to: type=gha,mode=max,scope=bundle-google
