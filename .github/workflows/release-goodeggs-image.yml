name: Release good-eggs image

# Build the Good Eggs supplementary MCP server image and push it to ghcr, from
# servers/good-eggs. This is SEPARATE from the strad core image (release-image.yml):
# good-eggs is a `supplementary-image` bundle — its own container, published to
# its own package, run as an internal-only App Platform component.
#
# Pushing needs no PAT: the built-in GITHUB_TOKEN can write packages owned by
# this repo. PULLING (by App Platform) is the durable-credential half — the
# package must be visible to the GHCR_PULL_TOKEN used in deploy-staging.yml, or
# made public. See HACKS.md.

on:
  push:
    branches:
      - main
    paths:
      - "servers/good-eggs/**"
      - ".github/workflows/release-goodeggs-image.yml"
  workflow_dispatch:

concurrency:
  group: release-goodeggs-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: ./.github/actions/build-push
        with:
          context: servers/good-eggs
          tags: |
            ghcr.io/tadasant/strad-server-good-eggs:latest
            ghcr.io/tadasant/strad-server-good-eggs:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
