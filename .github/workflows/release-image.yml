name: Release image

# Build the strad image and push it to ghcr, then roll staging onto it.
#
# Versioning (deterministic, no commit-back) — zimmer's scheme:
#   - The committed VERSION file is the MANUAL floor, e.g. "0.1.0".
#   - Effective version = MAJOR.MINOR.(BASE_PATCH + commits_since_VERSION_changed).
#   - To cut a MINOR/MAJOR bump, edit VERSION in a PR. That commit touches
#     VERSION, so the offset resets and the next image is exactly what you wrote;
#     subsequent commits auto-bump the patch.
#
# Pushing needs no PAT: the built-in GITHUB_TOKEN can write packages owned by
# this repo. PULLING is the part that needs a durable credential — see
# deploy-staging.yml, which hands App Platform a GHCR_PULL_TOKEN. GITHUB_TOKEN
# would be useless there: it dies with the job, and App Platform re-pulls the
# image on every restart and scale event.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: release-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to count commits since VERSION changed

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          BASE=$(tr -d '[:space:]' < VERSION)
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          BASE_PATCH=$(echo "$BASE" | cut -d. -f3)
          VERSION_SHA=$(git log -1 --format=%H -- VERSION)
          OFFSET=$(git rev-list --count "${VERSION_SHA}..HEAD")
          PATCH=$((BASE_PATCH + OFFSET))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved image version: ${VERSION} (floor ${BASE}, +${OFFSET} commits)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tadasant/strad:${{ steps.version.outputs.version }}
            ghcr.io/tadasant/strad:latest
            ghcr.io/tadasant/strad:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify tadasant-internal that a new image exists
        # A no-op until the dispatch token is set, and a warning (never a
        # failure) if the call is rejected: tadasant-internal polls on its own
        # schedule, so the worst case is prod finds out a few minutes later. The
        # release has already succeeded here; a notification must not undo it.
        env:
          DISPATCH_TOKEN: ${{ secrets.GH_STRAD_SYNC_TOKEN_TADASANT_INTERNAL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "GH_STRAD_SYNC_TOKEN_TADASANT_INTERNAL not set; skipping cross-repo dispatch."
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tadasant/tadasant-internal/dispatches \
            -d "{\"event_type\":\"strad-image-published\",\"client_payload\":{\"version\":\"${VERSION}\",\"sha\":\"${GITHUB_SHA}\"}}") || true
          if [ "$code" = "204" ]; then
            echo "Dispatched strad-image-published (version ${VERSION})."
          else
            echo "::warning::repository_dispatch returned HTTP ${code}; prod catches up on its own schedule."
            cat /tmp/dispatch.out 2>/dev/null || true
          fi

  deploy-staging:
    # Staging tracks whatever image we just cut. Prod is a separate, deliberate
    # act, and it lives in tadasant-internal with a different DO token.
    needs: build-and-push
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit
    with:
      version: ${{ needs.build-and-push.outputs.version }}
