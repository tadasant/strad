name: Release image

# Build the strad image and push it to ghcr, then roll staging onto it.
#
# Versioning (deterministic, no commit-back) — zimmer's scheme:
#   - The committed VERSION file is the MANUAL floor, e.g. "0.1.0".
#   - Effective version = MAJOR.MINOR.(BASE_PATCH + commits_since_VERSION_changed).
#   - To cut a MINOR/MAJOR bump, edit VERSION in a PR. That commit touches
#     VERSION, so the offset resets and the next image is exactly what you wrote;
#     subsequent commits auto-bump the patch.
#
# Pushing needs no PAT: the built-in GITHUB_TOKEN can write packages owned by
# this repo. PULLING is the part that needs a durable credential — see
# deploy-staging.yml, which hands App Platform a GHCR_PULL_TOKEN. GITHUB_TOKEN
# would be useless there: it dies with the job, and App Platform re-pulls the
# image on every restart and scale event.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: release-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to count commits since VERSION changed

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          BASE=$(tr -d '[:space:]' < VERSION)
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          BASE_PATCH=$(echo "$BASE" | cut -d. -f3)
          VERSION_SHA=$(git log -1 --format=%H -- VERSION)
          OFFSET=$(git rev-list --count "${VERSION_SHA}..HEAD")
          PATCH=$((BASE_PATCH + OFFSET))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved image version: ${VERSION} (floor ${BASE}, +${OFFSET} commits)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tadasant/strad:${{ steps.version.outputs.version }}
            ghcr.io/tadasant/strad:latest
            ghcr.io/tadasant/strad:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the three tags resolve to one digest
        # `:latest` is a MUTABLE tag and staging deploys it by default, so a
        # `:latest` that has drifted off the commit we just built is an outage
        # waiting for the next App Platform restart — the container boots old
        # code against new config and rolls back. The push above claims to write
        # all three tags from one digest; this step goes back to the registry and
        # checks that it did, and that nothing else has since moved them.
        #
        # A build that pushed successfully but left `:latest` pointing elsewhere
        # is a FAILED release: better a red run here than a silent rollback in
        # staging hours later.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILT: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Assert the SHAPE of the expected digest before trusting it. An empty
          # BUILT (an action upgrade renames the output, a `push: false`
          # regression) would compare equal to an empty unresolvable tag, and the
          # one check this step exists to make would pass while verifying nothing.
          case "${BUILT:-}" in
            sha256:*) ;;
            *) echo "::error::the build step produced no image digest ('${BUILT:-}')"; exit 1 ;;
          esac
          # Credentials go in through curl's stdin config, never argv: this is a
          # shared self-hosted runner and argv is readable by anything that can
          # run `ps`. `|| true` keeps `set -e` from killing the step before the
          # diagnostic below can say what actually went wrong.
          TOKEN=$(printf 'user = "%s:%s"\n' "$ACTOR" "$GH_TOKEN" \
            | curl -sS -K - "https://ghcr.io/token?service=ghcr.io&scope=repository:tadasant/strad:pull" 2>/dev/null \
            | jq -r '.token // empty' || true)
          if [ -z "$TOKEN" ]; then
            echo "::error::could not obtain a ghcr pull token to verify the tags"
            exit 1
          fi
          ACCEPT='application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json'
          # Retries because this runs immediately after the push: GHCR gives no
          # read-after-write guarantee, and a single CDN blip must not turn a
          # good release red. Returns an empty digest once the attempts are spent,
          # which the caller reports as a mismatch.
          resolve() {
            for attempt in 1 2 3; do
              got=$(curl -sS -I -H "Authorization: Bearer $TOKEN" -H "Accept: $ACCEPT" \
                "https://ghcr.io/v2/tadasant/strad/manifests/$1" 2>/dev/null \
                | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}' || true)
              case "$got" in sha256:*) printf '%s' "$got"; return 0 ;; esac
              sleep "$attempt"
            done
            printf ''
          }
          echo "built digest: ${BUILT}"
          bad=0
          for tag in "$VERSION" latest "sha-${SHA}"; do
            got=$(resolve "$tag")
            echo "  ${tag} -> ${got:-<unresolved>}"
            if [ -z "$got" ]; then
              echo "::error::tag ${tag} did not resolve (no Docker-Content-Digest after 3 attempts)"
              bad=1
            elif [ "$got" != "$BUILT" ]; then
              echo "::error::tag ${tag} resolves to ${got}, expected ${BUILT}"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "OK: :${VERSION}, :latest and :sha-${SHA} all resolve to ${BUILT}."

      - name: Notify tadasant-internal that a new image exists
        # A no-op until the dispatch token is set, and a warning (never a
        # failure) if the call is rejected: tadasant-internal polls on its own
        # schedule, so the worst case is prod finds out a few minutes later. The
        # release has already succeeded here; a notification must not undo it.
        env:
          DISPATCH_TOKEN: ${{ secrets.GH_STRAD_SYNC_TOKEN_TADASANT_INTERNAL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "GH_STRAD_SYNC_TOKEN_TADASANT_INTERNAL not set; skipping cross-repo dispatch."
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tadasant/tadasant-internal/dispatches \
            -d "{\"event_type\":\"strad-image-published\",\"client_payload\":{\"version\":\"${VERSION}\",\"sha\":\"${GITHUB_SHA}\"}}") || true
          if [ "$code" = "204" ]; then
            echo "Dispatched strad-image-published (version ${VERSION})."
          else
            echo "::warning::repository_dispatch returned HTTP ${code}; prod catches up on its own schedule."
            cat /tmp/dispatch.out 2>/dev/null || true
          fi

  deploy-staging:
    # Staging tracks whatever image we just cut. Prod is a separate, deliberate
    # act, and it lives in tadasant-internal with a different DO token.
    needs: build-and-push
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit
    with:
      version: ${{ needs.build-and-push.outputs.version }}
