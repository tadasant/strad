name: Release onepassword image

# Build the 1Password supplementary MCP server image and push it to ghcr, from
# servers/onepassword. This is SEPARATE from the strad core image
# (release-image.yml): onepassword is a `supplementary-image` bundle — its own
# container, published to its own package, run as an internal-only App Platform
# component.
#
# The defining feature of this image is the baked-in, PINNED 1Password CLI
# (`op`). The build itself asserts `op --version` (see the Dockerfile), and the
# "Verify op CLI" step below re-proves it against the built artifact so a broken
# `op` install can never be published.
#
# Pushing needs no PAT: the built-in GITHUB_TOKEN can write packages owned by
# this repo. PULLING (by App Platform) is the durable-credential half — the
# package must be visible to the GHCR_PULL_TOKEN used in deploy-staging.yml, or
# made public. See HACKS.md.

on:
  push:
    branches:
      - main
    paths:
      - "servers/onepassword/**"
      - ".github/workflows/release-onepassword-image.yml"
  workflow_dispatch:

concurrency:
  group: release-onepassword-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    # The verification image below is built on a docker daemon the whole box
    # shares — `runs-on: self-hosted`, one daemon, every concurrent job. A fixed
    # `strad-server-onepassword:ci` is a name any of them can claim, and the
    # window between this job's build and its `docker run` is unguarded: a
    # concurrent rebuild in that window moves the `op --version` assertion onto
    # an image this run never built, and it PASSES — both images came from the
    # same Dockerfile, so nothing errors and the release publishes having
    # verified someone else's artifact. A per-run tag makes that impossible, and
    # lets the `if: always()` teardown name only this run's image.
    #
    # Its one cost is the fixed name's accidental garbage collection: a leaked
    # `strad-server-onepassword:ci` was reclaimed by the next run that wanted
    # that name, and nothing will ever want `…:ci-<run>`. Hence the sweep step,
    # and the `strad-ci` label everything below carries so the sweep can find it.
    #
    # This is the verification image ONLY. The published tags in `Build and push`
    # are the release and stay exactly what App Platform pulls.
    env:
      ONEPASSWORD_IMAGE: strad-server-onepassword:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      # This job's ghcr credential goes somewhere no concurrent job can rewrite
      # or log out of. Before the login AND before buildx, which keeps its
      # builder metadata in the same directory. HACKS.md #57.
      - uses: ./.github/actions/docker-config

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Job-scoped: on this self-hosted box every job runs as the same user, so
      # `docker buildx create --use` writes ONE `~/.docker/buildx/current` and a
      # build with no `--builder` resolves whichever job created a builder most
      # recently — then dies when that job removes it. HACKS.md #53.
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          use: false

      # Per-run names never collide, so nothing else will ever clean one up. A day
      # is far longer than any run here, so nothing below can reach a concurrent
      # job's container — only what a run from yesterday left behind.
      #
      # `docker container prune` reaps STOPPED containers only, and the leak this
      # step exists for — a teardown that never ran because the runner was killed
      # mid-job — leaves one RUNNING. That container also holds a reference to its
      # image, so the image prune cannot reclaim that either. So the running ones
      # are swept first, by hand: `docker ps` has no `until` filter, hence the
      # explicit age check.
      - name: Sweep what earlier runs leaked
        run: |
          cutoff=$(( $(date +%s) - 86400 ))
          for id in $(docker ps -q --filter label=strad-ci || true); do
            created=$(docker inspect -f '{{.Created}}' "$id" 2>/dev/null) || continue
            started=$(date -d "$created" +%s 2>/dev/null) || continue
            if [ "$started" -lt "$cutoff" ]; then
              echo "sweeping leaked container $id (started $created)"
              docker rm -f "$id" || true
            fi
          done
          docker container prune -f --filter label=strad-ci --filter until=24h || true
          docker image prune -af --filter label=strad-ci --filter until=24h || true

      # Build once and LOAD locally so we can run the image before publishing.
      # Through the same wrapper as the publish below — every image build in this
      # repo goes through it, pushing or not — with the push half turned off.
      - name: Build (load) for verification
        uses: ./.github/actions/build-push
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: servers/onepassword
          push: "false"
          load: "true"
          tags: ${{ env.ONEPASSWORD_IMAGE }}
          labels: strad-ci=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the op CLI is baked in
        # The whole point of this bundle: `op` is present, on PATH, and the
        # PINNED version. Assert it against the real artifact, not the source —
        # the expected version is read straight from the Dockerfile so this can
        # never drift from what was built.
        run: |
          set -euo pipefail
          echo "image=$ONEPASSWORD_IMAGE"
          EXPECTED=$(grep -oP 'ARG OP_VERSION=\K[0-9.]+' servers/onepassword/Dockerfile)
          echo "Expected op version (from Dockerfile): $EXPECTED"
          GOT=$(docker run --rm --label strad-ci=1 "$ONEPASSWORD_IMAGE" op --version)
          echo "op --version => $GOT"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::expected op $EXPECTED, got $GOT"
            exit 1
          fi
          WHERE=$(docker run --rm --label strad-ci=1 "$ONEPASSWORD_IMAGE" sh -c 'command -v op')
          echo "op resolves to: $WHERE"
          echo "OK: op $GOT is baked in at $WHERE"

      # Publish. Reuses the gha cache from the build above, so this is fast.
      - name: Build and push
        uses: ./.github/actions/build-push
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: servers/onepassword
          tags: |
            ghcr.io/tadasant/strad-server-onepassword:latest
            ghcr.io/tadasant/strad-server-onepassword:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Last, and `always()`, so a failed verification still cleans up after
      # itself. Names only this run's image, so it cannot delete one a concurrent
      # job is still verifying. Deleting it matters: per-run tags would otherwise
      # pile up one per run on a runner box that never goes away. buildx's cache
      # is not the daemon's image store, so nothing rebuilds slower for this.
      - name: Tear down the verification image
        if: always()
        run: |
          docker rmi -f "$ONEPASSWORD_IMAGE" 2>/dev/null || true
