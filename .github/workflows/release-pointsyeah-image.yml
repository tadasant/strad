name: Release pointsyeah image

# Build the PointsYeah supplementary MCP server image and push it to ghcr, from
# servers/pointsyeah. This is SEPARATE from the strad core image (release-image.yml)
# and from the other supplementary images: pointsyeah is a `supplementary-image`
# bundle — its own container, published to its own package, run as an
# internal-only App Platform component.
#
# Pushing needs no PAT: the built-in GITHUB_TOKEN can write packages owned by
# this repo. PULLING (by App Platform) is the durable-credential half — the
# package must be visible to the GHCR_PULL_TOKEN used in deploy-staging.yml, or
# made public. See HACKS.md.

on:
  push:
    branches:
      - main
    paths:
      - "servers/pointsyeah/**"
      - ".github/workflows/release-pointsyeah-image.yml"
  workflow_dispatch:

concurrency:
  group: release-pointsyeah-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Job-scoped: on this self-hosted box every job runs as the same user, so
      # `docker buildx create --use` writes ONE `~/.docker/buildx/current` and a
      # build with no `--builder` resolves whichever job created a builder most
      # recently — then dies when that job removes it. HACKS.md #53.
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          use: false

      - name: Build and push
        uses: ./.github/actions/build-push
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: servers/pointsyeah
          tags: |
            ghcr.io/tadasant/strad-server-pointsyeah:latest
            ghcr.io/tadasant/strad-server-pointsyeah:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
