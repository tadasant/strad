name: Secrets sync (staging)

# Create/update the strad-staging-* secrets in GCP Secret Manager.
#
# WHY A WORKFLOW: an agent/laptop cannot read GitHub Actions secrets — only a
# workflow runs with them in scope. So GCP_SA_KEY authenticates here, inside CI,
# and never touches anyone's terminal. This is the intended pattern.
#
# It creates a secret if missing, adds a new version if present — and then
# DESTROYS every other version of the secret it just wrote, enabled or disabled,
# so each secret carries exactly one live version: the one this run added.
# Secret Manager bills every version that is not DESTROYED (disabled ones
# included), and nothing else ever cleans up a superseded one (issue #240).
# What is destroyed: superseded versions of a secret this run successfully
# added a version to. What never is: a secret itself, the version just added,
# or anything on a secret whose `versions add` failed. Every consumer reads
# `versions/latest`, so nothing points at a superseded version.
# Run it once to seed staging, and again whenever a value changes.
#
# If a prune fails after its add succeeded, the new value IS live (deploys read
# `latest`) and the run continues with the remaining secrets, then fails at the
# end naming the secrets whose superseded versions remain — so the next run, or
# a hand-run `gcloud secrets versions destroy`, can finish the job. Destroying
# needs `secretmanager.versions.destroy` on the service account behind
# GCP_SA_KEY (`roles/secretmanager.admin` or `secretVersionManager` carry it;
# `secretVersionAdder` does not).
#
#   gh workflow run secrets-sync.yml \
#     -f strad_tokens='<STRAD_TOKENS json>' \
#     -f admin_bootstrap_token='<token>' \
#     [-f internal_token='<token>']   # generated if omitted
#
# STRAD_TOKENS is a JSON array of token RECORDS (hash only, never plaintext) —
# `strad token mint` prints exactly this. Plaintext tokens are shown once at mint
# time and are never stored here or anywhere else.

on:
  workflow_dispatch:
    inputs:
      strad_tokens:
        description: STRAD_TOKENS — JSON array of token records (hash only)
        type: string
        required: true
      admin_bootstrap_token:
        description: ADMIN_BOOTSTRAP_TOKEN for the console dev bypass
        type: string
        required: true
      internal_token:
        description: STRAD_INTERNAL_TOKEN (core<->bundle). Generated if blank.
        type: string
        required: false
      goodeggs_email:
        description: GOODEGGS_EMAIL — Good Eggs account for the good-eggs bundle.
        type: string
        required: false
      goodeggs_password:
        description: GOODEGGS_PASSWORD — Good Eggs account password.
        type: string
        required: false

permissions:
  contents: read

# One sync at a time. Two overlapping runs would each add a version and then
# each destroy the other's — the guards in prune() refuse that shape, but the
# group is what makes it not arise.
concurrency:
  group: secrets-sync-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: self-hosted
    environment: staging
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upsert strad-staging-* secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          STRAD_TOKENS: ${{ inputs.strad_tokens }}
          ADMIN_BOOTSTRAP_TOKEN: ${{ inputs.admin_bootstrap_token }}
          INTERNAL_TOKEN_IN: ${{ inputs.internal_token }}
          GOODEGGS_EMAIL: ${{ inputs.goodeggs_email }}
          GOODEGGS_PASSWORD: ${{ inputs.goodeggs_password }}
        run: |
          set -euo pipefail

          # Secrets whose superseded versions could not all be destroyed. Their
          # new value is live regardless; the run fails at the end naming them.
          PRUNE_FAILED=""

          # Destroy every version of secret $1 except $2, the resource name
          # `versions add` just returned. Prints version numbers and states,
          # never a value. Refuses to destroy anything unless the version it is
          # keeping is visibly ENABLED in the listing, and never destroys a
          # version numbered above it — numbers are monotonic, so a higher one
          # is another writer's `latest`. A wrong selection here would destroy
          # `latest`, and the next deploy would render without it.
          prune() {
            local name="$1" added="$2" keep listing version state
            keep="${added##*/}"
            case "$keep" in
              ''|*[!0-9]*)
                # Not echoed: whatever gcloud printed here is by definition not
                # what was expected, and stderr already has it.
                echo "::error::$name: 'versions add' printed ${#added} bytes that are not a version resource name; no version destroyed"
                PRUNE_FAILED="$PRUNE_FAILED $name"; return 0 ;;
            esac
            if ! listing=$(gcloud secrets versions list "$name" --project "$GCP_PROJECT_ID" \
                  --format='value(name.basename(),state)'); then
              echo "::error::$name: could not list versions; version $keep is live, no version destroyed"
              PRUNE_FAILED="$PRUNE_FAILED $name"; return 0
            fi
            local keep_state=""
            while IFS=$'\t' read -r version state; do
              [ "$version" = "$keep" ] && keep_state="$state"
            done <<< "$listing"
            if [ "$keep_state" != "ENABLED" ]; then
              echo "::error::$name: version $keep from 'versions add' is ${keep_state:-not in the listing}, not ENABLED; no version destroyed"
              PRUNE_FAILED="$PRUNE_FAILED $name"; return 0
            fi
            local destroyed=0 failed=0
            while IFS=$'\t' read -r version state; do
              [ -n "$version" ] || continue
              [ "$version" = "$keep" ] && continue
              [ "$state" = "DESTROYED" ] && continue
              case "$version" in
                *[!0-9]*)
                  failed=$((failed + 1))
                  echo "::error::$name: a listed version id is not a number; not destroyed"
                  continue ;;
              esac
              if [ "$version" -gt "$keep" ]; then
                failed=$((failed + 1))
                echo "::error::$name: version $version is newer than the $keep this run added — another writer is active; not destroyed"
                continue
              fi
              if gcloud secrets versions destroy "$version" --secret "$name" \
                   --project "$GCP_PROJECT_ID" --quiet >/dev/null; then
                destroyed=$((destroyed + 1))
                echo "destroyed $name version $version (was $state)"
              else
                failed=$((failed + 1))
                echo "::error::$name: could not destroy version $version (was $state); version $keep is live"
              fi
            done <<< "$listing"
            [ "$failed" -eq 0 ] || PRUNE_FAILED="$PRUNE_FAILED $name"
            echo "pruned $name: kept version $keep, destroyed $destroyed, failed $failed"
          }

          upsert() {
            local name="strad-staging-$1"; local value="$2"; local added
            if gcloud secrets describe "$name" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              # `set -e` + pipefail: an add that fails ends the run here, before
              # prune — nothing is destroyed on a secret whose add did not land.
              added=$(printf '%s' "$value" | gcloud secrets versions add "$name" \
                --project "$GCP_PROJECT_ID" --data-file=- --format='value(name)')
              echo "updated $name"
              prune "$name" "$added"
            else
              # A fresh secret has exactly one version; nothing to prune.
              printf '%s' "$value" | gcloud secrets create "$name" \
                --project "$GCP_PROJECT_ID" --replication-policy=automatic \
                --data-file=- >/dev/null
              echo "created $name"
            fi
          }

          INTERNAL_TOKEN="${INTERNAL_TOKEN_IN:-}"
          if [ -z "$INTERNAL_TOKEN" ]; then
            INTERNAL_TOKEN=$(openssl rand -hex 24)
            echo "::add-mask::$INTERNAL_TOKEN"
            echo "generated a fresh STRAD_INTERNAL_TOKEN"
          fi

          echo "::add-mask::$ADMIN_BOOTSTRAP_TOKEN"

          upsert STRAD_TOKENS         "$STRAD_TOKENS"
          upsert STRAD_INTERNAL_TOKEN "$INTERNAL_TOKEN"
          upsert ADMIN_BOOTSTRAP_TOKEN "$ADMIN_BOOTSTRAP_TOKEN"

          # Optional: the good-eggs supplementary bundle's credentials. Only
          # upserted when provided, so re-running without them leaves them intact.
          if [ -n "${GOODEGGS_EMAIL:-}" ]; then
            upsert GOODEGGS_EMAIL "$GOODEGGS_EMAIL"
          fi
          if [ -n "${GOODEGGS_PASSWORD:-}" ]; then
            echo "::add-mask::$GOODEGGS_PASSWORD"
            upsert GOODEGGS_PASSWORD "$GOODEGGS_PASSWORD"
          fi

          if [ -n "$PRUNE_FAILED" ]; then
            echo "::error::every value above is live, but superseded versions remain on:$PRUNE_FAILED — re-run this workflow with the same inputs, or destroy them by hand (gcloud secrets versions list / destroy)"
            exit 1
          fi
          echo "Done. deploy-staging.yml reads these on its next run."
