  # ---------------------------------------------------------------------------
  # 1Password — 9 tools full, 5 read-only. THE sharpest edge of this design.
  #
  # The read-only variant used to be locked TWICE: a read-only service-account
  # token (1Password itself refuses the write) AND a tool-group filter. One
  # container holds one token, and onepassword-rw needs the read-WRITE one — so
  # `onepassword-ro` is now read-only because the GATEWAY refuses the call, and
  # for no other reason. That is the trade this whole re-architecture makes,
  # concentrated into one server. HACKS.md #22 records it.
  #
  # The server refuses to serve without an elicitation posture; strad has no
  # elicitation transport wired yet, so it skips them explicitly.
  # ---------------------------------------------------------------------------
  - slug: onepassword-ro
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /onepassword
    entitlements: [admin]
    timeoutMs: 120000
    env:
      OP_SERVICE_ACCOUNT_TOKEN: "${OP_SERVICE_ACCOUNT_TOKEN_TADAS_RW}"
      DANGEROUSLY_SKIP_ELICITATIONS: "true"
    tools:
      allow:
        - onepassword_list_vaults
        - onepassword_list_items
        - onepassword_get_item
        - onepassword_get_item_metadata
        - onepassword_list_items_by_tag

  - slug: onepassword-rw
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /onepassword
    entitlements: [admin]
    timeoutMs: 120000
    env:
      OP_SERVICE_ACCOUNT_TOKEN: "${OP_SERVICE_ACCOUNT_TOKEN_TADAS_RW}"
      DANGEROUSLY_SKIP_ELICITATIONS: "true"
    # No `tools:` — all nine.

  # ---------------------------------------------------------------------------
  # Browser-driven servers. Each drives a real headless Chromium and logs into a
  # real account, so its tool calls can take a while — timeoutMs is set well above
  # the MCP SDK's silent 60s default, which would otherwise kill them mid-flow.
  #
  # They now share ONE Chromium (one browser process, a context each). Three
  # browsers on one shared vCPU was never going to work; one browser with three
  # contexts is ~1GB peak RSS and the isolation that matters (cookies, logins) is
  # per-context anyway.
  # ---------------------------------------------------------------------------
  - slug: good-eggs
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /good-eggs
    entitlements: [admin]
    timeoutMs: 120000
    env:
      GOODEGGS_EMAIL: "${GOODEGGS_EMAIL}"
      GOODEGGS_PASSWORD: "${GOODEGGS_PASSWORD}"

  - slug: fetchpet
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /fetchpet
    entitlements: [admin]
    timeoutMs: 180000
    env:
      FETCHPET_USERNAME: "${FETCHPET_USERNAME}"
      FETCHPET_PASSWORD: "${FETCHPET_PASSWORD}"

  - slug: pointsyeah
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /pointsyeah
    entitlements: [admin]
    timeoutMs: 180000
    env:
      POINTSYEAH_REFRESH_TOKEN: "${POINTSYEAH_REFRESH_TOKEN}"

  # ---------------------------------------------------------------------------
  # telegram — strad's own server, and the one that speaks MTProto as a PERSON.
  #
  # WHY NOT A BOT. The requirement is reading a group Tadas JOINED and does not
  # administer. The Bot API cannot: a bot gets no history from before it joined,
  # and a non-admin bot runs with privacy mode on, so it sees only the messages
  # that address it. MTProto with a user session is the only protocol that
  # answers it, which is why the credential below is a login and not a token.
  #
  # THE CREDENTIAL IS THE ACCOUNT. TELEGRAM_STRING_SESSION is a logged-in
  # Telegram session: anything Tadas can read or send, a holder of that string
  # can read or send, and it does not expire. It is revoked from a Telegram
  # client (Settings -> Devices), not from here.
  #
  # DISABLED UNTIL THE THREE SECRETS ARE SEEDED. A `${REF}` that GCP Secret
  # Manager does not hold FAILS the render — deliberately — so these two entries
  # ship `enabled: false` and the deploy carries on without them. To turn them
  # on: seed strad-staging-TELEGRAM_API_ID, -TELEGRAM_API_HASH and
  # -TELEGRAM_STRING_SESSION (secrets-sync.yml), then delete both `enabled`
  # lines. Nothing else changes; the mount is already in the image, and it is
  # already listed on /healthz as degraded until the values arrive.
  #
  # TWO SLUGS, ONE MOUNT, and the difference is the `tools:` policy — the same
  # shape as gmail-ro/gmail-rw. The read-only allow-list is the server's
  # `readonly` tool group, name for name; `telegram-rw` has no policy and so
  # gets send_message too.
  - slug: telegram-ro
    kind: supplementary-image
    title: Telegram (read-only)
    description: Read chats and group history as Tadas's own Telegram account.
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /telegram
    entitlements: [admin]
    enabled: false
    env:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_STRING_SESSION: "${TELEGRAM_STRING_SESSION}"
    tools:
      allow:
        - get_me
        - list_chats
        - get_chat
        - get_chat_history
        - search_messages

  # Sends as Tadas himself: a message from this slug is indistinguishable from
  # one he typed, and Telegram allows a delete for 48 hours and nothing after.
  # Same credentials, declared again — a family's variants each declare their
  # own, so disabling one cannot strip the secret from its sibling.
  - slug: telegram-rw
    kind: supplementary-image
    title: Telegram (read-write)
    description: Read chats and send messages as Tadas's own Telegram account.
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /telegram
    entitlements: [admin]
    enabled: false
    env:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_STRING_SESSION: "${TELEGRAM_STRING_SESSION}"
    # No `tools:` — all six, send_message included.
