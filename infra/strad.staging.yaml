# strad config for the staging deployment.
#
# CI reads this, renders it into a DigitalOcean App Platform spec (see
# src/deploy/appspec.ts) and injects the secret values from GCP Secret Manager
# (strad-staging-*). It exercises all four server kinds on purpose — staging
# that only proves the easy path is not proving much.
#
# This file is CREDENTIAL-FREE: every secret is a ${NAME} reference resolved at
# render time from GCP Secret Manager. A referenced ${NAME} that is not seeded
# FAILS the render, loudly, rather than deploying a half-authenticated gateway.
#
# ---------------------------------------------------------------------------
# CAPABILITY LIVES AT THE GATEWAY. THREE COMPONENTS, NOT THIRTEEN.
# ---------------------------------------------------------------------------
# This file declares thirty-five server SLUGS: thirty-two supplementary-image
# entries, the `echo` builtin in core, the `deepwiki` remote-http canary, and
# the `anki` local-tunnel, which ships disabled — see its entry below.
# Thirty-one of the thirty-two land on twenty upstream mounts inside the
# one bundle image, because capability variants share a mount; the thirty-second
# (`zimmer-secrets`) runs that same image on a component of its own. The image
# serves twenty-two mounts: `/x-twitter`, `/google-sheets` and `/grafana` are in
# it with no staging slug pointing at any of them — `grafana-registry` is served
# by a per-slug instance at `/grafana-registry`, not by the conventional mount.
#
# FOUR of the thirty-two carry `enabled: false` — telegram-ro, telegram-rw,
# pulse-subregistry and grafana-registry — because their credentials are not in
# the store yet.
# A `${NAME}` the store does not hold fails the RENDER, and the render is the
# whole spec, so an entry that ships enabled before its secret is seeded takes
# every other server's deploy down with it.
#
# THREE components, not two, and the third is not a capability variant: it is
# `bundle-zimmer-secrets`, a second copy of the bundle image fronting a SECOND
# parameter store. Capability is config; a STORE is `process.env`, and one
# container has one of those. See the bundles block below.
#
# It used to be twelve bundles for twenty-six slugs, and the reason was
# small and stupid: a server's capability was a CONTAINER env var
# (`GMAIL_ENABLED_TOOLGROUPS=readonly`). A component's env is the union of its
# servers' env maps, so gmail-ro (=readonly) and gmail-rw (=readwrite) wanted two
# values of one variable — they could not share a container, so every capability
# variant bought its own billed component.
#
# Now the gateway owns capability. Each server below carries a `tools:` policy
# that strad enforces on tools/list AND on tools/call (a withheld tool is refused
# before it reaches the upstream — see src/gateway/toolPolicy.ts). So ONE
# container runs every upstream at FULL capability, and `gmail-ro` and `gmail-rw`
# are two entries pointing at the same container, the same path, differing only
# in what they are allowed to do.
#
# The capability is still baked into the SLUG (`onepassword-ro` vs
# `onepassword-rw`), because that is what `?servers=<slug>` selects and what a
# human reads. Nothing about the user-facing model changed.
#
# THE TRADE, stated plainly: read-only used to be PHYSICS (a container that did
# not contain a write tool). It is now POLICY (a gateway that declines). The
# sharpest edge is 1Password: the read-only variant used to also hold a read-only
# SERVICE ACCOUNT token, so 1Password itself would refuse a write. One container
# can hold one token, so it holds the read-write one, and `onepassword-ro` is now
# read-only because strad says so. See HACKS.md #22.
#
# EVERY VARIANT OF A FAMILY DECLARES ITS OWN CREDENTIALS, identically. The
# component's env is the union of its servers' env maps, so this is a no-op at
# deploy time — and it is deliberate: with the credential declared on only one
# variant, setting `enabled: false` on THAT variant would silently strip the
# secret from its siblings, which would keep listing their tools and fail every
# call with an auth error naming no cause.
#
# The allow-lists below are derived from each upstream's own tool-group
# definitions, so the counts stay honest: slack 7/13 · tailscale 7/15 ·
# monarch 10/23 · gmail 5/7/8 · google-docs 4/10/11 · google-calendar 4/7 ·
# 1Password 5/9 · telegram 5/6 · bill-spend 4/5. test/staging-config.test.ts
# asserts every one of those numbers.

version: 1

gateway:
  name: strad
  env: staging
  publicUrl: https://staging.strad.tadasant.com
  # THE FLIP. Staging reads its `${NAME}` references from
  # /strad/staging/gateway/static/ while it is running, so a rotation reaches it
  # within ttlSeconds and the app spec carries exactly one secret: the resolver
  # key that opens the store.
  #
  # This is not incremental, whatever envFallback suggests. `render-spec` stops
  # baking the boot keys the moment this changes, and `preflightSecrets()` then
  # demands STRAD_TOKENS and STRAD_INTERNAL_TOKEN be in the store — so the
  # namespace must be seeded BEFORE this line lands, and both images must already
  # carry the base64url encoding (HACKS.md #33) or what is seeded cannot render.
  # docs/operate/secrets.md has the order.
  #
  # envFallback / ttlSeconds / negativeTtlSeconds are left at their defaults
  # (true / 60 / 10) deliberately: the chain keeps the environment behind the
  # store so a name that is not seeded yet still resolves, and the TTL is the
  # window a rotation takes to land.
  secrets:
    provider: gcp-parameter-store

auth:
  google:
    enabled: false # flips to true the moment GOOGLE_CLIENT_ID/SECRET land
    hostedDomain: tadasant.com
    roles: [admin]
  staticTokens:
    enabled: true
    store: env # reserved; no code reads it, and `env` is the only value
  consoleDevBypass:
    enabled: true
    roles: [admin]

roles:
  admin:
    servers: ["*"]
  # A deliberately narrow role. The 424 fail-closed path is only meaningful if
  # something is actually withheld from someone.
  echo-only:
    servers: [echo]
  # Zimmer's own agent sessions, and the narrowest role that still does its job.
  #
  # Staging's deploy loads every strad-staging-* secret, and they are the SAME
  # third-party accounts prod uses — there is no separate Slack workspace, Gmail
  # tenant or 1Password service account — so `admin` here would hand a Zimmer
  # session `onepassword-rw`,
  # `gmail-rw-external`, `slack` and `tailscale-readwrite`, with prod's blast
  # radius. Name the slugs, never the wildcard.
  #
  # Three slugs, and each earns its place:
  #
  #   zimmer-secrets  Zimmer's own parameter store, in its own GCP project.
  #   secrets         strad's staging parameter store. A DIFFERENT project, and
  #                   the one the runtime-secrets migration is rehearsed against
  #                   — including /strad/staging/mcp/echo/static/ below, which
  #                   only this slug can address.
  #   echo            the rotation observatory. It is the one server whose output
  #                   is a value the gateway resolved AT RUNTIME (`options.greeting`,
  #                   and — with `params: true` below — anything under
  #                   /strad/staging/mcp/echo/static/), which makes it the only way
  #                   to OBSERVE over /mcp that a rotated secret took effect with
  #                   no redeploy. A builtin holding no credential of its own: it
  #                   widens what can be watched, not what can be reached.
  #
  # Neither store slug is harmless-by-contents — both hold per-server credentials,
  # and staging's `secrets` key can read a secret VALUE. What bounds them is
  # project separation plus each slug's SECRETS_NAMESPACES fence. See issue #59.
  zimmer:
    servers: [zimmer-secrets, secrets, echo]

bundles:
  # THE bundle. One image, one component, and nineteen of the image's twenty-two
  # upstream MCP servers — the bundle-api fleet, the Google servers, 1Password
  # (with the `op` CLI baked in), telegram and the three browser servers, which
  # share ONE Chromium (never one per server: see
  # servers/bundle/host/src/browser.ts). Three mounts have no slug here:
  # `/x-twitter`, `/google-sheets` — registered in prod, where its six slugs each
  # carry one Google account's OAuth token — and the conventional `/grafana`,
  # since staging's Grafana is the per-slug `/grafana-registry` below. The
  # PROCESS registers all twenty-two either way — including `/telegram`, whose
  # two slugs are disabled until their secret is seeded — which is what the
  # sizing below is about.
  #
  # SIZE. 2GB, and the reasoning is measured, not guessed. With two browser
  # servers logging in concurrently the container's working set is ~760MB (the
  # single Chromium's process tree accounts for ~940MB RSS, most of it shared),
  # and Node with twenty-two servers registered adds ~200MB. 0.5GB is absurd here;
  # 1GB would be one bad page render from an OOM that takes all 27 slugs down
  # with it. The real constraint is CPU — 1 shared vCPU serialises Chromium's
  # rendering, and that box now also answers every Slack and Gmail call — so if
  # the OpenTelemetry data shows event-loop lag or CPU saturation, the next move
  # is apps-d-1vcpu-2gb ($39, dedicated CPU), not more RAM.
  - name: bundle
    instanceSizeSlug: apps-s-1vcpu-2gb

  # THE SECOND SLUG'S BUNDLE. It exists because two secrets SLUGS cannot share
  # one, and the reason is `process.env`.
  #
  # A bundle is a component, which is a container, which is ONE environment, and
  # `src/deploy/appspec.ts` merges a bundle's servers' `env:` maps last-wins. Two
  # secrets slugs in ONE bundle would therefore share whichever store won —
  # SILENTLY: `?servers=zimmer-secrets` would answer with strad's parameters and
  # nothing would report it. (`src/config/schema.ts` rejects that shape, so this
  # is a fence with a second fence behind it.)
  #
  # A second bundle is the whole fix. `src/gateway/registry.ts` resolves the
  # private URL PER BUNDLE and only then appends `path:`, and `appspec.ts` keys
  # its env map by `server.bundle` — so two bundles never merge, and the same
  # `path: /secrets` in each reaches a different container.
  #
  # A SECOND STORE, HOWEVER, NEEDS NO SECOND CONTAINER. `mcpStores:`
  # (src/config/schema.ts) gives one secrets slug a LIST of stores, each with its
  # own project, namespaces, viewer credential and probed capability, rendered
  # onto the bundle as a `SECRETS_STORES` descriptor. Staging keeps two slugs
  # here because they carry two ENTITLEMENTS and two console pages, not because
  # the container could not hold both stores; collapsing them is a config
  # decision, and it would put every store this slug fronts behind one
  # entitlement.
  #
  # SIZE. The default 1GB, not the bundle's 2GB. This container runs the same
  # image (so it registers every upstream at boot, ~200MB of Node) but the
  # gateway only ever routes it `/secrets`, and it never launches the Chromium
  # the browser mounts would use.
  #
  # COST. This is a real second billed component (~$12/month at this size) for a
  # store a human touches a few times a month. That is the trade, stated plainly:
  # the alternative shapes are worse — a parallel secrets console in Rails would
  # duplicate the viewer/admin split, the reveal-flag-vs-IAM logic, the delivery
  # -state classifier and the capability probe; and folding Zimmer's parameters
  # into strad's project under a `/zimmer/` namespace would need no component at
  # all but collapses the boundary the split credentials exist to draw, because
  # `parameters.list` is authorized on the PROJECT and `SECRETS_NAMESPACES` is a
  # code-level guard, not IAM.
  - name: bundle-zimmer-secrets

servers:
  # kind: builtin, in the gateway process.
  - slug: echo
    kind: builtin
    module: "./servers/echo.js"
    bundle: core
    entitlements: [admin, echo-only, zimmer]
    # THE ROTATION OBSERVATORY, and the only one this deployment has.
    #
    # `params: true` on a BUILTIN resolves /strad/staging/mcp/echo/static/* and
    # merges it over `options:` on EVERY TOOL CALL, through the same TTL cache
    # (gateway.secrets.ttlSeconds) the runtime secret provider uses — see
    # gateway/registry.ts `optionsFor`. So setting `greeting` in the store and
    # calling `whoami` is a direct, external read of what a running gateway
    # currently resolves, with no redeploy anywhere in the loop.
    #
    # That matters because nothing else in this config is observable that way:
    # a supplementary image's `env:` is baked at render time, `deepwiki` sends no
    # credential, and the boot keys are read once at startup. Without this, "a
    # rotated secret takes effect without a redeploy" can be asserted but not
    # WATCHED — which is how it stayed unproven.
    #
    # It is inert until the deployment has a resolver credential (STRAD_PARAMS_*):
    # `Registry.build` gets a null resolver and skips the merge entirely, so this
    # costs nothing and changes nothing on a deployment that has not migrated.
    #
    # Point `greeting` at a canary, never at a credential. It is returned over
    # /mcp verbatim, to anyone entitled to this slug.
    params: true
    options:
      # THE PROBE, and the name is chosen for one property: `STRAD_ENV` is
      # already on this component's environment (appspec's identityEnvs sets it
      # to "staging"), so the SAME reference can demonstrate both halves of the
      # chain. Seeded in /strad/staging/gateway/static/ the store answers and
      # wins; delete it and the chain falls through to the environment and
      # answers "staging". Nothing else in this config can show that, because
      # `preflightSecrets()` requires every config-declared `${NAME}` to be in
      # the store — so an "unseeded ref" is a deploy that fails, not a fallback
      # anyone can watch.
      #
      # Shadowing it here is inert: `STRAD_ENV` is read from `process.env`
      # directly by everything that cares (secretSourceFromEnv, identityEnvs),
      # never through the provider, so a store entry under this name reaches
      # exactly one place — the string below.
      greeting: "${STRAD_ENV}"

  # kind: remote-http. A real third-party MCP server on the public internet,
  # proxied through strad. No credential needed for this one, which is why it
  # makes a good staging canary.
  - slug: deepwiki
    kind: remote-http
    url: https://mcp.deepwiki.com/mcp
    entitlements: [admin]

  # kind: local-tunnel. The Anki MCP add-on (AnkiWeb 124672614) running inside
  # Anki on Tadas's machine, reached over a tunnel that machine dials out to.
  #
  # SHIPPED DISABLED, on a HOST THAT CANNOT RESOLVE — `.invalid` is reserved by
  # RFC 2606 and answers nowhere by construction. That is the point: staging
  # does not borrow the machine, it only has to prove the kind parses, renders
  # and routes. To turn it on: start Anki, run a tunnel to 127.0.0.1:3141, put
  # the hostname in `url` and flip `enabled`. Nothing else in this file changes
  # and no secret needs seeding. (See servers/adding.md §4a for the
  # disabled-until-provisioned pattern.)
  #
  # THE URL HAS NO PATH, AND THAT IS THE WHOLE OF IT. The add-on serves
  # streamable HTTP at the ROOT of its port — its `http_path` setting defaults
  # to the empty string, and its own docs connect clients to
  # `http://127.0.0.1:3141/`. A `/mcp` suffix on the end of the hostname below
  # therefore addresses a path nothing serves, and the 404 that comes back is
  # the ONE local-tunnel failure the kind's exemption does not cover: a wrong
  # path is an ordinary upstream error, so `?servers=anki,slack` fails OUTRIGHT
  # instead of dropping anki and serving Slack. See `src/gateway/adapters/http.ts`
  # (`wrap`, which is narrow on purpose) and the "a wrong path still FAILS an
  # explicit listing" case in `test/local-tunnel.test.ts`. Whoever swaps a live
  # hostname in here inherits the shape of this line — so the shape is right.
  #
  # It costs no component and no bundle: strad runs nothing for a local-tunnel.
  # When the machine is off — which is most of the time, by design — the slug
  # is `unreachable` on /healthz and the deploy gate ignores it, for the same
  # reason it ignores deepwiki having a bad afternoon.
  - slug: anki
    kind: local-tunnel
    url: https://anki.invalid/
    entitlements: [admin]
    enabled: false

  # ---------------------------------------------------------------------------
  # Slack — 13 tools full, 7 read-only. ONE container, ONE path, TWO slugs.
  #
  # Nine of the thirteen are upstream's; four are the fork's DM surface
  # (`slack_send_dm`, `slack_get_dm`, `slack_get_dms`, `slack_find_user`). Those
  # four need OAuth scopes the channel tools never asked for — `im:write`,
  # `im:read` and `users:read`, plus `users:read.email` to address someone by
  # email and `mpim:read` for group DMs. A scope the installed token lacks fails
  # the call, not the boot: the tools list either way. See fork/slack/FORK.md.
  # ---------------------------------------------------------------------------
  - slug: slack
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /slack
    entitlements: [admin]
    env:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"

  - slug: slack-readonly
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /slack
    entitlements: [admin]
    env:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
    tools:
      allow:
        - slack_get_channels
        - slack_get_channel
        - slack_get_thread
        - slack_download_file
        # The DM reads. `slack_get_dm` resolves an EXISTING conversation rather
        # than calling conversations.open, so nothing here creates anything.
        #
        # Note what this tier can now SEE, which is the axis the read-only/
        # read-write split says nothing about: the whole workspace directory
        # (`slack_find_user`, including profile emails where the scope is
        # present) and every private conversation the bot is part of. That is a
        # deliberate widening — a read tool that cannot find a user is not much
        # of a read tool — but it is a widening.
        - slack_get_dms
        - slack_get_dm
        - slack_find_user

  # ---------------------------------------------------------------------------
  # Tailscale — 15 tools full, 7 read-only (policy/devices/keys, reads only).
  # ---------------------------------------------------------------------------
  - slug: tailscale-readwrite
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /tailscale
    entitlements: [admin]
    env:
      TAILSCALE_API_KEY: "${TAILSCALE_API_KEY}"

  - slug: tailscale-readonly
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /tailscale
    entitlements: [admin]
    env:
      TAILSCALE_API_KEY: "${TAILSCALE_API_KEY}"
    tools:
      allow:
        - get_policy_file
        - validate_policy_file
        - list_devices
        - get_device
        - get_device_routes
        - list_keys
        - get_key

  # ---------------------------------------------------------------------------
  # Monarch Money — 23 tools full, 10 read-only.
  # ---------------------------------------------------------------------------
  - slug: monarch-money-readwrite
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /monarch-money
    entitlements: [admin]
    env:
      MONARCH_SESSION_TOKEN: "${MONARCH_SESSION_TOKEN}"

  - slug: monarch-money-readonly
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /monarch-money
    entitlements: [admin]
    env:
      MONARCH_SESSION_TOKEN: "${MONARCH_SESSION_TOKEN}"
    tools:
      allow:
        - check_authentication
        - get_accounts
        - get_account_balance_history
        - get_net_worth
        - get_transactions
        - get_transaction_details
        - get_categories
        - get_tags
        - get_transaction_rules
        - get_budgets

  # ---------------------------------------------------------------------------
  # The rest of the pure-API fleet. No capability variants; no policy.
  # ---------------------------------------------------------------------------
  - slug: serpapi-hotels
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /serpapi-hotels
    entitlements: [admin]
    env:
      SERPAPI_API_KEY: "${SERPAPI_API_KEY}"

  # No credential at all — public endpoints. The zero-secret supplementary canary.
  - slug: google-flights
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-flights
    entitlements: [admin]

  # PulseMCP registry API. Tenant is env-configured rather than mutable over MCP.
  #
  # DISABLED UNTIL ITS SECRET IS SEEDED, the same way telegram-ro/rw are. A
  # `${REF}` the store does not hold FAILS the render — that is the fail-loud
  # property render-spec exists for — and it fails the WHOLE spec, so one
  # unseeded name takes every other server's deploy down with it. Landing the
  # entry disabled keeps the slug declared and the mount in the image while
  # every other slug deploys. To turn it on: set
  # PULSEMCP_SUBREGISTRY_API_KEY in /strad/staging/gateway/static/ (the console,
  # /ui/secrets), then delete the `enabled` line below and add the name to
  # PROVISIONED_STATICS in test/staging-config.test.ts — the ledger that test
  # holds this config to.
  - slug: pulse-subregistry
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /pulse-subregistry
    entitlements: [admin]
    enabled: false
    env:
      PULSEMCP_SUBREGISTRY_API_KEY: "${PULSEMCP_SUBREGISTRY_API_KEY}"

  # strad fetch: web page retrieval. strad's fork of @pulsemcp/pulse-fetch, which
  # this deployment used to run as an `npx` stdio subprocess inside every agent
  # session — where a rejected BrightData key was a boot failure that killed the
  # session (servers/strad-fetch/FORK.md).
  #
  # NO `env:` AT ALL, and that is the fork working as intended rather than an
  # omission. The native HTTP strategy needs no credential and serves most public
  # pages, so this slug is useful with nothing seeded — like google-flights above,
  # it deploys as a zero-secret entry rather than shipping `enabled: false` and
  # doing nothing until a human flips it.
  #
  # TO ADD BRIGHTDATA (coverage on sites that block a bare fetch): seed
  # BRIGHTDATA_API_KEY in /strad/staging/gateway/static/ through the console
  # (/ui/secrets), add `env: { BRIGHTDATA_API_KEY: "${BRIGHTDATA_API_KEY}" }`
  # here, and add the name to PROVISIONED_STATICS in test/staging-config.test.ts.
  # Seeding must come FIRST: an unseeded ${REF} fails the whole render.
  - slug: strad-fetch
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /strad-fetch
    entitlements: [admin]

  # Grafana, for the MCP Registry's OWN observability plane — not for ours.
  #
  # `grafana.prod.registry.modelcontextprotocol.io` is the Grafana in front of the
  # modelcontextprotocol/registry deployment (a GKE cluster running
  # VictoriaMetrics + VictoriaLogs + an OpenTelemetry collector). It is a
  # DIFFERENT Grafana from obs.tadasant.com, which is the dashboard plane for the
  # Tadas/Zimmer/strad fleet; this slug answers questions about the REGISTRY's own
  # traffic (pageviews, downloads, API requests) and nothing about our infra.
  #
  # WHY IT IS A MOUNT AND NOT A LOCAL COMMAND. Grafana ships mcp-grafana as a Go
  # binary and a Docker image only, so it used to run agent-side as a ~900
  # character `sh -c` that curled the pinned release into $TMPDIR on every fresh
  # session and exec'd it. That is the thing this replaces: the binary is baked
  # into the bundle image at a pinned, SHA-256-verified version, and this slug
  # proxies to it like any other supplementary server — which is what lets its
  # credential live in the parameter store instead of in a client's config.
  #
  # READ-ONLY AT THE BINARY. The bundle host runs the child with `-disable-write`
  # and `-disable-proxied`, so the 13 write tools do not exist in the process and
  # a datasource cannot advertise new ones — 52 read tools. Hence no `tools:`
  # policy here: there is nothing left for the gateway to withhold. A read-write
  # Grafana would be a SECOND mount, never this one with a flag removed.
  #
  # ONE MOUNT, MANY GRAFANAS. `path: /grafana-registry` is not a typo for
  # `/grafana`: the bundle host mounts a per-slug instance at `/<slug>` for every
  # slug the container carries a whole Grafana credential for, and a per-slug
  # instance is what gives this one its own child process holding its own token.
  # Pointing a second slug at obs.tadasant.com is then config alone — a `grafana`
  # entry on `path: /grafana` — with no image change.
  #
  # DISABLED UNTIL ITS SECRET IS SEEDED, like telegram-ro/rw and
  # pulse-subregistry. A `${REF}` the store does not hold fails the WHOLE render.
  # Minting the token needs admin on the registry's Grafana, whose only login is
  # Google OAuth restricted to @modelcontextprotocol.io — so it comes from an MCP
  # Registry maintainer, not from a tadasant.com account. To turn it on: seed
  # GRAFANA_REGISTRY_SERVICE_ACCOUNT_TOKEN in /strad/staging/gateway/static/
  # (the console, /ui/secrets), delete the `enabled` line below, and add the name
  # to PROVISIONED_STATICS in test/staging-config.test.ts.
  - slug: grafana-registry
    kind: supplementary-image
    title: Grafana (MCP Registry production)
    description: >-
      Read-only Grafana for the MCP Registry's own production cluster:
      Prometheus/VictoriaMetrics queries, dashboards, and VictoriaLogs through
      the datasource proxy. Not the tadasant fleet's Grafana.
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /grafana-registry
    entitlements: [admin]
    enabled: false
    env:
      GRAFANA_URL: https://grafana.prod.registry.modelcontextprotocol.io
      GRAFANA_SERVICE_ACCOUNT_TOKEN: "${GRAFANA_REGISTRY_SERVICE_ACCOUNT_TOKEN}"

  # strad's artifact store: an agent uploads a screenshot, a human opens the link.
  #
  # ITS ENV IS SLUG-NAMESPACED, and that is load-bearing: `gcs` (below) reads the
  # bare GCS_BUCKET and points at a DIFFERENT bucket. That collision is why gcs
  # used to need a component of its own. In one container it cannot be resolved by
  # env at all, so this server reads every key under a REMOTE_FILESYSTEM_TMP_PUBLIC_
  # prefix (the bundle host constructs it with that envPrefix) and never touches
  # the bare names.
  #
  # SENSITIVE_VIEWER_DOMAIN is the sensitivity half. `is_sensitive: true` grants
  # `domain-<this>` READER on the object and returns a storage.cloud.google.com
  # link, which Google gates behind a sign-in. Without it, a sensitive upload is
  # REFUSED — storing an artifact nobody can open is worse than failing loudly.
  # It is deployment config, not a credential, so it stays a literal here.
  #
  # ITS TWO CREDENTIALS COME FROM THE SECRETS SYSTEM, not from hand-written
  # `${REF}` secrets. `params: true` opts this server into parameter resolution:
  # at deploy time render-spec resolves everything under
  # `/strad/staging/mcp/remote-filesystem-tmp-public/static/*` — the non-secret
  # REMOTE_FILESYSTEM_TMP_PUBLIC_GCS_CLIENT_EMAIL from Parameter Manager and the secret
  # REMOTE_FILESYSTEM_TMP_PUBLIC_GCS_PRIVATE_KEY from Secret Manager — and injects them
  # as SECRET env vars onto this bundle. A human sets both in the console
  # (/ui/secrets); the container holds no cloud credential. The bucket is
  # deployment config, not a credential, so it stays a literal here.
  - slug: remote-filesystem-tmp-public
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /remote-filesystem-tmp-public
    entitlements: [admin]
    params: true
    env:
      REMOTE_FILESYSTEM_TMP_PUBLIC_GCS_BUCKET: "remote-filesystem-tadas"
      REMOTE_FILESYSTEM_TMP_PUBLIC_SENSITIVE_VIEWER_DOMAIN: "tadasant.com"

  # Google Cloud Storage. Keeps the bare GCS_* names (the artifact store above is
  # the one that moved). GCS_BUCKET pins every operation to ONE bucket and is also
  # what the human /ui/gcs view scopes to (src/ui/resolve.ts). pulse_public is the
  # deliberate choice: the service account can reach the transcript buckets too,
  # and an MCP endpoint pointed at "…secret-do-not-share…" by default is not a
  # posture worth having.
  - slug: gcs
    kind: supplementary-image
    title: Google Cloud Storage
    description: Browse the object store this server is scoped to.
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /gcs
    entitlements: [admin]
    env:
      GCS_PROJECT_ID: "pulse-443819"
      GCS_BUCKET: "pulse_public"
      GCS_SERVICE_ACCOUNT_KEY_JSON: "${GCS_PULSEMCP_SERVICE_ACCOUNT_KEY_JSON}"
    # The SAME key, additionally scoped to core, because /ui/gcs renders THERE.
    # `env:` lands on the bundle only, so without this the console resolves the
    # ${ref} against a bag that does not contain it and degrades to "credentials
    # are declared but not injected" — while the MCP tools work fine, which is a
    # confusing pair of symptoms. Unlike the `secrets` server, where the console
    # deliberately holds a STRONGER credential than the bundle, this is the same
    # value in both places: the browse view reads exactly the bucket the server
    # is already scoped to.
    consoleEnv:
      GCS_SERVICE_ACCOUNT_KEY_JSON: "${GCS_PULSEMCP_SERVICE_ACCOUNT_KEY_JSON}"

  # ---------------------------------------------------------------------------
  # secrets — the store-agnostic parameters manager. Parameter Manager indexes
  # everything; Secret Manager backs the secret parts. Its MCP surface CANNOT
  # return a SECRET value.
  #
  # THIS ENTRY IS THE SECURITY BOUNDARY. Three credentials, three roles:
  #
  #   env:         SECRETS_SERVICE_ACCOUNT_KEY_JSON        -> the BUNDLE (viewer)
  #   consoleEnv:  SECRETS_ADMIN_SERVICE_ACCOUNT_KEY_JSON  -> CORE only (admin)
  #   STRAD_PARAMS_RESOLVER_SERVICE_ACCOUNT_KEY_JSON       -> DEPLOY only (resolver)
  #
  # `env:` lands on the container that answers /mcp. It gets the VIEWER service
  # account: Parameter Manager list/get and parameterVersions.get (so it can
  # read the index and NON-SECRET values) and NOT secretmanager.versions.access.
  # A secret parameter's value lives in Secret Manager, which this credential
  # cannot reach, so the MCP path can see that a parameter exists, its kind and
  # note, and read a non-secret value — and Google refuses it a secret value. A
  # prompt injection that talks a tool into reading a secret gets a 403.
  #
  # `consoleEnv:` lands on the CORE component and nowhere else (appspec.ts is
  # explicit about it; a broadcast SECRET would have reached the bundle too). It
  # carries the ADMIN service account, which CAN add, rotate, reveal and delete
  # both kinds — driven only by a human on /ui/secrets, behind the console SSO
  # gate. There is no code path from /mcp to it.
  #
  # The RESOLVER account (STRAD_PARAMS_*, set in the deploy environment, NOT here)
  # reads both stores' values at deploy time to inject a `params: true` server's
  # env. It writes nothing and never reaches a running container.
  #
  # NAMESPACE, AND WHERE THE FENCE ACTUALLY IS. The path prefix
  # `/strad/staging/mcp/` is a code-level guard on the MCP half: that server
  # refuses to list an unmanaged namespace. On the console half the same list is
  # only a set of suggestions (SECRETS_NAMESPACES_STRICT would make it a limit). It is NOT
  # the IAM boundary — put these parameters in a project that holds ONLY them, not
  # the project holding strad's own strad-staging-* secrets. Then the viewer can
  # describe everything in that project and read no secret value; the admin can do
  # anything in that project and cannot see strad's own secrets, because they are
  # elsewhere. See servers/secrets/README.md.
  #
  # The project id and namespace are NON-SECRET config, so they are LITERALS here
  # (like `gcs`'s GCS_PROJECT_ID above) — not `${refs}`. Only the two service-
  # account KEYS are secret: they are seeded in Secret Manager as
  # strad-staging-SECRETS_VIEWER_KEY_JSON and strad-staging-SECRETS_ADMIN_KEY_JSON,
  # and render-spec fails the deploy if either is missing. If you name the secrets
  # project something other than `strad-secrets-staging`, there are THREE sites:
  # the two SECRETS_PROJECT_ID literals below, and the --project flag on the
  # capability-report step in .github/workflows/deploy-staging.yml.
  - slug: secrets
    kind: supplementary-image
    title: Secrets & parameters
    description: Add, rotate, reveal and delete non-secret and secret parameters. The MCP server can never return a secret value.
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /secrets
    # `zimmer` is here and NOWHERE ELSE in this file except `echo`. The whole
    # point of that token's narrow role is that 21 other slugs carry real
    # third-party credentials. See the `zimmer` role above.
    #
    # It is entitled to the SERVER, not to the store: what this token can address
    # is still bounded by SECRETS_NAMESPACES below, which is `/strad/staging/mcp/`
    # and deliberately does NOT include the gateway's own
    # `/strad/staging/gateway/static/`. That namespace is where the deployment's
    # own ${NAME} references live — the 22 supplementary credentials
    # (SLACK_BOT_TOKEN, the 1Password service-account token, the Gmail private
    # keys) plus its boot keys and STRAD_ENV, 30 names in all — and staging's MCP
    # CAN read a secret value (it is read+write here, unlike prod's). Adding the
    # gateway namespace to the line below would therefore hand this token every
    # credential the narrow role exists to withhold. Do not.
    #
    # The fence bounds WRITES as well as reads, and that is worth stating: a
    # holder of this role can write anywhere under /strad/staging/mcp/, including
    # another server's namespace, and a `params: true` server resolves its
    # namespace into that container's environment. That capability comes with
    # entitling `secrets` at all; it is not something the `echo` line adds.
    entitlements: [admin, zimmer]
    env:
      SECRETS_PROJECT_ID: "strad-secrets-staging"
      SECRETS_NAMESPACES: "/strad/staging/mcp/"
      SECRETS_CONSOLE_URL: "https://staging.strad.tadasant.com/ui/secrets"
      # STAGING'S MCP CREDENTIAL IS READ+WRITE, and prod's is not. The key name is
      # unchanged; what changes is the IAM behind it in the staging project only
      # (servers/secrets/README.md has the grants).
      #
      # The server does not take that on faith. At startup it asks Google which
      # permissions this credential holds (`projects:testIamPermissions`) and
      # DERIVES its tool surface from the answer — see
      # servers/secrets/shared/src/capabilities.ts. So prod, whose key is a
      # viewer, lists four read-only tools exactly as before, and staging lists
      # the write tools too. There is no flag claiming a capability the credential
      # might not have, because a flag can be wrong and a probe cannot.
      #
      # THE PROD PROPERTY IS UNCHANGED: prod's `/mcp` still cannot read a secret
      # value, because prod's credential still lacks
      # secretmanager.versions.access. Staging relaxing this is deliberate and
      # scoped to a project separate from the one holding strad's own
      # strad-staging-* secrets. That project does hold per-server credentials —
      # see issue #59; the fence is separation, not harmlessness.
      SECRETS_SERVICE_ACCOUNT_KEY_JSON: "${SECRETS_VIEWER_KEY_JSON}"
      #
      # WRITE-BACK (`paramsWritable:`), and what it does and does not grant.
      #
      # A server that declares `paramsWritable:` can POST a rotated credential to
      # core, which performs the write with the ADMIN key below — the container
      # never holds a cloud credential, which is the whole point of the split
      # above.
      #
      # WHAT IT BOUNDS IS THE NAMES, NOT THE CALLER, and read that before opting
      # a server in. `STRAD_INTERNAL_TOKEN` is ONE token, on every supplementary
      # component — it is the token core presents when it proxies /mcp to them —
      # and nothing binds a caller to the slug it addresses. So the reachable set
      # is the UNION of every enabled server's `paramsWritable:`: a compromised
      # container on one bundle can read and overwrite the rotating credential of
      # a server on another. The GET is a value read, on the component with the
      # public route, which is a thing only the console admin key behind Google
      # SSO could do before. Factor that into how often this token is rotated.
      # Recorded as limitation #63; per-component tokens are the exit.
      #
      # What it DOES bound is real and is most of the value: the union is opt-in
      # and empty by default, nothing outside it is reachable at all (not another
      # server's ordinary parameters, not the gateway namespace), and every name
      # on it is by construction a credential that ROTATES — so losing one costs
      # a re-seed rather than a durable secret. Against the alternative, a Secret
      # Manager credential on the container answering /mcp, this is a materially
      # smaller grant.
      #
      # Note this is a DIFFERENT fence from the one above. The `zimmer` role's
      # reach is bounded by SECRETS_NAMESPACES; a write-back's reach is bounded by
      # the allowlists in the config, and the name in the URL is checked against
      # that config rather than trusted. See docs: /operate/secrets/.
    consoleEnv:
      SECRETS_PROJECT_ID: "strad-secrets-staging"
      # REVEAL, opted in for staging and absent in prod. Two independent layers:
      # this flag decides what the console OFFERS; whether the console's service
      # account holds `secretmanager.versions.access` decides what is POSSIBLE.
      # Both must say yes and the narrower wins (src/ui/reveal.ts). Absent = off,
      # so a new environment cannot inherit reveal by forgetting to think about it.
      #
      # Staging says yes because `strad-secrets-staging` is a separate project
      # from strad's own secrets, so a reveal there is bounded
      # and round-tripping a value is how the store gets tested. Prod says no,
      # and its admin SA is being downgraded to write-without-read so that the
      # "no" is IAM rather than markup — see servers/secrets/README.md.
      SECRETS_REVEAL_ENABLED: "true"
      # TWO namespaces on the console side, ONE on the MCP side above, and the
      # asymmetry is the point. `/strad/staging/gateway/static/` holds the
      # deployment's own ${NAME} references — the token store, the OAuth client
      # secret — which a HUMAN manages here and an AGENT has no business
      # enumerating. The console's admin credential can already reach the whole
      # project, so listing this namespace widens what is addressable, not what is
      # permitted; the viewer's list stays scoped to the servers' namespace.
      SECRETS_NAMESPACES: "/strad/staging/mcp/,/strad/staging/gateway/static/"
      # Parameter Manager admin + Secret Manager admin. Core only. Humans only.
      SECRETS_ADMIN_SERVICE_ACCOUNT_KEY_JSON: "${SECRETS_ADMIN_KEY_JSON}"

  # ---------------------------------------------------------------------------
  # zimmer-secrets — the SAME server, the SAME image, a DIFFERENT store.
  #
  # Zimmer keeps its own parameters in its own GCP project, under the same
  # envelope convention (it was built by mirroring strad's). So one strad fronts
  # both stores: same console, same MCP tools, same viewer/admin split, same
  # reveal flag — instead of a second parameters console written in Rails.
  #
  # THREE THINGS ARE LOAD-BEARING HERE, and each of them is a silent failure if
  # you get it wrong.
  #
  # 1. `bundle:` IS THE WHOLE MECHANISM. It names a DIFFERENT bundle from the
  #    `secrets` slug above, and that is the only structural difference between
  #    the two entries. Put both slugs in one bundle and they share one
  #    container, one `process.env` and therefore one store — with `env:` merged
  #    last-wins and no validation error anywhere. See the bundle comment above.
  #
  # 2. `env:` MAY USE THE BARE `SECRETS_*` NAMES; `consoleEnv:` MAY NOT. `env:`
  #    lands on THIS slug's own container, which holds nothing else, so bare is
  #    correct and is what the server reads. Every server's `consoleEnv:` merges
  #    into the ONE `core` component (src/deploy/appspec.ts), so bare names there
  #    would collide with the `secrets` slug's — `/ui/secrets` would render
  #    strad's project holding ZIMMER's admin credential. The console maps
  #    `ZIMMER_SECRETS_SECRETS_*` back down to the bare name for this slug alone
  #    (`withNamespacedFallback`, src/ui/resolve.ts). `scripts/check-config.ts`
  #    now rejects the bare-name collision, but the rule is worth knowing rather
  #    than rediscovering from a failed CI run. The mapping is a FALLBACK: see
  #    the note above `consoleEnv:` below for what that rules out.
  #
  # 3. THE MCP CREDENTIAL IS THE VIEWER, AND IT IS NOT THE RESOLVER.
  #    `zimmer-secrets-resolver` already exists and would have been the obvious
  #    key to reuse — do not. It holds `parametermanager.parameterAccessor`,
  #    which carries `parameterVersions.render`, and `:render` derefs a secret
  #    parameter AS THE PARAMETER'S OWN PRINCIPAL, which was granted
  #    `secretAccessor` at create time. It is a live read path for a secret
  #    VALUE. strad derives this server's tool surface from a live IAM probe
  #    rather than a flag (servers/secrets/shared/src/capabilities.ts), so a slug
  #    handed that key would list `get_secret_value` and it would WORK.
  #    `zimmer-secrets-viewer@zimmer-secrets-staging` holds `parameterViewer`
  #    only — it can see that a parameter exists, its kind and its note, and read
  #    a NON-secret value, and Google refuses it every secret value.
  #
  # ENTITLEMENT. `admin` (a human's console session) and `zimmer` — the narrow
  # role Zimmer's own sessions hold, which reaches this slug and nothing else.
  # Zimmer managing Zimmer's parameters is the point of the slug.
  #
  # The project id and namespace are non-secret deployment config, so they are
  # literals. Only the two service-account KEYS are secret: they are seeded in
  # staging's Secret Manager as strad-staging-ZIMMER_SECRETS_VIEWER_KEY_JSON and
  # strad-staging-ZIMMER_SECRETS_ADMIN_KEY_JSON, and render-spec fails the deploy
  # if either is missing.
  - slug: zimmer-secrets
    kind: supplementary-image
    title: Zimmer secrets & parameters
    description: Zimmer's own parameter store. Add, rotate, reveal and delete non-secret and secret parameters. The MCP server can never return a secret value.
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle-zimmer-secrets
    path: /secrets
    entitlements: [admin, zimmer]
    env:
      SECRETS_PROJECT_ID: "zimmer-secrets-staging"
      SECRETS_NAMESPACES: "/zimmer/staging/mcp/static/"
      SECRETS_CONSOLE_URL: "https://staging.strad.tadasant.com/ui/zimmer-secrets"
      # Viewer-only. See point 3 above — this is the one line that keeps /mcp
      # away from a Zimmer secret value, and it is IAM rather than markup.
      SECRETS_SERVICE_ACCOUNT_KEY_JSON: "${ZIMMER_SECRETS_VIEWER_KEY_JSON}"
    # SLUG-NAMESPACED, every one of them, and ONLY the keys this slug does not
    # already declare bare under `env:`.
    #
    # `withNamespacedFallback` (src/ui/resolve.ts) maps the namespaced form down
    # to the bare name with `??=` — a FALLBACK, not an override. `env:` and
    # `consoleEnv:` are merged before it runs, so a namespaced key whose bare form
    # is already set by `env:` above is INERT. Declaring
    # `ZIMMER_SECRETS_SECRETS_PROJECT_ID` here would look meaningful and do
    # nothing; the console reads the `env:` literal.
    #
    # The consequence, so it is not rediscovered: this slug CANNOT give its
    # console a wider namespace list than its MCP half, the way `secrets` does
    # above. That trick works there because the key is bare in both maps and
    # `consoleEnv:` is spread last — and bare is exactly what a second slug may
    # not use. If Zimmer ever needs a console-only namespace, the fix is upstream
    # (make the namespaced form an override), not a bare key here.
    consoleEnv:
      # Reveal is a human-only surface behind the console's SSO gate. It is on
      # because round-tripping a value is how a store gets tested, and because
      # this is staging. Note it is NOT justified by "the admin key can already do
      # it": prod's `secrets` admin is deliberately being downgraded to
      # write-without-read so its "no" is IAM rather than markup, and the same
      # question gets asked separately when prod's Zimmer slug lands.
      ZIMMER_SECRETS_SECRETS_REVEAL_ENABLED: "true"
      # ...and because reveal is on, the namespace list is a LIMIT here, not a set
      # of suggestions. The console's admin key reaches every parameter in the
      # project, so this buys nothing against an operator — it is defence against
      # a HIJACKED SESSION, an attacker with a cookie and no ability to redeploy,
      # who would otherwise be able to address any namespace in Zimmer's project
      # and reveal it. src/ui/resolve.ts names that actor and recommends exactly
      # this. The namespace still comes from `env:` above; this only makes it
      # binding.
      ZIMMER_SECRETS_SECRETS_NAMESPACES_STRICT: "true"
      # Parameter Manager admin + Secret Manager admin, on Zimmer's project only.
      # Core only. Humans only. There is no code path from /mcp to it.
      ZIMMER_SECRETS_SECRETS_ADMIN_SERVICE_ACCOUNT_KEY_JSON: "${ZIMMER_SECRETS_ADMIN_KEY_JSON}"

