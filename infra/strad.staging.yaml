# strad config for the staging deployment.
#
# CI reads this, renders it into a DigitalOcean App Platform spec (see
# src/deploy/appspec.ts) and injects the secret values from GCP Secret Manager.
# It exercises all three server kinds on purpose — staging that only proves the
# easy path is not proving much.

version: 1

gateway:
  name: strad
  env: staging
  publicUrl: https://staging.strad.tadasant.com

auth:
  google:
    enabled: false # flips to true the moment GOOGLE_CLIENT_ID/SECRET land
    hostedDomain: tadasant.com
    roles: [admin]
  staticTokens:
    enabled: true
    store: env
  consoleDevBypass:
    enabled: true
    roles: [admin]

roles:
  admin:
    servers: ["*"]
  # A deliberately narrow role. The 424 fail-closed path is only meaningful if
  # something is actually withheld from someone.
  echo-only:
    servers: [echo]

bundles:
  - name: bundle-api
    instanceSizeSlug: apps-s-1vcpu-1gb
  # The gcs server's bundle. It ships DISABLED here (see the server below), so
  # this bundle emits no App Platform component and demands no secret at render —
  # exactly like fetchpet/pointsyeah. It exists so the human /ui/gcs route has a
  # config entry to scope to; the view renders its shell (behind the SSO gate)
  # and reports "credentials not yet configured" until Phase 2 seeds them.
  - name: bundle-gcs
    instanceSizeSlug: apps-s-1vcpu-1gb
  # Browser bundles. Each drives a real headless Chromium: peak ~545MB RSS, so
  # 1GB is the floor; the binding constraint is CPU (1 vCPU serialises page
  # rendering), not RAM. strad's schema enforces ONE image per bundle, so each
  # browser server owns its own bundle — good-eggs, fetchpet and pointsyeah are a
  # FAMILY of colocated 1GB Chromium bundles, not one shared component.
  - name: bundle-goodeggs
    instanceSizeSlug: apps-s-1vcpu-1gb
  - name: bundle-fetchpet
    instanceSizeSlug: apps-s-1vcpu-1gb
  - name: bundle-pointsyeah
    instanceSizeSlug: apps-s-1vcpu-1gb

servers:
  # kind: builtin, in the gateway process.
  - slug: echo
    kind: builtin
    module: "./servers/echo.js"
    bundle: core
    entitlements: [admin, echo-only]
    options:
      greeting: "hello from the core gateway"

  # kind: builtin, in a SEPARATE internal component. Proves the private-network
  # path: core reaches it at ${bundle-api.PRIVATE_URL}, which never leaves the VPC.
  - slug: bundled
    kind: builtin
    module: "./servers/echo.js"
    bundle: bundle-api
    entitlements: [admin]
    options:
      greeting: "hello from bundle-api, over the private network"

  # kind: remote-http. A real third-party MCP server on the public internet,
  # proxied through strad. No credential needed for this one, which is why it
  # makes a good staging canary.
  - slug: deepwiki
    kind: remote-http
    url: https://mcp.deepwiki.com/mcp
    entitlements: [admin]

  # kind: supplementary-image. The first REAL one: Good Eggs, published as its
  # own container (servers/good-eggs) and run as an internal-only component. The
  # core reaches it at ${bundle-goodeggs.PRIVATE_URL} -> http://bundle-goodeggs:8080.
  # It drives a headless Chromium and logs into a real Good Eggs account, so its
  # tool calls can take a while — timeoutMs is set explicitly above the MCP SDK's
  # silent 60s default. Credentials resolve onto THIS bundle only (see appspec.ts).
  - slug: good-eggs
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-server-good-eggs:latest
    bundle: bundle-goodeggs
    entitlements: [admin]
    timeoutMs: 120000
    env:
      GOODEGGS_EMAIL: "${GOODEGGS_EMAIL}"
      GOODEGGS_PASSWORD: "${GOODEGGS_PASSWORD}"

  # kind: supplementary-image. Two more browser-driven servers in the same
  # browser-bundle family as good-eggs (each its own 1GB Chromium component). They
  # are registered here but shipped ENABLED: FALSE — this OSS staging holds no
  # credentials for them (real creds are wired downstream in tadasant-internal,
  # which flips these on). A disabled server emits no component and demands no
  # secret at render (see appspec.ts / render-spec.ts), so staging stays
  # deployable with zero new secrets. timeoutMs is 180s: these browser flows are
  # slower than good-eggs and the MCP SDK's silent 60s default would kill them.
  - slug: fetchpet
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-server-fetchpet:latest
    bundle: bundle-fetchpet
    entitlements: [admin]
    enabled: false
    timeoutMs: 180000
    env:
      FETCHPET_USERNAME: "${FETCHPET_USERNAME}"
      FETCHPET_PASSWORD: "${FETCHPET_PASSWORD}"

  - slug: pointsyeah
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-server-pointsyeah:latest
    bundle: bundle-pointsyeah
    entitlements: [admin]
    enabled: false
    timeoutMs: 180000
    env:
      POINTSYEAH_REFRESH_TOKEN: "${POINTSYEAH_REFRESH_TOKEN}"

  # kind: supplementary-image. The gcs server from the bundle-api fleet, wired
  # here so the human resource browser (/ui/gcs) has a config entry to scope to.
  # Its env declares the bucket + credentials the way the real gcs server reads
  # them (GCS_BUCKET, GCS_SERVICE_ACCOUNT_KEY_JSON — see servers/bundle-api). The
  # human /ui reads exactly this to scope the browse to the mcp id.
  #
  # It ships ENABLED: FALSE — this OSS staging holds no per-server GCS creds
  # (they are seeded in a later phase, in tadasant-internal). A disabled
  # supplementary image emits no component and demands no secret at render
  # (render-spec / appspec skip it), so staging stays deployable with zero new
  # secrets. Until the creds land, /ui/gcs renders its shell behind the SSO gate
  # and reports "credentials not yet configured".
  - slug: gcs
    kind: supplementary-image
    title: Google Cloud Storage
    description: Browse the object store this server is scoped to.
    image: ghcr.io/tadasant/strad-bundle-api:latest
    bundle: bundle-gcs
    path: /gcs
    entitlements: [admin]
    enabled: false
    env:
      GCS_PROJECT_ID: "${GCS_PROJECT_ID}"
      GCS_BUCKET: "${GCS_BUCKET}"
      GCS_SERVICE_ACCOUNT_KEY_JSON: "${GCS_SERVICE_ACCOUNT_KEY_JSON}"
