# strad config for the staging deployment.
#
# CI reads this, renders it into a DigitalOcean App Platform spec (see
# src/deploy/appspec.ts) and injects the secret values from GCP Secret Manager
# (strad-staging-*). It exercises all three server kinds on purpose — staging
# that only proves the easy path is not proving much.
#
# This file is CREDENTIAL-FREE: every secret is a ${NAME} reference resolved at
# render time from GCP Secret Manager. A referenced ${NAME} that is not seeded
# FAILS the render, loudly, rather than deploying a half-authenticated gateway.
#
# ---------------------------------------------------------------------------
# CAPABILITY LIVES AT THE GATEWAY. TWO COMPONENTS, NOT THIRTEEN.
# ---------------------------------------------------------------------------
# This file declares twenty-six server SLUGS: twenty-four supplementary-image
# entries (which land on fifteen upstream mounts inside the one bundle image,
# because capability variants share a mount), the `echo` builtin in core, and the
# `deepwiki` remote-http canary.
#
# It used to be twelve bundles for twenty-six slugs, and the reason was
# small and stupid: a server's capability was a CONTAINER env var
# (`GMAIL_ENABLED_TOOLGROUPS=readonly`). A component's env is the union of its
# servers' env maps, so gmail-ro (=readonly) and gmail-rw (=readwrite) wanted two
# values of one variable — they could not share a container, so every capability
# variant bought its own billed component.
#
# Now the gateway owns capability. Each server below carries a `tools:` policy
# that strad enforces on tools/list AND on tools/call (a withheld tool is refused
# before it reaches the upstream — see src/gateway/toolPolicy.ts). So ONE
# container runs every upstream at FULL capability, and `gmail-ro` and `gmail-rw`
# are two entries pointing at the same container, the same path, differing only
# in what they are allowed to do.
#
# The capability is still baked into the SLUG (`onepassword-ro` vs
# `onepassword-rw`), because that is what `?servers=<slug>` selects and what a
# human reads. Nothing about the user-facing model changed.
#
# THE TRADE, stated plainly: read-only used to be PHYSICS (a container that did
# not contain a write tool). It is now POLICY (a gateway that declines). The
# sharpest edge is 1Password: the read-only variant used to also hold a read-only
# SERVICE ACCOUNT token, so 1Password itself would refuse a write. One container
# can hold one token, so it holds the read-write one, and `onepassword-ro` is now
# read-only because strad says so. See HACKS.md #22.
#
# EVERY VARIANT OF A FAMILY DECLARES ITS OWN CREDENTIALS, identically. The
# component's env is the union of its servers' env maps, so this is a no-op at
# deploy time — and it is deliberate: with the credential declared on only one
# variant, setting `enabled: false` on THAT variant would silently strip the
# secret from its siblings, which would keep listing their tools and fail every
# call with an auth error naming no cause.
#
# The allow-lists below are derived from each upstream's own tool-group
# definitions, so the counts stay honest: slack 4/9 · tailscale 7/15 ·
# monarch 10/23 · gmail 5/7/8 · google-docs 4/10/11 · google-calendar 4/7 ·
# 1Password 5/9. test/staging-config.test.ts asserts every one of those numbers.

version: 1

gateway:
  name: strad
  env: staging
  publicUrl: https://staging.strad.tadasant.com

auth:
  google:
    enabled: false # flips to true the moment GOOGLE_CLIENT_ID/SECRET land
    hostedDomain: tadasant.com
    roles: [admin]
  staticTokens:
    enabled: true
    store: env
  consoleDevBypass:
    enabled: true
    roles: [admin]

roles:
  admin:
    servers: ["*"]
  # A deliberately narrow role. The 424 fail-closed path is only meaningful if
  # something is actually withheld from someone.
  echo-only:
    servers: [echo]

bundles:
  # THE bundle. One image, one component, fifteen upstream MCP servers — the
  # bundle-api fleet, the Google trio, 1Password (with the `op` CLI baked in) and
  # the three browser servers, which share ONE Chromium (never one per server:
  # see servers/bundle/host/src/browser.ts).
  #
  # SIZE. 2GB, and the reasoning is measured, not guessed. With two browser
  # servers logging in concurrently the container's working set is ~760MB (the
  # single Chromium's process tree accounts for ~940MB RSS, most of it shared),
  # and Node with fifteen servers registered adds ~200MB. 0.5GB is absurd here;
  # 1GB would be one bad page render from an OOM that takes all 26 slugs down
  # with it. The real constraint is CPU — 1 shared vCPU serialises Chromium's
  # rendering, and that box now also answers every Slack and Gmail call — so if
  # the OpenTelemetry data shows event-loop lag or CPU saturation, the next move
  # is apps-d-1vcpu-2gb ($39, dedicated CPU), not more RAM.
  - name: bundle
    instanceSizeSlug: apps-s-1vcpu-2gb

servers:
  # kind: builtin, in the gateway process.
  - slug: echo
    kind: builtin
    module: "./servers/echo.js"
    bundle: core
    entitlements: [admin, echo-only]
    options:
      greeting: "hello from the core gateway"

  # kind: remote-http. A real third-party MCP server on the public internet,
  # proxied through strad. No credential needed for this one, which is why it
  # makes a good staging canary.
  - slug: deepwiki
    kind: remote-http
    url: https://mcp.deepwiki.com/mcp
    entitlements: [admin]

  # ---------------------------------------------------------------------------
  # Slack — 9 tools full, 4 read-only. ONE container, ONE path, TWO slugs.
  # ---------------------------------------------------------------------------
  - slug: slack
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /slack
    entitlements: [admin]
    env:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"

  - slug: slack-readonly
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /slack
    entitlements: [admin]
    env:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
    tools:
      allow:
        - slack_get_channels
        - slack_get_channel
        - slack_get_thread
        - slack_download_file

  # ---------------------------------------------------------------------------
  # Tailscale — 15 tools full, 7 read-only (policy/devices/keys, reads only).
  # ---------------------------------------------------------------------------
  - slug: tailscale-readwrite
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /tailscale
    entitlements: [admin]
    env:
      TAILSCALE_API_KEY: "${TAILSCALE_API_KEY}"

  - slug: tailscale-readonly
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /tailscale
    entitlements: [admin]
    env:
      TAILSCALE_API_KEY: "${TAILSCALE_API_KEY}"
    tools:
      allow:
        - get_policy_file
        - validate_policy_file
        - list_devices
        - get_device
        - get_device_routes
        - list_keys
        - get_key

  # ---------------------------------------------------------------------------
  # Monarch Money — 23 tools full, 10 read-only.
  # ---------------------------------------------------------------------------
  - slug: monarch-money-readwrite
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /monarch-money
    entitlements: [admin]
    env:
      MONARCH_SESSION_TOKEN: "${MONARCH_SESSION_TOKEN}"

  - slug: monarch-money-readonly
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /monarch-money
    entitlements: [admin]
    env:
      MONARCH_SESSION_TOKEN: "${MONARCH_SESSION_TOKEN}"
    tools:
      allow:
        - check_authentication
        - get_accounts
        - get_account_balance_history
        - get_net_worth
        - get_transactions
        - get_transaction_details
        - get_categories
        - get_tags
        - get_transaction_rules
        - get_budgets

  # ---------------------------------------------------------------------------
  # The rest of the pure-API fleet. No capability variants; no policy.
  # ---------------------------------------------------------------------------
  - slug: serpapi-hotels
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /serpapi-hotels
    entitlements: [admin]
    env:
      SERPAPI_API_KEY: "${SERPAPI_API_KEY}"

  # No credential at all — public endpoints. The zero-secret supplementary canary.
  - slug: google-flights
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-flights
    entitlements: [admin]

  # GCS-backed screenshot store, pinned to its own bucket.
  #
  # ITS ENV IS SLUG-NAMESPACED, and that is load-bearing: `gcs` (below) and
  # `remote-filesystem-tmp-public` both read `GCS_BUCKET` from the process environment,
  # and they point at DIFFERENT buckets. That collision is why gcs used to need a
  # component of its own. In one container it cannot be resolved by env at all,
  # so the bundle host hands remote-filesystem-tmp-public an explicit client built from
  # these REMOTE_FILESYSTEM_TMP_PUBLIC_* names and it stops reading the bare ones.
  #
  # ITS TWO CREDENTIALS COME FROM THE SECRETS SYSTEM, not from hand-written
  # `${REF}` secrets. `params: true` opts this server into parameter resolution:
  # at deploy time render-spec resolves everything under
  # `/strad/staging/mcp/remote-filesystem-tmp-public/static/*` — the non-secret
  # REMOTE_FILESYSTEM_TMP_PUBLIC_GCS_CLIENT_EMAIL from Parameter Manager and the secret
  # REMOTE_FILESYSTEM_TMP_PUBLIC_GCS_PRIVATE_KEY from Secret Manager — and injects them
  # as SECRET env vars onto this bundle. A human sets both in the console
  # (/ui/secrets); the container holds no cloud credential. The bucket is
  # deployment config, not a credential, so it stays a literal here.
  - slug: remote-filesystem-tmp-public
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /remote-filesystem-tmp-public
    entitlements: [admin]
    params: true
    env:
      REMOTE_FILESYSTEM_TMP_PUBLIC_GCS_BUCKET: "remote-filesystem-tadas"

  # Google Cloud Storage. Keeps the bare GCS_* names (remote-filesystem-tmp-public is the
  # one that moved). GCS_BUCKET pins every operation to ONE bucket and is also
  # what the human /ui/gcs view scopes to (src/ui/resolve.ts). pulse_public is the
  # deliberate choice: the service account can reach the transcript buckets too,
  # and an MCP endpoint pointed at "…secret-do-not-share…" by default is not a
  # posture worth having.
  - slug: gcs
    kind: supplementary-image
    title: Google Cloud Storage
    description: Browse the object store this server is scoped to.
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /gcs
    entitlements: [admin]
    env:
      GCS_PROJECT_ID: "pulse-443819"
      GCS_BUCKET: "pulse_public"
      GCS_SERVICE_ACCOUNT_KEY_JSON: "${GCS_PULSEMCP_SERVICE_ACCOUNT_KEY_JSON}"
    # The SAME key, additionally scoped to core, because /ui/gcs renders THERE.
    # `env:` lands on the bundle only, so without this the console resolves the
    # ${ref} against a bag that does not contain it and degrades to "credentials
    # are declared but not injected" — while the MCP tools work fine, which is a
    # confusing pair of symptoms. Unlike the `secrets` server, where the console
    # deliberately holds a STRONGER credential than the bundle, this is the same
    # value in both places: the browse view reads exactly the bucket the server
    # is already scoped to.
    consoleEnv:
      GCS_SERVICE_ACCOUNT_KEY_JSON: "${GCS_PULSEMCP_SERVICE_ACCOUNT_KEY_JSON}"

  # ---------------------------------------------------------------------------
  # secrets — the store-agnostic parameters manager. Parameter Manager indexes
  # everything; Secret Manager backs the secret parts. Its MCP surface CANNOT
  # return a SECRET value.
  #
  # THIS ENTRY IS THE SECURITY BOUNDARY. Three credentials, three roles:
  #
  #   env:         SECRETS_SERVICE_ACCOUNT_KEY_JSON        -> the BUNDLE (viewer)
  #   consoleEnv:  SECRETS_ADMIN_SERVICE_ACCOUNT_KEY_JSON  -> CORE only (admin)
  #   STRAD_PARAMS_RESOLVER_SERVICE_ACCOUNT_KEY_JSON       -> DEPLOY only (resolver)
  #
  # `env:` lands on the container that answers /mcp. It gets the VIEWER service
  # account: Parameter Manager list/get and parameterVersions.get (so it can
  # read the index and NON-SECRET values) and NOT secretmanager.versions.access.
  # A secret parameter's value lives in Secret Manager, which this credential
  # cannot reach, so the MCP path can see that a parameter exists, its kind and
  # note, and read a non-secret value — and Google refuses it a secret value. A
  # prompt injection that talks a tool into reading a secret gets a 403.
  #
  # `consoleEnv:` lands on the CORE component and nowhere else (appspec.ts is
  # explicit about it; a broadcast SECRET would have reached the bundle too). It
  # carries the ADMIN service account, which CAN add, rotate, reveal and delete
  # both kinds — driven only by a human on /ui/secrets, behind the console SSO
  # gate. There is no code path from /mcp to it.
  #
  # The RESOLVER account (STRAD_PARAMS_*, set in the deploy environment, NOT here)
  # reads both stores' values at deploy time to inject a `params: true` server's
  # env. It writes nothing and never reaches a running container.
  #
  # NAMESPACE, AND WHERE THE FENCE ACTUALLY IS. The path prefix
  # `/strad/staging/mcp/` is a code-level guard on the MCP half: that server
  # refuses to list an unmanaged namespace. On the console half the same list is
  # only a set of suggestions (SECRETS_NAMESPACES_STRICT would make it a limit). It is NOT
  # the IAM boundary — put these parameters in a project that holds ONLY them, not
  # the project holding strad's own strad-staging-* secrets. Then the viewer can
  # describe everything in that project and read no secret value; the admin can do
  # anything in that project and cannot see strad's own secrets, because they are
  # elsewhere. See servers/secrets/README.md.
  #
  # The project id and namespace are NON-SECRET config, so they are LITERALS here
  # (like `gcs`'s GCS_PROJECT_ID above) — not `${refs}`. Only the two service-
  # account KEYS are secret: they are seeded in Secret Manager as
  # strad-staging-SECRETS_VIEWER_KEY_JSON and strad-staging-SECRETS_ADMIN_KEY_JSON,
  # and render-spec fails the deploy if either is missing. If you name the secrets
  # project something other than `strad-secrets-staging`, there are THREE sites:
  # the two SECRETS_PROJECT_ID literals below, and the --project flag on the
  # capability-report step in .github/workflows/deploy-staging.yml.
  - slug: secrets
    kind: supplementary-image
    title: Secrets & parameters
    description: Add, rotate, reveal and delete non-secret and secret parameters. The MCP server can never return a secret value.
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /secrets
    entitlements: [admin]
    env:
      SECRETS_PROJECT_ID: "strad-secrets-staging"
      SECRETS_NAMESPACES: "/strad/staging/mcp/"
      SECRETS_CONSOLE_URL: "https://staging.strad.tadasant.com/ui/secrets"
      # STAGING'S MCP CREDENTIAL IS READ+WRITE, and prod's is not. The key name is
      # unchanged; what changes is the IAM behind it in the staging project only
      # (servers/secrets/README.md has the grants).
      #
      # The server does not take that on faith. At startup it asks Google which
      # permissions this credential holds (`projects:testIamPermissions`) and
      # DERIVES its tool surface from the answer — see
      # servers/secrets/shared/src/capabilities.ts. So prod, whose key is a
      # viewer, lists four read-only tools exactly as before, and staging lists
      # the write tools too. There is no flag claiming a capability the credential
      # might not have, because a flag can be wrong and a probe cannot.
      #
      # THE PROD PROPERTY IS UNCHANGED: prod's `/mcp` still cannot read a secret
      # value, because prod's credential still lacks
      # secretmanager.versions.access. Staging relaxing this is deliberate and
      # scoped to a project that holds nothing worth protecting.
      SECRETS_SERVICE_ACCOUNT_KEY_JSON: "${SECRETS_VIEWER_KEY_JSON}"
    consoleEnv:
      SECRETS_PROJECT_ID: "strad-secrets-staging"
      # REVEAL, opted in for staging and absent in prod. Two independent layers:
      # this flag decides what the console OFFERS; whether the console's service
      # account holds `secretmanager.versions.access` decides what is POSSIBLE.
      # Both must say yes and the narrower wins (src/ui/reveal.ts). Absent = off,
      # so a new environment cannot inherit reveal by forgetting to think about it.
      #
      # Staging says yes because `strad-secrets-staging` holds nothing sensitive
      # and round-tripping a value is how the store gets tested. Prod says no,
      # and its admin SA is being downgraded to write-without-read so that the
      # "no" is IAM rather than markup — see servers/secrets/README.md.
      SECRETS_REVEAL_ENABLED: "true"
      # TWO namespaces on the console side, ONE on the MCP side above, and the
      # asymmetry is the point. `/strad/staging/gateway/static/` holds the
      # deployment's own ${NAME} references — the token store, the OAuth client
      # secret — which a HUMAN manages here and an AGENT has no business
      # enumerating. The console's admin credential can already reach the whole
      # project, so listing this namespace widens what is addressable, not what is
      # permitted; the viewer's list stays scoped to the servers' namespace.
      SECRETS_NAMESPACES: "/strad/staging/mcp/,/strad/staging/gateway/static/"
      # Parameter Manager admin + Secret Manager admin. Core only. Humans only.
      SECRETS_ADMIN_SERVICE_ACCOUNT_KEY_JSON: "${SECRETS_ADMIN_KEY_JSON}"

  # ---------------------------------------------------------------------------
  # Gmail — 8 tools full, 7 read-write, 5 read-only. THREE slugs, ONE container.
  #
  # DWD is a Workspace-admin dependency: until the service account's client ID is
  # authorized for the scopes, tools LIST fine but tool CALLS fail. See
  # images/bundle-google/README.md.
  # ---------------------------------------------------------------------------
  - slug: gmail-ro
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /gmail
    entitlements: [admin]
    env:
      GMAIL_SERVICE_ACCOUNT_CLIENT_EMAIL: "${GMAIL_TADAS_SERVICE_ACCOUNT_CLIENT_EMAIL}"
      GMAIL_SERVICE_ACCOUNT_PRIVATE_KEY: "${GMAIL_TADAS_SERVICE_ACCOUNT_PRIVATE_KEY}"
      GMAIL_IMPERSONATE_EMAIL: "${GMAIL_IMPERSONATE_EMAIL}"
    tools:
      allow:
        - list_email_conversations
        - get_email_conversation
        - search_email_conversations
        - download_email_attachments
        - list_draft_emails

  - slug: gmail-rw
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /gmail
    entitlements: [admin]
    env:
      GMAIL_SERVICE_ACCOUNT_CLIENT_EMAIL: "${GMAIL_TADAS_SERVICE_ACCOUNT_CLIENT_EMAIL}"
      GMAIL_SERVICE_ACCOUNT_PRIVATE_KEY: "${GMAIL_TADAS_SERVICE_ACCOUNT_PRIVATE_KEY}"
      GMAIL_IMPERSONATE_EMAIL: "${GMAIL_IMPERSONATE_EMAIL}"
    tools:
      allow:
        - list_email_conversations
        - get_email_conversation
        - search_email_conversations
        - download_email_attachments
        - list_draft_emails
        - change_email_conversation
        - upsert_draft_email

  # readwrite_external: the tier that may act on people OUTSIDE the org (send
  # mail to, share docs with). It is the only tier that gets `send_email`.
  - slug: gmail-rw-external
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /gmail
    entitlements: [admin]
    env:
      GMAIL_SERVICE_ACCOUNT_CLIENT_EMAIL: "${GMAIL_TADAS_SERVICE_ACCOUNT_CLIENT_EMAIL}"
      GMAIL_SERVICE_ACCOUNT_PRIVATE_KEY: "${GMAIL_TADAS_SERVICE_ACCOUNT_PRIVATE_KEY}"
      GMAIL_IMPERSONATE_EMAIL: "${GMAIL_IMPERSONATE_EMAIL}"
    # No `tools:` — every tool this server has. The full set IS this tier.

  # ---------------------------------------------------------------------------
  # Google Docs — 11 full, 10 read-write, 4 read-only.
  # ---------------------------------------------------------------------------
  - slug: google-docs-ro
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-docs
    entitlements: [admin]
    env:
      GOOGLE_DOCS_SERVICE_ACCOUNT_CLIENT_EMAIL: "${GOOGLE_DOCS_TADAS_SERVICE_ACCOUNT_CLIENT_EMAIL}"
      GOOGLE_DOCS_SERVICE_ACCOUNT_PRIVATE_KEY: "${GOOGLE_DOCS_TADAS_SERVICE_ACCOUNT_PRIVATE_KEY}"
      GOOGLE_DOCS_IMPERSONATE_EMAIL: "${GOOGLE_DOCS_IMPERSONATE_EMAIL}"
    tools:
      allow:
        - get_document
        - get_document_outline
        - export_document
        - list_comments

  - slug: google-docs-rw
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-docs
    entitlements: [admin]
    env:
      GOOGLE_DOCS_SERVICE_ACCOUNT_CLIENT_EMAIL: "${GOOGLE_DOCS_TADAS_SERVICE_ACCOUNT_CLIENT_EMAIL}"
      GOOGLE_DOCS_SERVICE_ACCOUNT_PRIVATE_KEY: "${GOOGLE_DOCS_TADAS_SERVICE_ACCOUNT_PRIVATE_KEY}"
      GOOGLE_DOCS_IMPERSONATE_EMAIL: "${GOOGLE_DOCS_IMPERSONATE_EMAIL}"
    tools:
      allow:
        - get_document
        - get_document_outline
        - export_document
        - list_comments
        - create_document
        - update_document
        - delete_document
        - append_text
        - insert_text
        - replace_text

  - slug: google-docs-rw-external
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-docs
    entitlements: [admin]
    env:
      GOOGLE_DOCS_SERVICE_ACCOUNT_CLIENT_EMAIL: "${GOOGLE_DOCS_TADAS_SERVICE_ACCOUNT_CLIENT_EMAIL}"
      GOOGLE_DOCS_SERVICE_ACCOUNT_PRIVATE_KEY: "${GOOGLE_DOCS_TADAS_SERVICE_ACCOUNT_PRIVATE_KEY}"
      GOOGLE_DOCS_IMPERSONATE_EMAIL: "${GOOGLE_DOCS_IMPERSONATE_EMAIL}"
    # No `tools:` — the full 11, including share_document (the external one).

  # ---------------------------------------------------------------------------
  # Google Calendar — 7 full, 4 read-only. (No external tier exists.)
  # ---------------------------------------------------------------------------
  - slug: google-calendar-ro
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-calendar
    entitlements: [admin]
    env:
      GCAL_SERVICE_ACCOUNT_CLIENT_EMAIL: "${GOOGLE_CALENDAR_TADAS_SERVICE_ACCOUNT_CLIENT_EMAIL}"
      GCAL_SERVICE_ACCOUNT_PRIVATE_KEY: "${GOOGLE_CALENDAR_TADAS_SERVICE_ACCOUNT_PRIVATE_KEY}"
      GCAL_IMPERSONATE_EMAIL: "${GCAL_IMPERSONATE_EMAIL}"
    tools:
      allow:
        - list_calendar_events
        - get_calendar_event
        - list_calendars
        - query_calendar_freebusy

  - slug: google-calendar-rw
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-calendar
    entitlements: [admin]
    env:
      GCAL_SERVICE_ACCOUNT_CLIENT_EMAIL: "${GOOGLE_CALENDAR_TADAS_SERVICE_ACCOUNT_CLIENT_EMAIL}"
      GCAL_SERVICE_ACCOUNT_PRIVATE_KEY: "${GOOGLE_CALENDAR_TADAS_SERVICE_ACCOUNT_PRIVATE_KEY}"
      GCAL_IMPERSONATE_EMAIL: "${GCAL_IMPERSONATE_EMAIL}"
    # No `tools:` — all 7.

  # ---------------------------------------------------------------------------
  # 1Password — 9 tools full, 5 read-only. THE sharpest edge of this design.
  #
  # The read-only variant used to be locked TWICE: a read-only service-account
  # token (1Password itself refuses the write) AND a tool-group filter. One
  # container holds one token, and onepassword-rw needs the read-WRITE one — so
  # `onepassword-ro` is now read-only because the GATEWAY refuses the call, and
  # for no other reason. That is the trade this whole re-architecture makes,
  # concentrated into one server. HACKS.md #22 records it.
  #
  # The server refuses to serve without an elicitation posture; strad has no
  # elicitation transport wired yet, so it skips them explicitly.
  # ---------------------------------------------------------------------------
  - slug: onepassword-ro
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /onepassword
    entitlements: [admin]
    timeoutMs: 120000
    env:
      OP_SERVICE_ACCOUNT_TOKEN: "${OP_SERVICE_ACCOUNT_TOKEN_TADAS_RW}"
      DANGEROUSLY_SKIP_ELICITATIONS: "true"
    tools:
      allow:
        - onepassword_list_vaults
        - onepassword_list_items
        - onepassword_get_item
        - onepassword_get_item_metadata
        - onepassword_list_items_by_tag

  - slug: onepassword-rw
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /onepassword
    entitlements: [admin]
    timeoutMs: 120000
    env:
      OP_SERVICE_ACCOUNT_TOKEN: "${OP_SERVICE_ACCOUNT_TOKEN_TADAS_RW}"
      DANGEROUSLY_SKIP_ELICITATIONS: "true"
    # No `tools:` — all nine.

  # ---------------------------------------------------------------------------
  # Browser-driven servers. Each drives a real headless Chromium and logs into a
  # real account, so its tool calls can take a while — timeoutMs is set well above
  # the MCP SDK's silent 60s default, which would otherwise kill them mid-flow.
  #
  # They now share ONE Chromium (one browser process, a context each). Three
  # browsers on one shared vCPU was never going to work; one browser with three
  # contexts is ~1GB peak RSS and the isolation that matters (cookies, logins) is
  # per-context anyway.
  # ---------------------------------------------------------------------------
  - slug: good-eggs
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /good-eggs
    entitlements: [admin]
    timeoutMs: 120000
    env:
      GOODEGGS_EMAIL: "${GOODEGGS_EMAIL}"
      GOODEGGS_PASSWORD: "${GOODEGGS_PASSWORD}"

  - slug: fetchpet
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /fetchpet
    entitlements: [admin]
    timeoutMs: 180000
    env:
      FETCHPET_USERNAME: "${FETCHPET_USERNAME}"
      FETCHPET_PASSWORD: "${FETCHPET_PASSWORD}"

  - slug: pointsyeah
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /pointsyeah
    entitlements: [admin]
    timeoutMs: 180000
    env:
      POINTSYEAH_REFRESH_TOKEN: "${POINTSYEAH_REFRESH_TOKEN}"
