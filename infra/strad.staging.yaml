# strad config for the staging deployment.
#
# CI reads this, renders it into a DigitalOcean App Platform spec (see
# src/deploy/appspec.ts) and injects the secret values from GCP Secret Manager
# (strad-staging-*). It exercises all three server kinds on purpose — staging
# that only proves the easy path is not proving much.
#
# This file is CREDENTIAL-FREE: every secret is a ${NAME} reference resolved at
# render time from GCP Secret Manager. A referenced ${NAME} that is not seeded
# FAILS the render, loudly, rather than deploying a half-authenticated gateway.
#
# ---------------------------------------------------------------------------
# CAPABILITY LIVES AT THE GATEWAY. TWO COMPONENTS, NOT THIRTEEN.
# ---------------------------------------------------------------------------
# This used to be twelve bundles for twenty-six servers, and the reason was
# small and stupid: a server's capability was a CONTAINER env var
# (`GMAIL_ENABLED_TOOLGROUPS=readonly`). A component's env is the union of its
# servers' env maps, so gmail-ro (=readonly) and gmail-rw (=readwrite) wanted two
# values of one variable — they could not share a container, so every capability
# variant bought its own billed component.
#
# Now the gateway owns capability. Each server below carries a `tools:` policy
# that strad enforces on tools/list AND on tools/call (a withheld tool is refused
# before it reaches the upstream — see src/gateway/toolPolicy.ts). So ONE
# container runs every upstream at FULL capability, and `gmail-ro` and `gmail-rw`
# are two entries pointing at the same container, the same path, differing only
# in what they are allowed to do.
#
# The capability is still baked into the SLUG (`onepassword-ro` vs
# `onepassword-rw`), because that is what `?servers=<slug>` selects and what a
# human reads. Nothing about the user-facing model changed.
#
# THE TRADE, stated plainly: read-only used to be PHYSICS (a container that did
# not contain a write tool). It is now POLICY (a gateway that declines). The
# sharpest edge is 1Password: the read-only variant used to also hold a read-only
# SERVICE ACCOUNT token, so 1Password itself would refuse a write. One container
# can hold one token, so it holds the read-write one, and `onepassword-ro` is now
# read-only because strad says so. See HACKS.md #22.
#
# EVERY VARIANT OF A FAMILY DECLARES ITS OWN CREDENTIALS, identically. The
# component's env is the union of its servers' env maps, so this is a no-op at
# deploy time — and it is deliberate: with the credential declared on only one
# variant, setting `enabled: false` on THAT variant would silently strip the
# secret from its siblings, which would keep listing their tools and fail every
# call with an auth error naming no cause.
#
# The allow-lists below are derived from each upstream's own tool-group
# definitions, so the counts stay honest: slack 4/9 · tailscale 7/15 ·
# monarch 10/23 · gmail 5/7/8 · google-docs 4/10/11 · google-calendar 4/7 ·
# 1Password 5/9. test/staging-config.test.ts asserts every one of those numbers.

version: 1

gateway:
  name: strad
  env: staging
  publicUrl: https://staging.strad.tadasant.com

auth:
  google:
    enabled: false # flips to true the moment GOOGLE_CLIENT_ID/SECRET land
    hostedDomain: tadasant.com
    roles: [admin]
  staticTokens:
    enabled: true
    store: env
  consoleDevBypass:
    enabled: true
    roles: [admin]

roles:
  admin:
    servers: ["*"]
  # A deliberately narrow role. The 424 fail-closed path is only meaningful if
  # something is actually withheld from someone.
  echo-only:
    servers: [echo]

bundles:
  # THE bundle. One image, one component, fourteen upstream MCP servers — the
  # bundle-api fleet, the Google trio, 1Password (with the `op` CLI baked in) and
  # the three browser servers, which share ONE Chromium (never one per server:
  # see servers/bundle/host/src/browser.ts).
  #
  # SIZE. 2GB, and the reasoning is measured, not guessed. With two browser
  # servers logging in concurrently the container's working set is ~760MB (the
  # single Chromium's process tree accounts for ~940MB RSS, most of it shared),
  # and Node with fourteen servers registered adds ~200MB. 0.5GB is absurd here;
  # 1GB would be one bad page render from an OOM that takes all 25 slugs down
  # with it. The real constraint is CPU — 1 shared vCPU serialises Chromium's
  # rendering, and that box now also answers every Slack and Gmail call — so if
  # the OpenTelemetry data shows event-loop lag or CPU saturation, the next move
  # is apps-d-1vcpu-2gb ($39, dedicated CPU), not more RAM.
  - name: bundle
    instanceSizeSlug: apps-s-1vcpu-2gb

servers:
  # kind: builtin, in the gateway process.
  - slug: echo
    kind: builtin
    module: "./servers/echo.js"
    bundle: core
    entitlements: [admin, echo-only]
    options:
      greeting: "hello from the core gateway"

  # kind: remote-http. A real third-party MCP server on the public internet,
  # proxied through strad. No credential needed for this one, which is why it
  # makes a good staging canary.
  - slug: deepwiki
    kind: remote-http
    url: https://mcp.deepwiki.com/mcp
    entitlements: [admin]

  # ---------------------------------------------------------------------------
  # Slack — 9 tools full, 4 read-only. ONE container, ONE path, TWO slugs.
  # ---------------------------------------------------------------------------
  - slug: slack
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /slack
    entitlements: [admin]
    env:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"

  - slug: slack-readonly
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /slack
    entitlements: [admin]
    env:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
    tools:
      allow:
        - slack_get_channels
        - slack_get_channel
        - slack_get_thread
        - slack_download_file

  # ---------------------------------------------------------------------------
  # Tailscale — 15 tools full, 7 read-only (policy/devices/keys, reads only).
  # ---------------------------------------------------------------------------
  - slug: tailscale-readwrite
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /tailscale
    entitlements: [admin]
    env:
      TAILSCALE_API_KEY: "${TAILSCALE_API_KEY}"

  - slug: tailscale-readonly
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /tailscale
    entitlements: [admin]
    env:
      TAILSCALE_API_KEY: "${TAILSCALE_API_KEY}"
    tools:
      allow:
        - get_policy_file
        - validate_policy_file
        - list_devices
        - get_device
        - get_device_routes
        - list_keys
        - get_key

  # ---------------------------------------------------------------------------
  # Monarch Money — 23 tools full, 10 read-only.
  # ---------------------------------------------------------------------------
  - slug: monarch-money-readwrite
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /monarch-money
    entitlements: [admin]
    env:
      MONARCH_SESSION_TOKEN: "${MONARCH_SESSION_TOKEN}"

  - slug: monarch-money-readonly
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /monarch-money
    entitlements: [admin]
    env:
      MONARCH_SESSION_TOKEN: "${MONARCH_SESSION_TOKEN}"
    tools:
      allow:
        - check_authentication
        - get_accounts
        - get_account_balance_history
        - get_net_worth
        - get_transactions
        - get_transaction_details
        - get_categories
        - get_tags
        - get_transaction_rules
        - get_budgets

  # ---------------------------------------------------------------------------
  # The rest of the pure-API fleet. No capability variants; no policy.
  # ---------------------------------------------------------------------------
  - slug: serpapi-hotels
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /serpapi-hotels
    entitlements: [admin]
    env:
      SERPAPI_API_KEY: "${SERPAPI_API_KEY}"

  # No credential at all — public endpoints. The zero-secret supplementary canary.
  - slug: google-flights
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-flights
    entitlements: [admin]

  # GCS-backed filesystem, pinned to its own bucket.
  #
  # ITS ENV IS SLUG-NAMESPACED, and that is load-bearing: `gcs` (below) and
  # `remote-filesystem` both read `GCS_BUCKET` from the process environment, and
  # they point at DIFFERENT buckets. That collision is why gcs used to need a
  # component of its own. In one container it cannot be resolved by env at all,
  # so the bundle host hands remote-filesystem an explicit client built from
  # these REMOTE_FILESYSTEM_* names and it stops reading the bare ones.
  - slug: remote-filesystem
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /remote-filesystem
    entitlements: [admin]
    env:
      REMOTE_FILESYSTEM_GCS_BUCKET: "remote-filesystem-tadas"
      REMOTE_FILESYSTEM_GCS_CLIENT_EMAIL: "${REMOTE_FS_SCREENSHOTS_GCS_CLIENT_EMAIL}"
      REMOTE_FILESYSTEM_GCS_PRIVATE_KEY: "${REMOTE_FS_SCREENSHOTS_GCS_PRIVATE_KEY}"

  # Google Cloud Storage. Keeps the bare GCS_* names (remote-filesystem is the
  # one that moved). GCS_BUCKET pins every operation to ONE bucket and is also
  # what the human /ui/gcs view scopes to (src/ui/resolve.ts). pulse_public is the
  # deliberate choice: the service account can reach the transcript buckets too,
  # and an MCP endpoint pointed at "…secret-do-not-share…" by default is not a
  # posture worth having.
  - slug: gcs
    kind: supplementary-image
    title: Google Cloud Storage
    description: Browse the object store this server is scoped to.
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /gcs
    entitlements: [admin]
    env:
      GCS_PROJECT_ID: "pulse-443819"
      GCS_BUCKET: "pulse_public"
      GCS_SERVICE_ACCOUNT_KEY_JSON: "${GCS_PULSEMCP_SERVICE_ACCOUNT_KEY_JSON}"

  # ---------------------------------------------------------------------------
  # Gmail — 8 tools full, 7 read-write, 5 read-only. THREE slugs, ONE container.
  #
  # DWD is a Workspace-admin dependency: until the service account's client ID is
  # authorized for the scopes, tools LIST fine but tool CALLS fail. See
  # images/bundle-google/README.md.
  # ---------------------------------------------------------------------------
  - slug: gmail-ro
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /gmail
    entitlements: [admin]
    env:
      GMAIL_SERVICE_ACCOUNT_CLIENT_EMAIL: "${GMAIL_TADAS_SERVICE_ACCOUNT_CLIENT_EMAIL}"
      GMAIL_SERVICE_ACCOUNT_PRIVATE_KEY: "${GMAIL_TADAS_SERVICE_ACCOUNT_PRIVATE_KEY}"
      GMAIL_IMPERSONATE_EMAIL: "${GMAIL_IMPERSONATE_EMAIL}"
    tools:
      allow:
        - list_email_conversations
        - get_email_conversation
        - search_email_conversations
        - download_email_attachments
        - list_draft_emails

  - slug: gmail-rw
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /gmail
    entitlements: [admin]
    env:
      GMAIL_SERVICE_ACCOUNT_CLIENT_EMAIL: "${GMAIL_TADAS_SERVICE_ACCOUNT_CLIENT_EMAIL}"
      GMAIL_SERVICE_ACCOUNT_PRIVATE_KEY: "${GMAIL_TADAS_SERVICE_ACCOUNT_PRIVATE_KEY}"
      GMAIL_IMPERSONATE_EMAIL: "${GMAIL_IMPERSONATE_EMAIL}"
    tools:
      allow:
        - list_email_conversations
        - get_email_conversation
        - search_email_conversations
        - download_email_attachments
        - list_draft_emails
        - change_email_conversation
        - upsert_draft_email

  # readwrite_external: the tier that may act on people OUTSIDE the org (send
  # mail to, share docs with). It is the only tier that gets `send_email`.
  - slug: gmail-rw-external
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /gmail
    entitlements: [admin]
    env:
      GMAIL_SERVICE_ACCOUNT_CLIENT_EMAIL: "${GMAIL_TADAS_SERVICE_ACCOUNT_CLIENT_EMAIL}"
      GMAIL_SERVICE_ACCOUNT_PRIVATE_KEY: "${GMAIL_TADAS_SERVICE_ACCOUNT_PRIVATE_KEY}"
      GMAIL_IMPERSONATE_EMAIL: "${GMAIL_IMPERSONATE_EMAIL}"
    # No `tools:` — every tool this server has. The full set IS this tier.

  # ---------------------------------------------------------------------------
  # Google Docs — 11 full, 10 read-write, 4 read-only.
  # ---------------------------------------------------------------------------
  - slug: google-docs-ro
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-docs
    entitlements: [admin]
    env:
      GOOGLE_DOCS_SERVICE_ACCOUNT_CLIENT_EMAIL: "${GOOGLE_DOCS_TADAS_SERVICE_ACCOUNT_CLIENT_EMAIL}"
      GOOGLE_DOCS_SERVICE_ACCOUNT_PRIVATE_KEY: "${GOOGLE_DOCS_TADAS_SERVICE_ACCOUNT_PRIVATE_KEY}"
      GOOGLE_DOCS_IMPERSONATE_EMAIL: "${GOOGLE_DOCS_IMPERSONATE_EMAIL}"
    tools:
      allow:
        - get_document
        - get_document_outline
        - export_document
        - list_comments

  - slug: google-docs-rw
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-docs
    entitlements: [admin]
    env:
      GOOGLE_DOCS_SERVICE_ACCOUNT_CLIENT_EMAIL: "${GOOGLE_DOCS_TADAS_SERVICE_ACCOUNT_CLIENT_EMAIL}"
      GOOGLE_DOCS_SERVICE_ACCOUNT_PRIVATE_KEY: "${GOOGLE_DOCS_TADAS_SERVICE_ACCOUNT_PRIVATE_KEY}"
      GOOGLE_DOCS_IMPERSONATE_EMAIL: "${GOOGLE_DOCS_IMPERSONATE_EMAIL}"
    tools:
      allow:
        - get_document
        - get_document_outline
        - export_document
        - list_comments
        - create_document
        - update_document
        - delete_document
        - append_text
        - insert_text
        - replace_text

  - slug: google-docs-rw-external
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-docs
    entitlements: [admin]
    env:
      GOOGLE_DOCS_SERVICE_ACCOUNT_CLIENT_EMAIL: "${GOOGLE_DOCS_TADAS_SERVICE_ACCOUNT_CLIENT_EMAIL}"
      GOOGLE_DOCS_SERVICE_ACCOUNT_PRIVATE_KEY: "${GOOGLE_DOCS_TADAS_SERVICE_ACCOUNT_PRIVATE_KEY}"
      GOOGLE_DOCS_IMPERSONATE_EMAIL: "${GOOGLE_DOCS_IMPERSONATE_EMAIL}"
    # No `tools:` — the full 11, including share_document (the external one).

  # ---------------------------------------------------------------------------
  # Google Calendar — 7 full, 4 read-only. (No external tier exists.)
  # ---------------------------------------------------------------------------
  - slug: google-calendar-ro
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-calendar
    entitlements: [admin]
    env:
      GCAL_SERVICE_ACCOUNT_CLIENT_EMAIL: "${GOOGLE_CALENDAR_TADAS_SERVICE_ACCOUNT_CLIENT_EMAIL}"
      GCAL_SERVICE_ACCOUNT_PRIVATE_KEY: "${GOOGLE_CALENDAR_TADAS_SERVICE_ACCOUNT_PRIVATE_KEY}"
      GCAL_IMPERSONATE_EMAIL: "${GCAL_IMPERSONATE_EMAIL}"
    tools:
      allow:
        - list_calendar_events
        - get_calendar_event
        - list_calendars
        - query_calendar_freebusy

  - slug: google-calendar-rw
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /google-calendar
    entitlements: [admin]
    env:
      GCAL_SERVICE_ACCOUNT_CLIENT_EMAIL: "${GOOGLE_CALENDAR_TADAS_SERVICE_ACCOUNT_CLIENT_EMAIL}"
      GCAL_SERVICE_ACCOUNT_PRIVATE_KEY: "${GOOGLE_CALENDAR_TADAS_SERVICE_ACCOUNT_PRIVATE_KEY}"
      GCAL_IMPERSONATE_EMAIL: "${GCAL_IMPERSONATE_EMAIL}"
    # No `tools:` — all 7.

  # ---------------------------------------------------------------------------
  # 1Password — 9 tools full, 5 read-only. THE sharpest edge of this design.
  #
  # The read-only variant used to be locked TWICE: a read-only service-account
  # token (1Password itself refuses the write) AND a tool-group filter. One
  # container holds one token, and onepassword-rw needs the read-WRITE one — so
  # `onepassword-ro` is now read-only because the GATEWAY refuses the call, and
  # for no other reason. That is the trade this whole re-architecture makes,
  # concentrated into one server. HACKS.md #21 records it.
  #
  # The server refuses to serve without an elicitation posture; strad has no
  # elicitation transport wired yet, so it skips them explicitly.
  # ---------------------------------------------------------------------------
  - slug: onepassword-ro
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /onepassword
    entitlements: [admin]
    timeoutMs: 120000
    env:
      OP_SERVICE_ACCOUNT_TOKEN: "${OP_SERVICE_ACCOUNT_TOKEN_TADAS_RW}"
      DANGEROUSLY_SKIP_ELICITATIONS: "true"
    tools:
      allow:
        - onepassword_list_vaults
        - onepassword_list_items
        - onepassword_get_item
        - onepassword_get_item_metadata
        - onepassword_list_items_by_tag

  - slug: onepassword-rw
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /onepassword
    entitlements: [admin]
    timeoutMs: 120000
    env:
      OP_SERVICE_ACCOUNT_TOKEN: "${OP_SERVICE_ACCOUNT_TOKEN_TADAS_RW}"
      DANGEROUSLY_SKIP_ELICITATIONS: "true"
    # No `tools:` — all nine.

  # ---------------------------------------------------------------------------
  # Browser-driven servers. Each drives a real headless Chromium and logs into a
  # real account, so its tool calls can take a while — timeoutMs is set well above
  # the MCP SDK's silent 60s default, which would otherwise kill them mid-flow.
  #
  # They now share ONE Chromium (one browser process, a context each). Three
  # browsers on one shared vCPU was never going to work; one browser with three
  # contexts is ~1GB peak RSS and the isolation that matters (cookies, logins) is
  # per-context anyway.
  # ---------------------------------------------------------------------------
  - slug: good-eggs
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /good-eggs
    entitlements: [admin]
    timeoutMs: 120000
    env:
      GOODEGGS_EMAIL: "${GOODEGGS_EMAIL}"
      GOODEGGS_PASSWORD: "${GOODEGGS_PASSWORD}"

  - slug: fetchpet
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /fetchpet
    entitlements: [admin]
    timeoutMs: 180000
    env:
      FETCHPET_USERNAME: "${FETCHPET_USERNAME}"
      FETCHPET_PASSWORD: "${FETCHPET_PASSWORD}"

  - slug: pointsyeah
    kind: supplementary-image
    image: ghcr.io/tadasant/strad-bundle:latest
    bundle: bundle
    path: /pointsyeah
    entitlements: [admin]
    timeoutMs: 180000
    env:
      POINTSYEAH_REFRESH_TOKEN: "${POINTSYEAH_REFRESH_TOKEN}"
